id: ln-inequality-agm-e-limit
title: Log bound, AM-GM and the limit of (1+1/n)^n
topics:
- inequalities
- logarithms
- AM-GM
- limits
- the number e
warmup: false
answer_source: pdf
statement: (i) Show that $\ln x\leq x-1$ for all $x>0$, with equality only at $x=1$. (ii) Let $a_1,\ldots,a_n>0$
  have arithmetic mean $A$. By applying (i) to each $a_i/A$, prove the AM-GM inequality $A\geq\sqrt[n]{a_1a_2\cdots
  a_n}$. (iii) Show that $\left(1+\frac1n\right)^n<e$ for every positive integer $n$. (iv) By applying
  (i) to $1/x$, show that $\left(1+\frac1n\right)^{n+1}>e$. Deduce that $\left(1+\frac1n\right)^n\to e$.
stages:
- goal: Prove that ln x <= x - 1 for all x > 0, with equality only at x = 1.
  expected: Let h(x) = x - 1 - ln x. Then h'(x) = 1 - 1/x, so h decreases on (0,1) and increases on (1,infinity).
    Hence h has a strict global minimum at x = 1, where h(1) = 0. So h(x) >= 0 with equality only at x
    = 1.
  solution: Define $h(x)=x-1-\ln x$ on $(0,\infty)$. Then $h'(x)=1-\frac1x$, which is negative on $(0,1)$
    and positive on $(1,\infty)$. So $h$ is strictly decreasing then strictly increasing, and its unique
    minimum is $h(1)=0$. Therefore $h(x)>0$ for $x\neq 1$, which gives $\ln x<x-1$ for $x\neq1$, with
    equality at $x=1$.
  common_errors:
  - Showing only that the derivative changes sign, without stating that the minimum is strict and unique.
  - Forgetting that the argument is only valid on the domain x > 0.
  - Concluding from h(1)=0 alone that h is non-negative, without checking the monotonicity on both sides
    of 1.
  hints:
    rephrase: Move everything to one side and study the resulting function on x > 0.
    smaller_case: Check numerically at x = 1/2, x = 1 and x = 2 to see which direction the inequality
      goes.
    key_idea: Study h(x) = x - 1 - ln x and find where its derivative is negative and where it is positive.
- goal: Prove AM-GM, A >= (a_1 a_2 ... a_n)^(1/n), by applying (i) to a_i/A.
  expected: Sum ln(a_i/A) <= sum (a_i/A - 1) = 0. The left side equals ln(a_1...a_n) - n ln A, so a_1...a_n
    <= A^n. Taking the nth root gives A >= GM.
  solution: 'Since $A>0$, apply (i) to $x=a_i/A$: $\ln\frac{a_i}{A}\le\frac{a_i}{A}-1$. Summing over $i=1,\ldots,n$,
    the right side is $\frac{\sum a_i}{A}-n=\frac{nA}{A}-n=0$. The left side is $\ln(a_1\cdots a_n)-n\ln
    A=\ln\frac{a_1\cdots a_n}{A^n}$. So $\ln\frac{a_1\cdots a_n}{A^n}\le 0$, i.e. $a_1\cdots a_n\le A^n$.
    Taking the nth root (all quantities are positive) gives $\sqrt[n]{a_1\cdots a_n}\le A$.'
  common_errors:
  - Summing the right-hand side incorrectly, for example getting sum a_i/A = 1 instead of n.
  - Dropping the -n terms when summing the right-hand side.
  - Using the wrong direction when exponentiating or taking the nth root.
  hints:
    rephrase: Apply the inequality from part (i) to each ratio a_i divided by the mean, then add the n
      inequalities.
    smaller_case: Try n = 2 with a_1 = 1, a_2 = 3, so A = 2, and see what the summed inequality says.
    key_idea: The logarithm of a product becomes a sum of logarithms, and the sum of the ratios a_i/A
      is fixed by the definition of A.
- goal: Show that (1 + 1/n)^n < e for every positive integer n.
  expected: 'Put x = 1 + 1/n in ln x < x - 1, which gives ln(1 + 1/n) < 1/n. Multiply by n and exponentiate:
    (1 + 1/n)^n < e.'
  solution: Since $1+\frac1n\neq1$, part (i) gives $\ln\left(1+\frac1n\right)<\left(1+\frac1n\right)-1=\frac1n$.
    Multiplying by $n>0$ gives $n\ln\left(1+\frac1n\right)<1$, that is $\ln\left(1+\frac1n\right)^n<1$.
    Since exp is increasing, $\left(1+\frac1n\right)^n<e$.
  common_errors:
  - Forgetting that the strict inequality needs x not equal to 1, which holds here because n >= 1 gives
    x > 1.
  - Multiplying by n incorrectly, or dropping the factor n.
  - Exponentiating the wrong side, so that the direction of the inequality is lost.
  hints:
    rephrase: Choose x so that x - 1 becomes exactly 1/n, then take logarithms of the target expression.
    smaller_case: Compare (1 + 1/2)^2 with e numerically to see the claimed direction.
    key_idea: Set x = 1 + 1/n in part (i), then multiply through by n.
- goal: Show that (1 + 1/n)^(n+1) > e, then deduce the limit of (1 + 1/n)^n is e.
  expected: Applying (i) to 1/x gives ln x >= 1 - 1/x, strictly for x != 1. With x = 1 + 1/n this is (n+1)
    ln(1 + 1/n) > 1, so (1 + 1/n)^(n+1) > e. Then e n/(n+1) < (1+1/n)^n < e, and e n/(n+1) tends to e,
    so the squeeze gives the limit e.
  solution: 'Part (i) applied to $1/x$ gives $\ln\frac1x\le\frac1x-1$, i.e. $\ln x\ge 1-\frac1x$, strictly
    unless $x=1$. Put $x=1+\frac1n$, so $1-\frac1x=\frac{1}{n+1}$. This gives $\ln\left(1+\frac1n\right)>\frac1{n+1}$,
    so $(n+1)\ln\left(1+\frac1n\right)>1$, i.e. $\left(1+\frac1n\right)^{n+1}>e$. Dividing by $1+\frac1n$:
    $\left(1+\frac1n\right)^n>\frac{e}{1+\frac1n}=\frac{en}{n+1}$. Combined with (iii), $\frac{en}{n+1}<\left(1+\frac1n\right)^n<e$.
    Since $\frac{en}{n+1}\to e$, the squeeze theorem gives $\left(1+\frac1n\right)^n\to e$.'
  common_errors:
  - Computing 1 - 1/x wrongly, for example as 1/n instead of 1/(n+1).
  - Forgetting to divide by (1 + 1/n) when turning the bound on (1+1/n)^(n+1) into a bound on (1+1/n)^n.
  - Claiming a limit from a strict inequality alone, without the two-sided squeeze.
  hints:
    rephrase: Apply the logarithm bound to the reciprocal of 1 + 1/n, then clear the logarithm and rearrange.
    smaller_case: Write the reciprocal of 1 + 1/n in simplest form when n = 1, then apply the bound.
    key_idea: Get a lower bound and an upper bound for (1 + 1/n)^n that both tend to e, then use the squeeze
      theorem.
extensions:
  '3':
  - Show that the AM-GM equality holds exactly when all the a_i are equal.
  - Use part (i) to show ln x >= 1 - 1/x for x > 0 and explain where the inequality is strict.
  '4':
  - Prove that (1 + 1/n)^n is strictly increasing in n, using AM-GM on n copies of (1 + 1/n) and one copy
    of 1.
  '5':
  - Show that the sequence (1 + 1/n)^(n+1) is strictly decreasing, and use this with part (iv) to comment
    on its limit.
  - Derive the bound (1 + 1/n)^n >= 2 for n >= 1 from the binomial theorem, and compare it with the bounds
    found above.
