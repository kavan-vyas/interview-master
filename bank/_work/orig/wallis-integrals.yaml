- integral from zero to pi over two
- sine to the power n of x
- Wallis integrals
- n I sub n equals n minus one I sub n minus two
- n I sub n times I sub n minus one equals pi over two
- squeeze theorem
- limit as n tends to infinity of root n times I sub n
- square root of pi over two
