id: newton-sqrt2-convergence
title: 'Newton''s method for sqrt(2): monotonicity, error recursion and geometry'
topics:
- sequences
- AM-GM inequality
- monotone convergence theorem
- limits
- algebraic manipulation
- Newton-Raphson method
- tangent lines
warmup: false
answer_source: pdf
statement: Define $a_1 = 1$ and $a_{n+1} = \frac{1}{2}\left(a_n + \frac{2}{a_n}\right)$. (i) Show that
  $a_n \geq \sqrt{2}$ for $n \geq 2$. (ii) Show that $(a_n)$ is decreasing from $n = 2$ onwards. Deduce
  that it converges, and find its limit. (iii) Show that $a_{n+1} - \sqrt{2} = \frac{(a_n - \sqrt{2})^2}{2a_n}$.
  (iv) Compute $a_2, a_3, a_4$ as fractions. Roughly how many decimal places of $\sqrt{2}$ does $a_5$
  give? (v) Explain the construction geometrically, using tangent lines to $y = x^2 - 2$.
stages:
- goal: (i) Show that a_n >= sqrt(2) for n >= 2.
  expected: By AM-GM applied to a_(n-1) and 2/a_(n-1) (both positive), a_n = (a_(n-1) + 2/a_(n-1))/2 >=
    sqrt(2) for n >= 2.
  solution: All terms are positive, by induction from a_1 = 1 > 0. For n >= 2, the AM-GM inequality applied
    to the positive numbers a_(n-1) and 2/a_(n-1) gives (a_(n-1) + 2/a_(n-1))/2 >= sqrt(a_(n-1) * 2/a_(n-1))
    = sqrt(2). Hence a_n >= sqrt(2) for n >= 2.
  common_errors:
  - Applying AM-GM to a_n and 2/a_n rather than to a_(n-1) and 2/a_(n-1)
  - Forgetting that AM-GM needs both quantities to be positive
  - Claiming a_1 >= sqrt(2) too, which is false since a_1 = 1
  hints:
    rephrase: Apply the AM-GM inequality to the two terms that appear inside the bracket defining a_n.
    smaller_case: Evaluate the function (x + 2/x)/2 at x = 1 and at x = 2, and compare each value with
      sqrt(2).
    key_idea: The product of the two numbers in AM-GM is constant, which fixes the lower bound.
  check: simplify((sqrt(2) + 2/sqrt(2))/2 - sqrt(2)) == 0
  check_ok: true
- goal: (ii) Show that (a_n) is decreasing from n = 2 onwards, then deduce convergence and find the limit.
  expected: a_(n+1) - a_n = (2 - a_n^2)/(2 a_n) <= 0 for n >= 2, since a_n^2 >= 2. The sequence is decreasing
    and bounded below by sqrt(2), so it converges to some L >= sqrt(2). Taking limits gives L = (L + 2/L)/2,
    so L^2 = 2 and L = sqrt(2).
  solution: Compute a_(n+1) - a_n = (a_n + 2/a_n)/2 - a_n = (2 - a_n^2)/(2 a_n). For n >= 2, a_n^2 >=
    2, so this is <= 0. Thus (a_n) is decreasing from n = 2 onwards and bounded below by sqrt(2), so by
    the monotone convergence theorem it converges to some limit L >= sqrt(2). Taking limits in the recurrence
    gives L = (L + 2/L)/2, so L = 2/L, i.e. L^2 = 2. Since L > 0, L = sqrt(2).
  common_errors:
  - Showing the sequence is decreasing for n = 1 as well, when a_2 > a_1 actually holds
  - Concluding convergence without citing a bound or monotonicity
  - Finding L = -sqrt(2) and not discarding it, since the terms are positive
  hints:
    rephrase: Compare a_(n+1) with a_n using part (i). Then use the fact that a monotone sequence bounded
      below converges.
    smaller_case: Take a_n = 2 and compute a_(n+1) directly. Check whether it is smaller than a_n.
    key_idea: The limit of a convergent sequence defined by a recurrence must be a fixed point of the
      update rule.
  check: simplify(sqrt(2)**2 - 2) == 0
  check_ok: true
- goal: (iii) Show that a_(n+1) - sqrt(2) = (a_n - sqrt(2))^2 / (2 a_n).
  expected: a_(n+1) - sqrt(2) = (a_n^2 + 2 - 2 sqrt(2) a_n)/(2 a_n) = (a_n - sqrt(2))^2/(2 a_n).
  solution: a_(n+1) - sqrt(2) = (a_n + 2/a_n)/2 - sqrt(2) = (a_n^2 + 2 - 2 sqrt(2) a_n)/(2 a_n). The numerator
    is (a_n - sqrt(2))^2 because (a_n - sqrt(2))^2 = a_n^2 - 2 sqrt(2) a_n + 2. Hence a_(n+1) - sqrt(2)
    = (a_n - sqrt(2))^2/(2 a_n).
  common_errors:
  - Dropping the factor of 2 in the denominator
  - Expanding (a_n - sqrt(2))^2 with the wrong middle term, for example -sqrt(2) a_n instead of -2 sqrt(2)
    a_n
  - Forgetting to put the terms over the common denominator 2 a_n
  hints:
    rephrase: Put everything over the common denominator 2 a_n, then compare the numerator with a perfect
      square.
    smaller_case: Set a_n = 1 and compare both sides of the identity numerically.
    key_idea: Expand the square and match it with the numerator term by term.
  check: simplify((a + 2/a)/2 - sqrt(2) - (a - sqrt(2))**2/(2*a)) == 0
  check_ok: true
- goal: (iv) Compute a_2, a_3, a_4 as fractions, then estimate how many decimal places of sqrt(2) the
    value a_5 gives.
  expected: a_2 = 3/2, a_3 = 17/12, a_4 = 577/408. The errors are roughly 0.0858, 0.00245, and 2.1 times
    10^-6. By (iii), the error in a_5 is about 1.6 times 10^-12, so a_5 agrees with sqrt(2) to roughly
    11 decimal places.
  solution: a_2 = (1 + 2)/2 = 3/2. a_3 = (3/2 + 4/3)/2 = 17/12. a_4 = (17/12 + 24/17)/2 = (289 + 288)/(2
    * 204) = 577/408. Numerically, a_2 - sqrt(2) is about 0.0858, a_3 - sqrt(2) is about 0.00245, and
    a_4 - sqrt(2) is about 2.12 times 10^-6. By (iii), a_5 - sqrt(2) is about (2.12 times 10^-6)^2/(2
    sqrt(2)), which is about 1.6 times 10^-12. So a_5 is correct to roughly 11 decimal places, and the
    number of correct digits roughly doubles at each step.
  common_errors:
  - Miscalculating a_3 or a_4 by an arithmetic slip in the fraction
  - Reading the error in a_5 as about 10^-6, which is the error in a_4
  - Reading off the wrong number of decimal places, for example stating 6 instead of about 11
  hints:
    rephrase: Apply the recurrence to each previous fraction in turn, keeping the numerator and denominator
      exact.
    smaller_case: Compute a_2 exactly first, then use it to find a_3.
    key_idea: Use (iii) to turn the error at one step into an error bound at the next, which squares each
      time.
  check: Rational(577,408) - (Rational(17,12) + 2/Rational(17,12))/2 == 0
  check_ok: true
- goal: (v) Explain the construction geometrically using tangent lines to y = x^2 - 2.
  expected: The tangent to y = x^2 - 2 at x = a is y = 2a(x - a) + a^2 - 2. It meets the x-axis at x =
    (a^2 + 2)/(2a) = (a + 2/a)/2. So each step replaces the curve by its tangent line at the current point
    and takes the x-intercept. This is the Newton-Raphson method for f(x) = x^2 - 2.
  solution: The derivative of x^2 - 2 at x = a is 2a, so the tangent at (a, a^2 - 2) is y = 2a(x - a)
    + a^2 - 2. Setting y = 0 gives x = a - (a^2 - 2)/(2a) = (a^2 + 2)/(2a) = (a + 2/a)/2. This is exactly
    the update a_(n+1) = (a_n + 2/a_n)/2 with a = a_n. So each step replaces the curve by its tangent
    line at the current approximation and moves to the point where that tangent crosses the x-axis. This
    is the Newton-Raphson method applied to f(x) = x^2 - 2, which has a root at sqrt(2).
  common_errors:
  - Writing the tangent slope as a instead of 2a
  - Confusing the x-intercept of the tangent with the y-intercept
  - Failing to identify the method as Newton-Raphson applied to f(x) = x^2 - 2
  hints:
    rephrase: Write the equation of the tangent at x = a, then find where it crosses the x-axis.
    smaller_case: Take a = 4. Find the tangent to y = x^2 - 2 at x = 4 and its x-intercept.
    key_idea: The x-intercept of the tangent line is the next iterate in Newton's method for f(x) = x^2
      - 2.
  check: simplify(a - (a**2-2)/(2*a) - (a+2/a)/2) == 0
  check_ok: true
extensions:
  '3':
  - Apply the same iteration to a_(n+1) = (a_n + c/a_n)/2 to approximate sqrt(c) for a positive constant
    c.
  - Show that the iteration for sqrt(c) converges for any positive starting value a_1.
  '4':
  - Using (iii), show that the errors satisfy e_(n+1) <= e_n^2/(2 sqrt(2)), where e_n = a_n - sqrt(2).
  - Explain why the number of correct decimal digits roughly doubles at each step.
  '5':
  - Compare the number of steps needed by bisection and by this iteration to reach 11 correct decimal
    places.
  - Apply Newton's method to f(x) = x^3 - 2 and find the update formula.
