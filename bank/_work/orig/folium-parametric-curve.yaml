id: folium-parametric-curve
title: The curve x^3+y^3=3xy via y=tx
topics:
- parametric curves
- algebra
- limits
- asymptotes
- sketching
- symmetry
warmup: false
answer_source: pdf
statement: Consider the curve $x^3+y^3=3xy$. (i) By substituting $y=tx$, show that apart from the origin
  the curve is given by $x=\frac{3t}{1+t^3}$, $y=\frac{3t^2}{1+t^3}$ with $t\neq-1$. (ii) Show that the
  curve is symmetric in the line $y=x$, and find where it crosses this line. (iii) Show that $x+y\to-1$
  as $t\to-1$. What does this say about the curve? (iv) Sketch the curve.
stages:
- goal: Parametrise the curve by substituting y=tx, apart from the origin.
  expected: $x=\frac{3t}{1+t^3}$ and $y=\frac{3t^2}{1+t^3}$, for $x\neq0$ and $t\neq-1$.
  solution: Substituting $y=tx$ gives $x^3+t^3x^3=3tx^2$, so $x^2\left(x(1+t^3)-3t\right)=0$. Apart from
    the origin ($x=0$), $x(1+t^3)=3t$, and dividing requires $t\neq-1$. So $x=\frac{3t}{1+t^3}$, and $y=tx=\frac{3t^2}{1+t^3}$.
  common_errors:
  - Dividing by x^2 and losing the origin without noting it separately.
  - Forgetting that t=-1 must be excluded because 1+t^3=0 there.
  - Writing y=3t/(1+t^3), forgetting the extra factor of t.
  - Expanding x^3+y^3 incorrectly as (x+y)^3.
  hints:
    rephrase: Replace y by tx everywhere and collect the powers of x.
    smaller_case: What does the equation say when x=0, and does that hold for every value of t?
    key_idea: Factor out a power of x. The remaining factor gives the parametric formula, and the factor
      1+t^3 must be non-zero to divide by it.
  check: simplify((3*t/(1+t**3))**3 + (3*t**2/(1+t**3))**3 - 3*(3*t/(1+t**3))*(3*t**2/(1+t**3))) == 0
  check_ok: true
- goal: Show the curve is symmetric in y=x, and find where it crosses that line apart from the origin.
  expected: Swapping x and y leaves $x^3+y^3=3xy$ unchanged, so the curve is symmetric in $y=x$. It crosses
    $y=x$ at $t=1$, giving $(\frac32,\frac32)$, as well as at the origin.
  solution: Swapping $x$ and $y$ gives $y^3+x^3=3yx$, which is the same equation. On $y=x$, $x=y$ gives
    $2x^3=3x^2$, so $x=0$ or $x=\frac32$. In parameter form $y=x$ means $t=1$, and then $x=\frac{3}{2}$.
  common_errors:
  - Asserting symmetry without showing the equation is unchanged under swapping x and y.
  - Forgetting the origin as a crossing point.
  - Solving for the crossing point using the wrong parameter value, such as t=0.
  hints:
    rephrase: Swap the letters x and y in the equation and see what changes.
    smaller_case: Put x=y directly into the original equation. What equation in x do you get?
    key_idea: Points on y=x are where the x-formula and y-formula agree, so compare the two parametric
      expressions.
  check: 3*1/(1+1**3) - Rational(3,2)
  check_ok: true
- goal: Find the limit of x+y as t tends to -1 and interpret it for the curve.
  expected: $x+y=\frac{3t}{1-t+t^2}\to-1$ as $t\to-1$. Because $x$ and $y$ become unbounded while $x+y$
    tends to $-1$, the curve has an oblique asymptote $x+y=-1$.
  solution: $x+y=\frac{3t(1+t)}{1+t^3}$. Using $1+t^3=(1+t)(1-t+t^2)$ and cancelling the factor $1+t$
    gives $x+y=\frac{3t}{1-t+t^2}$. As $t\to-1$ this tends to $\frac{-3}{3}=-1$. The denominator $1+t^3$
    tends to $0$, so $x$ and $y$ are unbounded. The curve therefore approaches the oblique asymptote $x+y=-1$.
  common_errors:
  - Substituting t=-1 into the unsimplified fraction and not cancelling the common factor 1+t.
  - Concluding the asymptote is horizontal or vertical rather than oblique.
  - Not explaining why x and y are unbounded near t=-1.
  - 'Arithmetic error: at t=-1 the denominator 1-t+t^2 equals 3, not 1.'
  hints:
    rephrase: Add x and y using the parametric forms, and factor the denominator 1+t^3.
    smaller_case: Does x itself stay bounded as t approaches -1?
    key_idea: Factor 1+t^3 to cancel a common factor. A sum that tends to a constant while its components
      become unbounded signals an asymptote.
  check: limit(3*t/(1-t+t**2), t, -1) == -1
  check_ok: true
- goal: Sketch the curve by describing each branch, using the signs of x and y in each interval of t.
  expected: For $t\ge0$ the curve is a loop in the first quadrant, passing through the origin at $t=0$
    and $(\frac32,\frac32)$ at $t=1$, and returning to the origin as $t\to\infty$. For $-1<t<0$ it lies
    in the second quadrant, running from the origin towards the asymptote $x+y=-1$. For $t<-1$ it lies
    in the fourth quadrant, running along the asymptote $x+y=-1$ and returning to the origin as $t\to-\infty$.
  solution: For $t\ge0$, both $x=\frac{3t}{1+t^3}$ and $y=\frac{3t^2}{1+t^3}$ are non-negative, giving
    the first-quadrant loop. As $t\to\infty$, $x\sim\frac{3}{t^2}\to0$ and $y\sim\frac3t\to0$. For $-1<t<0$,
    $x<0$ and $y>0$, so the branch is in the second quadrant, and as $t\to-1^+$ it runs off to infinity
    along $x+y=-1$. For $t<-1$, $x>0$ and $y<0$, so the branch is in the fourth quadrant. As $t\to-1^-$
    it runs to infinity along $x+y=-1$, and as $t\to-\infty$ it returns to the origin.
  common_errors:
  - Drawing the loop in the wrong quadrant because of a sign error.
  - Forgetting that the loop closes at the origin both as t tends to plus infinity and as t tends to minus
    infinity.
  - Drawing the asymptote as y=-x or as a line parallel to the wrong direction.
  - Treating t=-1 as giving a finite point on the curve.
  hints:
    rephrase: Work out the signs of x and y on each interval of t separated by t=0 and t=-1.
    smaller_case: Find the signs of x and y when t=1/2 and when t=-1/2.
    key_idea: Track the sign of the numerator and denominator on each interval, and the behaviour of the
      curve as t tends to the ends of each interval and to -1.
  check: null
extensions:
  '3':
