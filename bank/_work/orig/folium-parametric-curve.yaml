  - Find the points on the curve where the tangent is horizontal in the first quadrant.
  '4':
  - Find the area enclosed by the loop in the first quadrant.
  - Show that the curve has no points with x+y=-1 apart from the asymptote.
  '5':
  - Convert the equation to polar form and state the polar equation of the curve.
  - Show that the curve is the envelope of a family of lines x+y=c, or explain why not.
