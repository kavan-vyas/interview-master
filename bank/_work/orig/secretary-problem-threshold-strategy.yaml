id: secretary-problem-threshold-strategy
title: 'Secretary problem: success probability of the threshold strategy'
topics:
- probability
- optimal stopping
- sums and integrals
- asymptotics
warmup: false
answer_source: pdf
statement: 'Candidates $1,\dots,n$ for a job arrive in uniformly random order. After each interview you
  learn only how the candidate ranks against those already seen, and must accept or reject immediately.
  Strategy $S_r$: reject the first $r-1$ candidates, then accept the first one who is better than everyone
  seen so far. (i) For $n=3$, find the probability that $S_r$ picks the best candidate for $r=1,2,3$.
  (ii) Show that for $2\le r\le n$, $S_r$ succeeds with probability $P_r=\frac{r-1}{n}\sum_{k=r}^{n}\frac{1}{k-1}$.
  (iii) By approximating the sum with an integral, show that for large $n$ and $r\approx xn$, $P_r\approx
  -x\ln x$. Deduce the best $x$ and the resulting probability.'
stages:
- goal: For n=3, find the success probability of S_1, S_2 and S_3, and say which is best.
  expected: S_1 succeeds with probability 1/3, S_2 with probability 1/2, S_3 with probability 1/3. So
    r=2 is best.
  solution: Enumerate the 6 orders of relative quality. S_1 accepts candidate 1, which is best with probability
    1/3. S_2 rejects candidate 1 and accepts the first later candidate better than candidate 1; it succeeds
    in 3 of 6 orders, giving 1/2. S_3 rejects the first two and succeeds only when the best is third,
    probability 1/3. So r=2 is best.
  common_errors:
  - Forgetting that S_1 accepts the first candidate immediately
  - Counting orders where the best is accepted after a non-best candidate was already accepted
  - Using the general formula with r=1, which does not apply
  hints:
    rephrase: List the orders of the three candidates and track what each strategy accepts.
    smaller_case: Take n=2 and check S_1 and S_2 by hand.
    key_idea: A strategy succeeds exactly when the overall best candidate is the one it accepts.
  check: Rational(2-1,3)*(Rational(1,1)+Rational(1,2)) - Rational(1,2)
  check_ok: true
- goal: Derive P_r = ((r-1)/n) times the sum over k from r to n of 1/(k-1), for 2 <= r <= n.
  expected: Condition on the overall best being in position k >= r, which has probability 1/n. Success
    requires the best of the first k-1 candidates to lie among the first r-1 positions, probability (r-1)/(k-1).
    Summing over k gives the formula.
  solution: If the best is at position k>=r, S_r accepts it only if no candidate in positions r to k-1
    beats the first r-1. That holds exactly when the best of the first k-1 candidates is among the first
    r-1, which has probability (r-1)/(k-1). Multiply by 1/n and sum over k=r,...,n.
  common_errors:
  - Using k in place of k-1 in the denominator
  - Forgetting the 1/n probability that the best is at position k
  - Requiring the overall best, rather than the best of the first k-1, to lie in the first r-1
  hints:
    rephrase: Condition on the position of the overall best candidate and ask when the strategy skips
      everyone before it.
    smaller_case: Work through the case n=3, r=2 with the conditioning on position k.
    key_idea: The threshold is the best of the first r-1 candidates; the best candidate is accepted exactly
      when it is the first to beat that threshold.
  check: Rational(2,5)*(Rational(1,2)+Rational(1,3)+Rational(1,4)) - Rational(13,30)
  check_ok: true
- goal: Approximate the sum by an integral and show P_r is roughly -x ln x when r is about xn.
  expected: Sum from k=r to n of 1/(k-1) is approximately the integral from r to n of dt/t = ln(n/r).
    With r/n = x, P_r is approximately x ln(1/x) = -x ln x.
  solution: The sum over k of 1/(k-1) approximates the integral of dt/t from about r to n, giving ln(n/r).
    Since (r-1)/n is about x and ln(n/r) = -ln x, P_r is about -x ln x.
  common_errors:
  - Integrating 1/t from 0 to n instead of from r to n
  - Getting the sign of the logarithm wrong
  - Dropping the factor x in front of the logarithm
  hints:
    rephrase: Treat the sum as a Riemann sum of 1/t over the range from r to n.
    smaller_case: Approximate the sum for n=10 and r=5 by an integral and compare.
    key_idea: Replace the sum by an integral of 1/t and write r/n as x.
  check: integrate(1/t,(t,x,1)) - (-log(x))
  check_ok: true
- goal: Maximise -x ln x over x and report the best probability.
  expected: The derivative of -x ln x is -ln x - 1, which is zero at x=1/e. The maximal success probability
    is 1/e, about 0.37.
  solution: d/dx(-x ln x) = -ln x - 1 = 0 gives x = 1/e. At this x, -x ln x = (1/e)(1) = 1/e, so the best
    threshold is r about n/e and success probability tends to 1/e.
  common_errors:
  - Setting the derivative equal to 1 instead of 0
  - Reporting x instead of the success probability
  - Confusing the maximum with a minimum
  hints:
    rephrase: Find where the derivative of the approximating function vanishes.
    smaller_case: Compare the value of -x ln x at x=1/2 with its value at another point in (0,1).
    key_idea: Set the derivative of -x ln x to zero and solve for x.
  check: (-x*log(x)).subs(x,exp(-1)) - exp(-1)
  check_ok: true
extensions:
  '3':
  - Explain why the threshold strategy only needs relative ranks.
  '4':
  - Explain why P_r is largest for r near n/e when n is large.
  '5':
  - Describe how the answer changes if you instead want to pick one of the top two candidates.
