statement: What is the expected number of rolls of a 6-sided die for all faces to appear at least once?
  What about an $n$-sided die?
stages:
- goal: Find the expected number of additional rolls needed to see a new face when $k-1$ distinct faces
    have already appeared.
  expected: With $k-1$ faces seen, $n-k+1$ faces are new, so each roll succeeds with probability $\frac{n-k+1}{n}$.
    The waiting time is geometric with expectation $\frac{n}{n-k+1}$.
  solution: Let $T_k$ be the number of rolls from the moment $k-1$ distinct faces have been seen until
    the next new face appears. Each roll is new with probability $p_k=\frac{n-k+1}{n}$, independently,
    so $T_k$ is geometric and $\mathbb{E}[T_k]=\frac{1}{p_k}=\frac{n}{n-k+1}$.
  common_errors:
  - Using success probability $\frac{k}{n}$ instead of $\frac{n-k+1}{n}$.
  - Forgetting that a geometric variable's expectation is $1/p$, not $p$.
  - Counting the first roll as zero rolls rather than one.
  hints:
    rephrase: Split the whole process into phases, where phase $k$ begins when you have seen exactly $k-1$
      distinct faces.
    smaller_case: For a 2-sided die, how long does it take on average to see the second face after the
      first has appeared?
    key_idea: Each phase is a geometric waiting time; the success probability is the fraction of faces
      not yet seen.
  check: null
- goal: Sum the phase expectations to get the total expected number of rolls for an $n$-sided die.
  expected: $\mathbb{E}[\text{total}]=\sum_{k=1}^{n}\frac{n}{n-k+1}=n\sum_{j=1}^{n}\frac{1}{j}=n\,H_n$,
    where $H_n$ is the $n$-th harmonic number.
  solution: By linearity of expectation, the total expected number of rolls is the sum of the phase expectations.
    Reindexing with $j=n-k+1$ gives $n\sum_{j=1}^{n}\frac1j=nH_n$.
  common_errors:
  - Summing $\frac{1}{j}$ without the factor $n$.
  - Writing the answer as $n\ln n$ exactly rather than $n H_n$ (the logarithm is only an approximation).
  - Reindexing the sum incorrectly.
  hints:
    rephrase: Use linearity of expectation to add the expected phase lengths, then rewrite the sum with
      a new index.
    smaller_case: Write out the sum explicitly for $n=2$ and $n=3$ and compare it with the general form.
    key_idea: Linearity of expectation lets you add expected waiting times without worrying about dependence
      between phases.
  check: null
- goal: Evaluate the expected number of rolls for a 6-sided die.
  expected: $6\,H_6 = 6\left(1+\tfrac12+\tfrac13+\tfrac14+\tfrac15+\tfrac16\right)=\tfrac{147}{10}=14.7$
    rolls.
  solution: $H_6 = \frac{49}{20}$, so $6H_6=\frac{6\cdot 49}{20}=\frac{294}{20}=\frac{147}{10}$, roughly
    $14.7$ rolls.
  common_errors:
  - Arithmetic slips when adding $\frac{1}{2}+\frac{1}{3}+\frac{1}{4}+\frac{1}{5}+\frac{1}{6}$.
  - Forgetting to multiply by $6$ at the end.
  hints:
    rephrase: Write $H_6$ as a single fraction, then multiply by the number of faces.
    smaller_case: What is $H_2$, and what does your general formula give for a 2-sided die?
    key_idea: Use the general formula $nH_n$ with $n=6$, and compute $H_6$ exactly.
  check: 6*harmonic(6) - Rational(147,10)
  check_ok: true
