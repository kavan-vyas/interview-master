id: secretary-problem-threshold-strategy
title: 'Secretary problem: success probability of the threshold strategy'
topics:
- probability
- optimal stopping
- conditioning
- sums and integrals
- asymptotics
- optimisation
warmup: false
answer_source: pdf
statement: 'Candidates $1,\dots,n$ for a job arrive in uniformly random order. After each interview you
  learn only how the candidate ranks against those already seen, and must accept or reject immediately.
  Strategy $S_r$: reject the first $r-1$ candidates, then accept the first candidate who is better than
  everyone seen so far. (i) For $n=3$, find the probability that $S_r$ picks the best candidate for each
  of $r=1,2,3$, and say which is best. (ii) Show that for $2\le r\le n$, $S_r$ succeeds with probability
  $P_r=\frac{r-1}{n}\sum_{k=r}^{n}\frac{1}{k-1}$. (iii) By approximating the sum with an integral, show
  that for large $n$ and $r\approx xn$, $P_r\approx -x\ln x$. (iv) Deduce the best value of $x$ and the
  resulting limiting success probability.'
stages:
- goal: For $n=3$, find the success probabilities of $S_1$, $S_2$, $S_3$ and say which is best.
  expected: $S_1$ succeeds with probability $1/3$, $S_2$ with probability $1/2$, $S_3$ with probability
    $1/3$. So $r=2$ is best.
  solution: '$S_1$ accepts candidate 1 immediately, who is the best with probability $1/3$. $S_2$ rejects
    candidate 1 and then accepts the first later candidate who beats candidate 1. Over the 6 equally likely
    orderings of ranks, with 1 = best: 123 fails (candidate 2 beats candidate 1 but is not the best, so
    it is accepted), 132 fails, 213 succeeds, 231 succeeds, 312 succeeds (candidate 2 does not beat 3,
    candidate 3 beats 3), 321 fails. Wait: with rank 1 = best, a candidate beats another if its rank number
    is smaller. Recounting: 123: candidate 1 is the best, so no later candidate beats it, nothing is accepted,
    fail. 132: same, fail. 213: candidate 2 (rank 1) beats rank 2, accepted, success. 231: success. 312:
    candidate 2 (rank 1) beats rank 3, accepted, success. 321: candidate 2 (rank 2) beats rank 3, accepted,
    fail. So 3 of 6, giving $1/2$. $S_3$ rejects the first two and accepts candidate 3 only if it beats
    both, which happens exactly when the best is last, probability $1/3$. So $r=2$ is best.'
  common_errors:
  - Forgetting that $S_1$ accepts the first candidate immediately
  - Counting orders in which the best candidate comes later but a non-best candidate was already accepted
  - Applying the general formula from part (ii) with $r=1$, where $1/(k-1)$ is undefined at $k=1$
  - Forgetting that a strategy which never accepts anyone is a failure
  hints:
    rephrase: List the 6 orderings of the three candidates and track which one each strategy accepts.
    smaller_case: Take $n=2$ and check $S_1$ and $S_2$ by hand.
    key_idea: A strategy succeeds exactly when the candidate it accepts is the overall best.
  check: Rational(1,3)*(1+Rational(1,2)) - Rational(1,2)
  check_ok: true
- goal: Derive $P_r=\frac{r-1}{n}\sum_{k=r}^{n}\frac{1}{k-1}$ for $2\le r\le n$.
  expected: Condition on the position $k$ of the overall best candidate, probability $1/n$ for each $k$.
    If $k<r$ it is rejected. If $k\ge r$, success requires the best of the first $k-1$ candidates to lie
    among the first $r-1$, probability $\frac{r-1}{k-1}$. Summing over $k$ gives the formula.
  solution: Let the best candidate be in position $k$, probability $1/n$. If $k\le r-1$ it is rejected,
    so there is no success. If $k\ge r$, $S_r$ accepts it exactly when nobody in positions $r,\dots,k-1$
    beats everyone in positions $1,\dots,r-1$, i.e. when the best of the first $k-1$ candidates is among
    the first $r-1$. By symmetry this has probability $\frac{r-1}{k-1}$, independent of $k$ being the
    position of the overall best. So $P_r=\sum_{k=r}^{n}\frac1n\cdot\frac{r-1}{k-1}=\frac{r-1}{n}\sum_{k=r}^{n}\frac1{k-1}$.
  common_errors:
  - Using $k$ instead of $k-1$ in the denominator
  - Forgetting the factor $1/n$ for the best being in position $k$
  - Requiring the overall best, rather than the best of the first $k-1$, to lie in the first $r-1$
  - Including terms $k<r$ in the sum
  hints:
    rephrase: Condition on the position of the overall best candidate and ask when the strategy skips
      everyone before it.
    smaller_case: Work through $n=3$, $r=2$ using the conditioning on $k$, and compare with part (i).
    key_idea: The threshold is the best of the first $r-1$ candidates; the overall best is accepted exactly
      when no one in positions $r,\dots,k-1$ beats this threshold.
  check: Rational(2,5)*(Rational(1,2)+Rational(1,3)+Rational(1,4)) - Rational(13,30)
  check_ok: true
- goal: Approximate the sum by an integral and show $P_r\approx -x\ln x$ when $r\approx xn$.
  expected: $\sum_{k=r}^{n}\frac1{k-1}\approx\int_r^n\frac{dt}{t}=\ln\frac nr$. With $r/n\approx x$, $P_r\approx
    x\ln\frac1x=-x\ln x$.
  solution: Write $\sum_{k=r}^n\frac1{k-1}=\sum_{j=r-1}^{n-1}\frac1j$, a Riemann sum for $\int dt/t$ over
    a range from about $r$ to $n$. For large $n$ it is $\ln(n/r)+o(1)$. Since $(r-1)/n\to x$ and $\ln(n/r)\to-\ln
    x$, $P_r\to x\cdot(-\ln x)=-x\ln x$.
  common_errors:
  - Integrating $1/t$ from $0$ to $n$ instead of from about $r$ to $n$
  - Getting the sign of the logarithm wrong, i.e. $\ln x$ instead of $\ln(1/x)$
  - Dropping the factor $x$ in front of the logarithm
  - Treating the sum as exactly equal to the integral without noting the error is $o(1)$
  hints:
    rephrase: Treat the sum as a Riemann sum of $1/t$ over the range from about $r$ to $n$.
    smaller_case: For $n=10$, $r=5$, compare $\sum_{k=5}^{10}\frac1{k-1}$ with $\ln 2$.
    key_idea: Replace the sum by $\int_r^n dt/t$ and write $r/n$ as $x$.
  check: integrate(1/t,(t,x,1)) + log(x)
  check_ok: true
- goal: Maximise $-x\ln x$ over $0<x<1$ and report the best $x$ and the limiting success probability.
  expected: The derivative $-\ln x-1$ vanishes at $x=1/e$, which is a maximum, and the maximum value is
    $1/e\approx0.37$.
  solution: $\frac{d}{dx}(-x\ln x)=-\ln x-1=0$ gives $x=1/e$. The second derivative is $-1/x<0$, so this
    is a maximum. The value is $-\frac1e\ln\frac1e=\frac1e$. So the best threshold is $r\approx n/e$ and
    the success probability tends to $1/e\approx0.368$.
  common_errors:
  - Setting the derivative equal to $1$ instead of $0$
  - Reporting $x=1/e$ as the success probability, or only the probability, not the threshold
  - Not checking that the stationary point is a maximum
  - Forgetting the product rule when differentiating $x\ln x$
  hints:
    rephrase: Find where the derivative of the approximating function vanishes.
    smaller_case: Compare $-x\ln x$ at $x=1/2$ and $x=1/4$ with its value at $x=0.37$.
    key_idea: Set $\frac{d}{dx}(-x\ln x)=0$ and solve for $x$.
  check: diff(-x*log(x),x).subs(x,exp(-1)) + ((-x*log(x)).subs(x,exp(-1)) - exp(-1))
  check_ok: true
extensions:
  '3':
  - Why can a strategy that uses only relative ranks still target the overall best candidate?
  - What is $P_r$ for $n=4$ and each $r$? Which $r$ is best?
  '4':
  - Show that $P_r$ is increasing then decreasing in $r$, and find the exact condition for $P_{r+1}>P_r$
    in terms of $\sum 1/(k-1)$.
  - How good is the $1/e$ approximation for $n=10$?
  '5':
  - How does the optimal threshold and success probability change if you win by picking one of the top
    two candidates?
  - Prove that no strategy, threshold or otherwise, can beat the best threshold strategy for the secretary
    problem.
