id: three-digit-numbers-with-digit-product-12
title: Three-digit numbers whose digits multiply to 12
topics:
- counting
- permutations
- factorisation
warmup: true
answer_source: pdf
statement: How many three-digit whole numbers have digits whose product is 12?
stages:
- goal: List every set of three digits, each from 1 to 9, whose product is 12.
  expected: '{1,2,6}, {1,3,4}, {2,2,3}'
  solution: No digit can be 0, since the product would then be 0. Each digit is in 1 to 9. Factorising
    12 = 2^2 x 3 into three factors from 1 to 9 gives the multisets {1,2,6}, {1,3,4} and {2,2,3}. No others
    work (for example {1,1,12} and {1,2,6} repeated are invalid or duplicates).
  common_errors:
  - Including 0 as a digit, which contradicts a product of 12
  - Missing {2,2,3} because a repeated digit is overlooked
  - Including {1,1,12} or {2,6,1} as separate sets
  hints:
    rephrase: Can any digit be 0? Which whole-number factorisations of 12 into three factors use only
      the digits 1 to 9?
    smaller_case: List all sets of three digits, each from 1 to 9, whose product is 6.
    key_idea: Factorise 12 into three factors, each at most 9, and do not forget repeated factors.
  check: len({frozenset([1,2,6]), frozenset([1,3,4]), frozenset([2,2,3])}) - 3
  check_ok: null
- goal: Count the distinct three-digit numbers formed from these digit sets and give the total.
  expected: '15'
  solution: '{1,2,6} has 3! = 6 arrangements. {1,3,4} has 3! = 6 arrangements. {2,2,3} has 3!/2! = 3 distinct
    arrangements. The hundreds digit is never 0 here, so every arrangement is a valid three-digit number.
    Total = 6 + 6 + 3 = 15.'
  common_errors:
  - Counting {2,2,3} as 6 arrangements and not dividing by 2!
  - Forgetting that different orderings give different numbers
  - Miscounting the total by adding wrongly
  hints:
    rephrase: For each digit set, how many distinct orderings are possible? Are any digits repeated?
    smaller_case: How many distinct three-digit arrangements does the digit set {1,1,2} have?
    key_idea: Start with the number of orderings of distinct digits, then divide by the factorial of each
      repeat count to avoid double counting.
  check: 6 + 6 + 3 - 15
  check_ok: true
extensions:
  '3':
  - How many three-digit whole numbers have digits whose sum is 6?
  '4':
  - How many four-digit whole numbers have digits whose product is 12?
  '5':
