questions:
- Which piece of maths outside the syllabus have you enjoyed most, and what is the key idea in it?
- Tell me about a problem you got stuck on for a long time. What finally unlocked it?
- What is the difference between a proof and a convincing argument?
- Explain a result you like to someone who has only done GCSE maths.
- Is there a theorem you know the statement of but not the proof? Why do you believe it?
- What is something in maths that surprised you?
- Why do you want to study maths rather than physics or computer science?
- What have you read recently, and what would you challenge in it?
- Who do you most admire and why?
- Why do you think grandparents feel the need to academically surpass their children and grandchildren?
- Why do you play table tennis?
- Are you cool?
- If I could pass any piece of legislation through Parliament, what would it be?
- If you could invite any 2 people alive or dead to a dinner party, who would they be and why?
- If you could interview anyone from history, who would it be?
- What was the most beautiful proof in A-Level Mathematics?
- If you could make up a word, what would it be? Why?
- Who is your favourite Metaphysical poet? (Bear in mind this was a MATHS interview!)
- Was Romeo impulsive?
- If you could have half an hour with any mathematician past or present, who would it be?
- Describe your school from an anthropological perspective.
- If it could take a form, what shape would the novel To the Lighthouse become?
- Tell me about your life, from the beginning to what made you sit in that chair.
- Would you rather be a novel or a poem?
- Writing about music is like dancing about architecture. Discuss.
- Asked about the problem of evil, as this was on my personal statement.
- Asked about the books on my personal statement.
- How does your study of maths and physics help you understand the real world? Give an example of a real
  life situation.
- Why do you like maths? Why did you choose to do maths, and not physics, chemistry, or natural sciences?
- What hobbies do you have?
- Show an elegant proof that you met in masterclasses/lectures outside of school.
- Why mathematics?
- Ah, so you're one of the applicants taking Latin. Did you ever consider an Arts degree?
- What's your favourite topic in Maths?
- Why Engineering? Why a broad course before specialising?
