id: min-sum-abs-four-points
title: Minimising a sum of four absolute distances
topics:
- modulus
- minimisation
- median
- piecewise linear functions
warmup: true
answer_source: generated
statement: Find the minimum value of the expression $|x-1|+|x-2|+|x-4|+|x-6|$.
stages:
- goal: Identify the value(s) of $x$ at which the minimum occurs.
  expected: Any $x$ in the closed interval $[2,4]$, which is the interval between the two middle points
    $2$ and $4$.
  solution: The sum of distances to a set of points is piecewise linear, with changes of slope at $1,2,4,6$.
    For an even number of points, the minimum is attained on the whole interval between the two middle
    values, which here are $2$ and $4$. The slope is $-2$ on $(1,2)$, $0$ on $(2,4)$ and $+2$ on $(4,6)$.
  common_errors:
  - Stating the minimum is at a single point such as $x=3$ (the mean of the points) rather than using
    the median.
  - Picking $x=1$ or $x=6$, which are endpoints and give a large value.
  - Thinking the minimum is only at $x=2$ and not at all points between $2$ and $4$.
  hints:
    rephrase: Think of each term as the distance from $x$ to a point on the number line. Where should
      $x$ sit to make the total distance smallest?
    smaller_case: Try the three-term version $|x-1|+|x-2|+|x-4|$. Where is its minimum?
    key_idea: The sum of absolute distances is minimised at a median of the points.
  check: (Abs(2-1)+Abs(2-2)+Abs(2-4)+Abs(2-6))-(Abs(3-1)+Abs(3-2)+Abs(3-4)+Abs(3-6))+(Abs(3-1)+Abs(3-2)+Abs(3-4)+Abs(3-6))-7
  check_ok: true
- goal: Find the minimum value of the expression.
  expected: $7$
  solution: 'At $x=2$: $1+0+2+4=7$. At $x=4$: $3+2+0+2=7$. Any value in between gives the same total,
    so the minimum is $7$.'
  common_errors:
  - Evaluating at $x=3$ and getting $3+1+1+3=8$, then reporting $8$.
  - Arithmetic slips when adding the four distances.
  - Reporting the minimiser $x=2$ or $x=4$ as the minimum value.
  hints:
    rephrase: Substitute the value you found in the first stage into the expression and add up the four
      distances.
    smaller_case: Evaluate the expression at $x=2$ only, term by term.
    key_idea: The minimum value is the value of the expression at the minimiser, not the minimiser itself.
  check: Abs(2-1)+Abs(2-2)+Abs(2-4)+Abs(2-6)-7
  check_ok: true
