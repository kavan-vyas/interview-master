id: wallis-integrals
title: 'Wallis integrals: reduction formula and the limit of √n·I_n'
topics:
- Wallis integrals
- reduction formulae
- integration by parts
- monotonicity of integrals
- squeeze theorem
- limits
warmup: false
answer_source: pdf
statement: 'For integers $n\ge 0$, let $I_n=\int_0^{\pi/2}\sin^n x\,dx$.

  (i) Find $I_0$ and $I_1$.

  (ii) Show that $nI_n=(n-1)I_{n-2}$ for $n\ge 2$.

  (iii) Show that $nI_nI_{n-1}=\frac{\pi}{2}$ for all $n\ge 1$.

  (iv) Explain why $I_{n+1}\le I_n$ for all $n\ge 0$. Hence show that for $n\ge 1$, $\sqrt{\frac{\pi}{2(n+1)}}\le
  I_n\le\sqrt{\frac{\pi}{2n}}$.

  (v) Find $\lim_{n\to\infty}\sqrt{n}\,I_n$.'
stages:
- goal: Evaluate $I_0$ and $I_1$.
  expected: $I_0=\frac{\pi}{2}$ and $I_1=1$.
  solution: $I_0=\int_0^{\pi/2}1\,dx=\frac{\pi}{2}$. $I_1=\int_0^{\pi/2}\sin x\,dx=[-\cos x]_0^{\pi/2}=0-(-1)=1$.
  common_errors:
  - Taking $\sin^0x$ to be 0 instead of 1
  - Evaluating $\int_0^{\pi/2}\sin x\,dx$ as $-1$ by losing the sign of the antiderivative
  - Using the wrong endpoint values of $\cos$ (e.g. $\cos 0=0$)
  hints:
    rephrase: Anything to the power zero is 1, so $I_0$ is the length of the interval. For $I_1$, find
      an antiderivative of $\sin x$.
    smaller_case: What do you get from $-\cos x$ evaluated at $\pi/2$ minus its value at $0$?
    key_idea: Both integrals are elementary; the only care needed is the endpoint values of $\cos$ and
      the interval length.
  check: integrate(sin(x)**0,(x,0,pi/2)) - pi/2 + integrate(sin(x),(x,0,pi/2)) - 1
  check_ok: true
- goal: Prove the reduction formula $nI_n=(n-1)I_{n-2}$ for $n\ge2$.
  expected: Integrate by parts with $u=\sin^{n-1}x$, $dv=\sin x\,dx$, note the boundary term vanishes,
    then use $\cos^2x=1-\sin^2x$ to get $I_n=(n-1)(I_{n-2}-I_n)$, which rearranges to $nI_n=(n-1)I_{n-2}$.
  solution: Write $I_n=\int_0^{\pi/2}\sin^{n-1}x\cdot\sin x\,dx$. Take $u=\sin^{n-1}x$, $dv=\sin x\,dx$,
    so $v=-\cos x$. The boundary term $[-\cos x\sin^{n-1}x]_0^{\pi/2}$ is $0$ at $\pi/2$ (as $\cos=0$)
    and $0$ at $0$ (as $\sin^{n-1}0=0$ when $n\ge2$). So $I_n=(n-1)\int_0^{\pi/2}\sin^{n-2}x\cos^2x\,dx=(n-1)\int_0^{\pi/2}\sin^{n-2}x(1-\sin^2x)\,dx=(n-1)(I_{n-2}-I_n)$.
    Hence $nI_n=(n-1)I_{n-2}$.
  common_errors:
  - Forgetting that the boundary term vanishes at $0$ only when $n\ge 2$
  - Sign error in $\int\sin x\,dx=-\cos x$
  - Differentiating $\sin^{n-1}x$ and forgetting the factor $(n-1)$ or the $\cos x$
  - Not replacing $\cos^2x$ by $1-\sin^2x$
  hints:
    rephrase: Split $\sin^n x$ as $\sin^{n-1}x\cdot\sin x$ and integrate by parts.
    smaller_case: 'Check the boundary term when $n=2$: what is $\sin^{1}$ at $0$ and $\cos$ at $\pi/2$?'
    key_idea: Integration by parts produces a $\cos^2x$ term, which the identity $\cos^2x=1-\sin^2x$ turns
      back into $I_{n-2}$ and $I_n$.
  check: 2*integrate(sin(x)**2,(x,0,pi/2)) - integrate(sin(x)**0,(x,0,pi/2))
  check_ok: true
- goal: Show that $J_n=nI_nI_{n-1}$ is constant and find its value.
  expected: $J_n=J_{n-1}$ for $n\ge2$, and $J_1=I_1I_0=\frac{\pi}{2}$, so $nI_nI_{n-1}=\frac{\pi}{2}$
    for all $n\ge1$.
  solution: For $n\ge2$, (ii) gives $nI_n=(n-1)I_{n-2}$, so $J_n=nI_nI_{n-1}=(n-1)I_{n-2}I_{n-1}=(n-1)I_{n-1}I_{n-2}=J_{n-1}$.
    So $J_n$ is constant, equal to $J_1=1\cdot I_1\cdot I_0=1\cdot\frac{\pi}{2}=\frac{\pi}{2}$.
  common_errors:
  - Using the recurrence with the wrong index shift
  - Applying the recurrence at $n=1$, where it is not valid
  - Evaluating $J_1$ incorrectly by using the wrong values of $I_0$ and $I_1$
  hints:
    rephrase: Show $J_n=J_{n-1}$ by replacing $nI_n$ using the recurrence from the previous part.
    smaller_case: Compute $2I_2I_1$ and compare it with $1\cdot I_1 I_0$.
    key_idea: A sequence with $J_n=J_{n-1}$ for all $n\ge 2$ is constant, so it equals its first value
      $J_1$.
  check: 2*integrate(sin(x)**2,(x,0,pi/2))*integrate(sin(x),(x,0,pi/2)) - pi/2
  check_ok: true
- goal: Show $I_{n+1}\le I_n$ and deduce $\sqrt{\frac{\pi}{2(n+1)}}\le I_n\le\sqrt{\frac{\pi}{2n}}$ for
    $n\ge1$.
  expected: $I_{n+1}\le I_n$ because $0\le\sin^{n+1}x\le\sin^nx$ on $[0,\pi/2]$. Then $I_n^2\le I_nI_{n-1}=\frac{\pi}{2n}$
    and $I_n^2\ge I_nI_{n+1}=\frac{\pi}{2(n+1)}$, and taking square roots gives the bounds.
  solution: 'On $[0,\pi/2]$ we have $0\le\sin x\le1$, so $\sin^{n+1}x\le\sin^nx$ and integrating gives
    $I_{n+1}\le I_n$. Hence for $n\ge1$, $I_{n+1}\le I_n\le I_{n-1}$, and all are positive. Multiplying
    by $I_n>0$ and using (iii): $I_n^2\le I_nI_{n-1}=\frac{\pi}{2n}$, and $I_n^2\ge I_nI_{n+1}=\frac{1}{n+1}\cdot(n+1)I_{n+1}I_n=\frac{\pi}{2(n+1)}$.
    Taking positive square roots gives the bounds.'
  common_errors:
  - Claiming $I_{n+1}\le I_n$ without using $0\le\sin x\le1$ on the interval
  - Using the monotonicity in the wrong direction when bounding $I_n^2$
  - Forgetting to apply (iii) with $n+1$ in place of $n$ for the lower bound
  - Not noting $I_n>0$ before multiplying inequalities by $I_n$
  hints:
    rephrase: Compare the integrands pointwise on $[0,\pi/2]$, then multiply the resulting chain of inequalities
      by $I_n$ and use the product identity.
    smaller_case: At $n=1$, compare $I_1^2$ with $I_1I_0$ and $I_1I_2$.
    key_idea: The product identity fixes $I_nI_{n-1}$ and $I_nI_{n+1}$ exactly, and monotonicity sandwiches
      $I_n^2$ between them.
  check: And(sqrt(pi/4)<=integrate(sin(x),(x,0,pi/2)), integrate(sin(x),(x,0,pi/2))<=sqrt(pi/2))
  check_ok: true
- goal: Find $\lim_{n\to\infty}\sqrt{n}\,I_n$ by the squeeze theorem.
  expected: $\lim_{n\to\infty}\sqrt{n}\,I_n=\sqrt{\pi/2}$.
  solution: 'Multiply the bounds from (iv) by $\sqrt n$: $\sqrt{\frac{n}{n+1}}\sqrt{\frac{\pi}{2}}\le\sqrt
    n\,I_n\le\sqrt{\frac{\pi}{2}}$. Since $\frac{n}{n+1}\to1$, the left side tends to $\sqrt{\pi/2}$ and
    the right side is constant $\sqrt{\pi/2}$. By the squeeze theorem the limit is $\sqrt{\pi/2}$.'
  common_errors:
  - Forgetting to multiply the bounds by $\sqrt n$, so the bounds tend to $0$
  - Dropping the factor of $2$ and obtaining $\sqrt{\pi}$
  - Not justifying that $\sqrt{n/(n+1)}\to1$
  hints:
    rephrase: Multiply the inequalities from the previous part by $\sqrt n$, then let $n$ grow.
    smaller_case: What is $\lim_{n\to\infty}\frac{n}{n+1}$?
    key_idea: 'Squeeze theorem: if both bounds converge to the same value, the middle term does too.'
  check: limit(sqrt(n)*sqrt(pi/(2*(n+1))),n,oo) - sqrt(pi/2)
  check_ok: true
extensions:
  '3':
  - Compute $I_2$ and $I_3$ directly from the recurrence, and check (iii) for $n=3$.
  - What is $\int_0^{\pi/2}\cos^n x\,dx$ in terms of $I_n$?
  '4':
  - Find closed forms for $I_{2m}$ and $I_{2m+1}$ using the recurrence.
  - Use $I_n\sim\sqrt{\pi/(2n)}$ to estimate $\binom{2m}{m}$ for large $m$.
  '5':
  - Use the bounds (or the ratio $I_{2k}/I_{2k+1}\to1$) to derive the Wallis product $\frac{\pi}{2}=\prod_{k\ge1}\frac{(2k)^2}{(2k-1)(2k+1)}$.
  - 'Deduce Stirling-type information: show $\binom{2m}{m}\sim\frac{4^m}{\sqrt{\pi m}}$.'
