  - Compute $\int_0^{2\pi}(\sin x+\cos 2x)^2\,dx$ using the symmetries and orthogonality.
  '5':
  - For $y=\sin(x)+\cos(nx)$ with integer $n$, characterise exactly which $n$ give a line of symmetry
    and which give a centre of symmetry, with proof.
  - For $y=\sin x+\cos(\alpha x)$ with $\alpha$ irrational, show the function is not periodic and discuss
    which symmetries survive.
