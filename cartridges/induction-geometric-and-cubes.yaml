id: induction-geometric-and-cubes
title: 'Proof by induction: geometric sum and sum of cubes'
topics:
- proof by induction
- geometric series
- sums of powers
- algebraic manipulation
warmup: false
answer_source: pdf
statement: 'Prove by induction that: (i) $a+ar+ar^2+\cdots+ar^{n-1}=a\left(\frac{1-r^n}{1-r}\right)$;
  (ii) $\sum_{r=1}^{n} r^3=\frac{1}{4}n^2(n+1)^2$.'
stages:
- goal: (i) Check the base case $n=1$ for the geometric sum (with $r\ne1$).
  expected: LHS $=a$ and RHS $=a\frac{1-r}{1-r}=a$, so the statement holds for $n=1$.
  solution: For $n=1$, the left side is $a$. The right side is $a\left(\frac{1-r^1}{1-r}\right)=a$. Since
    $r\ne1$, the cancellation is valid, so the base case holds.
  common_errors:
  - Forgetting that r must not equal 1 for the formula to make sense.
  - Writing the base case with n=0 instead of n=1 when the sum has n terms.
  - Stopping without comparing both sides explicitly.
  hints:
    rephrase: Substitute n=1 into both sides and simplify.
    smaller_case: Take n=2 and check that the sum a+ar equals the formula.
    key_idea: Check the statement at the smallest value of n for which the sum is defined.
  check: sympy.simplify(a*(1-r**1)/(1-r) - a)==0
  check_ok: null
- goal: '(i) Carry out the inductive step: assume the result for $n=k$ and deduce it for $n=k+1$.'
  expected: $a\frac{1-r^k}{1-r}+ar^k=a\frac{1-r^{k+1}}{1-r}$
  solution: Adding the next term $ar^k$ to the assumed sum gives $a\frac{1-r^k}{1-r}+ar^k=\frac{a(1-r^k)+ar^k(1-r)}{1-r}=\frac{a(1-r^{k+1})}{1-r}$,
    which is the formula with $n=k+1$.
  common_errors:
  - Adding the wrong term, e.g. ar^{k+1} instead of ar^k.
  - Algebra error when putting the two terms over a common denominator.
  - Not stating the induction hypothesis clearly before using it.
  hints:
    rephrase: Write the sum for n=k+1 as the sum for n=k plus one new term, then use the hypothesis.
    smaller_case: Take k=1 and check the step from the sum a to a+ar.
    key_idea: Put both terms over the denominator 1-r and simplify the numerator.
  check: sympy.simplify(a*(1-r**k)/(1-r) + a*r**k - a*(1-r**(k+1))/(1-r))==0
  check_ok: null
- goal: (ii) Check the base case $n=1$ for $\sum r^3=\frac14 n^2(n+1)^2$.
  expected: LHS $=1$ and RHS $=\frac14\cdot1\cdot4=1$.
  solution: For $n=1$ the left side is $1^3=1$. The right side is $\frac14\cdot1^2\cdot2^2=1$, so the
    base case holds.
  common_errors:
  - Evaluating (n+1)^2 incorrectly for n=1.
  - Forgetting the factor 1/4.
  - Using n=0 as the base case without checking the empty sum.
  hints:
    rephrase: Substitute n=1 into both sides and compare.
    smaller_case: 'Check n=2: what is 1^3+2^3 and what is the formula value?'
    key_idea: The base case only needs the smallest n in the statement.
  check: sympy.Rational(1,4)*1**2*(1+1)**2 - 1==0
  check_ok: null
- goal: (ii) Carry out the inductive step for the sum of cubes.
  expected: $\frac14k^2(k+1)^2+(k+1)^3=\frac14(k+1)^2(k+2)^2$
  solution: Adding $(k+1)^3$ to the assumed sum gives $\frac14k^2(k+1)^2+(k+1)^3=\frac14(k+1)^2\left[k^2+4(k+1)\right]=\frac14(k+1)^2(k+2)^2$,
    since $k^2+4k+4=(k+2)^2$. This is the formula with $n=k+1$.
  common_errors:
  - Failing to factor out (k+1)^2 before simplifying.
  - Expanding everything and making arithmetic errors.
  - Not recognising that k^2+4k+4 is a perfect square.
  hints:
    rephrase: Add the new term (k+1)^3 to the hypothesis and factor out the common part.
    smaller_case: Take k=1 and check that the sum of the first two cubes matches the formula for n=2.
    key_idea: Factor out (k+1)^2, then recognise the remaining quadratic as a square.
  check: sympy.simplify(sympy.Rational(1,4)*k**2*(k+1)**2 + (k+1)**3 - sympy.Rational(1,4)*(k+1)**2*(k+2)**2)==0
  check_ok: null
extensions:
  '3':
  - Prove by induction that $\sum_{r=1}^n(2r-1)=n^2$.
  '4':
  - Prove by induction that $7^n-1$ is divisible by 6 for all $n\ge1$.
  '5':
  - Prove by induction that $\sum_{r=1}^n r^2=\frac{n(n+1)(2n+1)}{6}$.
