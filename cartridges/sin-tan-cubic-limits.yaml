id: sin-tan-cubic-limits
title: Cubic-order limits involving sin and tan
topics:
- limits
- Taylor expansion
- L'Hopital's rule
- trigonometric limits
warmup: false
answer_source: generated
statement: Evaluate $\lim_{x\to 0}\frac{\sin x-x}{x^3}$. (a) Now evaluate $\lim_{x\to 0}\frac{\tan x-\sin
  x}{x^3}$. (b) Can you see a quick way to relate the two limits without redoing all the work?
stages:
- goal: Evaluate lim (sin x - x)/x^3.
  expected: -1/6.
  solution: Taylor expansion gives $\sin x = x - x^3/6 + O(x^5)$, so $(\sin x - x)/x^3 \to -1/6$. Equivalently,
    applying L'Hopital three times gives $\frac{\cos x - 1}{3x^2}$, then $\frac{-\sin x}{6x}$, then $\frac{-\cos
    x}{6} \to -\frac16$.
  common_errors:
  - Giving the sign as +1/6
  - Stopping L'Hopital after one step
  - Concluding the limit is 0 from sin x being close to x
  hints:
    rephrase: What is the first correction term of sin x near 0, beyond x?
    smaller_case: Write down the first two terms of the Taylor series of sin x.
    key_idea: Expand sin x to order x^3, or apply L'Hopital's rule three times.
  check: sp.simplify(sp.limit((sp.sin(x)-x)/x**3, x, 0) + sp.Rational(1,6))
  check_ok: null
- goal: Evaluate lim (tan x - sin x)/x^3.
  expected: 1/2.
  solution: Write $\tan x - \sin x = \sin x\,\frac{1-\cos x}{\cos x}$. Then $\frac{\tan x-\sin x}{x^3}
    = \frac{\sin x}{x}\cdot\frac{1-\cos x}{x^2}\cdot\frac{1}{\cos x}$. As $x\to 0$, these factors tend
    to $1$, $\tfrac12$, and $1$, so the limit is $\tfrac12$.
  common_errors:
  - Using 1 - cos x ~ x instead of x^2/2
  - Dropping the 1/cos x factor, or treating it as not tending to 1
  - Applying L'Hopital in a messy way without simplifying first
  hints:
    rephrase: Factor sin x out of tan x - sin x. What does tan x become in terms of sin and cos?
    smaller_case: Look at tan x - sin x for a small value such as x = 0.1 and compare it with x^3.
    key_idea: Use tan x = sin x / cos x, then the standard limits sin x / x -> 1 and 1 - cos x = 2 sin^2(x/2).
  check: sp.simplify(sp.limit((sp.tan(x)-sp.sin(x))/x**3, x, 0) - sp.Rational(1,2))
  check_ok: null
- goal: Relate the two limits by writing tan x - sin x as a difference that uses sin x - x and tan x -
    x.
  expected: (tan x - sin x)/x^3 = (tan x - x)/x^3 - (sin x - x)/x^3 -> 1/3 - (-1/6) = 1/2, since (tan
    x - x)/x^3 -> 1/3.
  solution: 'Insert and subtract $x$: $\tan x - \sin x = (\tan x - x) - (\sin x - x)$. Dividing by $x^3$
    and using part (before) $\frac{\sin x - x}{x^3}\to -\frac16$ gives the second limit as $L_{\tan} +
    \frac16$, where $L_{\tan} = \lim (\tan x - x)/x^3$. By L''Hopital, $\frac{\tan x - x}{x^3} = \frac{\tan^2
    x}{3x^2} \to \frac13$. So the limit is $\frac13 + \frac16 = \frac12$, matching part (a).'
  common_errors:
  - Subtracting the limits in the wrong order, which flips the sign
  - Thinking the two limits are equal or simply negatives of each other, without checking
  - Forgetting that tan x - x needs its own limit
  hints:
    rephrase: Write tan x - sin x as a difference of two expressions, each of which involves x.
    smaller_case: Compare the expansions tan x = x + ... and sin x = x + ... up to the x^3 term.
    key_idea: Insert and subtract x. The linear terms cancel, and the difference of two known cubic limits
      gives the answer.
  check: sp.simplify(sp.limit((sp.tan(x)-x)/x**3, x, 0) - sp.Rational(1,3))
  check_ok: null
extensions:
  '3':
