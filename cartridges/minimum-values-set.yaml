id: minimum-values-set
title: Finding minimum values
topics:
- completing the square
- inequalities
- trigonometry
- optimisation
- substitution
warmup: true
answer_source: pdf
statement: 'Find the smallest value (for real $x$ and $y$) of: (i) $x^2-2x+6$; (ii) $x^4+2x^2+y^4-2y^2+3$;
  (iii) $\sin^2 x+4\sin x$.'
stages:
- goal: Find the minimum of (i).
  expected: 5, attained at x = 1
  solution: 'Complete the square: x^2-2x+6 = (x-1)^2 + 5. Since (x-1)^2 >= 0, the expression is at least
    5, with equality at x=1.'
  common_errors:
  - Reporting the minimum as 6, the constant term
  - Sign slip when completing the square, e.g. (x+1)^2
  - Giving the minimum value without stating where it occurs
  hints:
    rephrase: Rewrite the quadratic in completed-square form.
    smaller_case: Find the minimum of x^2-4x+7 using the same method.
    key_idea: A square is never negative, so (x-a)^2 + c has minimum c.
  check: sp.expand((x-1)**2+5 - (x**2-2*x+6)) == 0 and (x**2-2*x+6).subs(x,1) == 5
  check_ok: false
- goal: Find the minimum of (ii) over all real x and y.
  expected: 2, attained at x = 0 and y = 1 or y = -1
  solution: Let u = x^2 >= 0 and v = y^2 >= 0. Then u^2+2u >= 0, with equality at u=0. Also v^2-2v = (v-1)^2
    - 1 >= -1, with equality at v=1. The total minimum is 0 + (-1) + 3 = 2.
  common_errors:
  - Treating x and y together and missing that the expression separates into an x-part and a y-part
  - Claiming the minimum of v^2-2v occurs at v=2
  - Forgetting that v=y^2 >= 0 is required
  - Adding the constant 3 incorrectly
  hints:
    rephrase: Can the expression be split into one part that depends only on x and one part that depends
      only on y?
    smaller_case: Find the minimum of t^2-2t+3 for real t, then consider how the substitution t = y^2
      changes the allowed values.
    key_idea: Substitute u = x^2 and v = y^2, noting these are non-negative, then complete the square
      in each variable.
  check: sp.expand(x**4+2*x**2 + y**4-2*y**2+3 - ((x**2)**2+2*x**2 + (y**2-1)**2 + 2)) == 0 and (x**4+2*x**2
    + y**4-2*y**2+3).subs({x:0, y:1}) == 2
  check_ok: false
- goal: Find the minimum of (iii) over real x.
  expected: -3, attained at x = -pi/2 (where sin x = -1)
  solution: Let s = sin x, so s lies in [-1, 1]. Then s^2+4s = (s+2)^2 - 4. This is increasing for s >=
    -2, so on [-1,1] the minimum is at s=-1, giving 1-4 = -3. This is attained at x = -pi/2.
  common_errors:
  - Using the vertex s=-2, which lies outside the allowed range, and reporting -4
  - Forgetting to restrict s to [-1, 1]
  - Not checking the endpoint of the allowed interval
  - Giving the value without stating an x that achieves it
  hints:
    rephrase: Can you replace sin x with a single variable? What range does it take?
    smaller_case: Find the minimum of t^2+4t for t in [0,1] first.
    key_idea: Substitute s = sin x. Because s is restricted, check whether the vertex lies inside the
      allowed interval.
  check: sp.sin(-sp.pi/2)**2 + 4*sp.sin(-sp.pi/2) == -3
  check_ok: null
extensions:
  '3':
  - Find the smallest value of x^2+6x+11 for real x.
  '4':
  - Find the smallest value of x^2+y^2-4x+6y+20 for real x and y, and state where it occurs.
  '5':
  - Find the smallest value of cos^2 x - 6cos x over real x.
