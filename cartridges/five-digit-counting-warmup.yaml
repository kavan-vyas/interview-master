id: five-digit-counting-warmup
title: Counting five-digit numbers with unique digits
topics:
- counting
- combinatorics
- permutations
- combinations
warmup: true
answer_source: generated
statement: (a) How many 5-digit numbers are there? (b) How many of these have 5 unique digits? (c) How
  many have 5 unique digits in ascending order?
stages:
- goal: Count all 5-digit numbers (part a).
  expected: '90000. The first digit can be 1 to 9 (9 choices), and each of the other four digits can be
    0 to 9 (10 choices each): 9 x 10^4 = 90000.'
  solution: A 5-digit number cannot start with 0. Choose the first digit in 9 ways and each of the remaining
    four digits in 10 ways. The total is 9 x 10 x 10 x 10 x 10 = 90000.
  common_errors:
  - Counting 10^5 = 100000 and forgetting the leading zero restriction.
  - Counting from 10000 to 99998 or similar off-by-one errors.
  hints:
    rephrase: Does a 5-digit number allow 0 as its first digit?
    smaller_case: How many 2-digit numbers are there? Count the first digit and the second digit separately.
    key_idea: Count the first digit separately because it has a restriction, then multiply by the choices
      for the other digits.
  check: 9*10**4 - 90000
  check_ok: true
- goal: Count the 5-digit numbers with all five digits distinct (part b).
  expected: 27216 = 9 x 9 x 8 x 7 x 6.
  solution: The first digit has 9 choices (1 to 9). The second digit can be any of the 9 remaining digits
    (including 0). The third has 8 choices, the fourth 7, and the fifth 6. The product is 9 x 9 x 8 x
    7 x 6 = 27216.
  common_errors:
  - Using 10 x 9 x 8 x 7 x 6 = 30240, which allows the first digit to be 0.
  - Miscounting the second digit as having only 8 choices because 0 was excluded.
  - Using 9 x 8 x 7 x 6 x 5 by excluding 0 from all positions.
  hints:
    rephrase: Count the choices position by position, starting with the first digit, and keep track of
      which digits are already used.
    smaller_case: How many 2-digit numbers have two different digits?
    key_idea: The first digit is restricted to 1 through 9. Each later digit must avoid the digits already
      used.
  check: 9*9*8*7*6 - 27216
  check_ok: true
- goal: Count the 5-digit numbers whose five digits are unique and in ascending order (part c).
  expected: 126 = C(9,5). Ascending order fixes the arrangement once the set of digits is chosen, and
    0 cannot be included because it would have to be the first digit.
  solution: Choosing 5 distinct digits and listing them in ascending order gives exactly one arrangement
    per set. If 0 is in the set, it must be the smallest digit and therefore the first digit, which is
    not allowed. So the digits must be a 5-element subset of {1, ..., 9}, giving C(9,5) = 126.
  common_errors:
  - Using C(10,5) = 252, which includes sets containing 0 that would put 0 first.
  - Counting permutations 5! instead of recognizing that ascending order fixes the arrangement.
  - Using non-strict ascending order, which would allow repeated digits even though the digits must be
    unique.
  hints:
    rephrase: Once you pick five different digits and sort them, how many arrangements are left? Which
      digit would be first if 0 were picked?
    smaller_case: How many 2-digit numbers with two different digits have their digits in increasing order?
    key_idea: The count is a choice of digits, not an arrangement, because ascending order fixes the order.
      Consider whether the digit 0 is allowed.
  check: binomial(9,5) - 126
  check_ok: true
extensions:
  '3':
  - How many 5-digit numbers have at least one repeated digit?
  '4':
  - How many 5-digit numbers have all five digits in strictly descending order?
  '5':
  - How many 5-digit numbers have digits forming a non-decreasing sequence from left to right?
