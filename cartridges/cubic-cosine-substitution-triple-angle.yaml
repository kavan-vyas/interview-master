  - Explain how the discriminant of $x^3+px+q$ relates to the number of real roots, and apply it to $x^3-3x-c$.
  '5':
  - Relate $x=2\cos\theta$ to the Chebyshev polynomial $T_3$ and explain why $2\cos n\theta$ satisfies
    a recurrence in $n$.
  - Use the same substitution to solve $x^3-3x=c$ for $|c|>2$ with hyperbolic functions, and compare the
    number of real roots in each case.
