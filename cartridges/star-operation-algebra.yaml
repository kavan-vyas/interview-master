id: star-operation-algebra
title: The star operation on numbers
topics:
- binary operations
- algebra
- identities and inverses
warmup: false
answer_source: pdf
statement: In this question, $a \ast b$ means $a+b+ab$. For example, $2 \ast 3 = 2+3+6 = 11$. (a) Work
  out $4 \ast 1$ and $(-1) \ast 5$. (b) Show that $a \ast b = b \ast a$ for all numbers $a$ and $b$. (c)
  Find a number $e$ such that $e \ast a = a$ for every number $a$. (d) Find the number $x$ such that $3
  \ast x = 0$. (e) Find all numbers $a$ such that $a \ast a = a$. (f) Show that $a \ast b + 1 = (a+1)(b+1)$.
  Use this to work out $1 \ast 2 \ast 3 \ast 4 \ast 5$, where the operations are done from left to right.
stages:
- goal: Evaluate $4 \ast 1$ and $(-1) \ast 5$ using the definition.
  expected: $4 \ast 1 = 9$ and $(-1) \ast 5 = -1$.
  solution: $4 \ast 1 = 4 + 1 + 4 \cdot 1 = 9$. $(-1) \ast 5 = -1 + 5 + (-1)(5) = -1$.
  common_errors:
  - Computing $a+b$ and forgetting the $ab$ term.
  - Mishandling the sign when multiplying by $-1$.
  hints:
    rephrase: Substitute the two numbers into $a + b + ab$ carefully, one at a time.
    smaller_case: Compute $1 \ast 1$ using the definition.
    key_idea: Every term of $a+b+ab$ must be included, with signs tracked.
  check: And(Eq(4+1+4*1, 9), Eq((-1)+5+(-1)*5, -1))
  check_ok: true
- goal: Show that $\ast$ is commutative.
  expected: $a+b+ab = b+a+ba$, which is true because addition and multiplication are commutative.
  solution: 'Expand both sides: $a \ast b = a+b+ab$ and $b \ast a = b+a+ba$. Rearranging the second gives
    $a+b+ab$ because $ba = ab$ and addition is commutative.'
  common_errors:
  - Showing it only for specific numbers rather than general $a$ and $b$.
  - Assuming commutativity without using $ab = ba$.
  hints:
    rephrase: Write both $a \ast b$ and $b \ast a$ out in full and compare them term by term.
    smaller_case: Test $a=2$ and $b=5$ to see whether the two results match.
    key_idea: Which basic properties of addition and multiplication make the two expressions equal?
  check: simplify((a+b+a*b)-(b+a+b*a))
  check_ok: true
- goal: Find the identity element $e$ with $e \ast a = a$ for all $a$, and find $x$ with $3 \ast x = 0$.
  expected: $e = 0$, and $x = -\frac{3}{4}$.
  solution: 'For identity: $e + a + ea = a$ gives $e(1+a) = 0$ for all $a$, so $e = 0$. For inverse: $3
    + x + 3x = 0$ gives $4x = -3$, so $x = -\frac{3}{4}$.'
  common_errors:
  - Taking $e = 1$ because it is the multiplicative identity.
  - Dropping the $3x$ term when solving for $x$.
  - Sign errors when dividing by 4.
  hints:
    rephrase: For the identity, substitute a general $e$ and require the result to be $a$ whatever $a$
      is.
    smaller_case: Substitute $a = 0$ into $e \ast a = a$ to see what $e$ must satisfy.
    key_idea: Collect the terms that contain $x$, then solve the resulting linear equation.
  check: And(simplify(0+a+0*a-a)==0, Rational(3)+Rational(-3,4)+3*Rational(-3,4)==0)
  check_ok: true
- goal: Find all numbers $a$ with $a \ast a = a$.
  expected: $a = 0$ or $a = -1$.
  solution: $a \ast a = 2a + a^2$. Setting this equal to $a$ gives $a^2 + a = 0$, so $a(a+1) = 0$, hence
    $a = 0$ or $a = -1$.
  common_errors:
  - Writing $a \ast a = a^2 + a$ rather than $a^2 + 2a$.
  - Finding only one of the two solutions.
  - Dividing both sides by $a$ and losing the solution $a = 0$.
  hints:
    rephrase: Expand $a \ast a$ using the definition, then move everything to one side.
    smaller_case: Write $a \ast a$ in terms of $a$ only, without using $\ast$.
    key_idea: Factorise the resulting quadratic and set each factor to zero.
  check: solveset(a*a+2*a-a, a) == FiniteSet(0, -1)
  check_ok: true
- goal: Show that $a \ast b + 1 = (a+1)(b+1)$, then use it to evaluate $1 \ast 2 \ast 3 \ast 4 \ast 5$
    left to right.
  expected: The identity holds by expansion. Then $1 \ast 2 \ast 3 \ast 4 \ast 5 = 719$.
  solution: Expanding $(a+1)(b+1) = ab + a + b + 1 = (a \ast b) + 1$. Let $r$ be the left-to-right result.
    Each step gives $r_{\text{new}} + 1 = (r_{\text{old}} + 1)(\text{next}+1)$, so $r+1 = 2 \cdot 3 \cdot
    4 \cdot 5 \cdot 6 = 720$, giving $r = 719$.
  common_errors:
  - Failing to add 1 to both sides before using the identity.
  - Multiplying the wrong factors, such as $2 \cdot 3 \cdot 4 \cdot 5$ instead of including the extra
    $+1$.
  - Subtracting 1 at the wrong stage.
  hints:
    rephrase: Expand the right-hand side and compare it with the left-hand side plus 1.
    smaller_case: Compute $1 \ast 2$ directly, then compute $(1+1)(2+1) - 1$ and compare.
    key_idea: Shifting every number by 1 turns $\ast$ into multiplication. Track the shifted result.
  check: And(expand((a+b+a*b+1)-(a+1)*(b+1))==0, 2*3*4*5*6-1==719)
  check_ok: true
extensions:
  '3':
  - Show that $\ast$ is associative, that is $(a \ast b) \ast c = a \ast (b \ast c)$ for all $a, b, c$.
  '4':
  - For $a \neq -1$, find the number $x$ such that $a \ast x = 0$, and state why $a = -1$ is excluded.
  '5':
  - Find a formula for $1 \ast 2 \ast 3 \ast \cdots \ast n$ in terms of $n$, using the identity from part
    (f).
