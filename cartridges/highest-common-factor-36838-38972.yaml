statement: Find the highest common factor of $36838$ and $38972$.
stages:
- goal: Apply the Euclidean algorithm until the remainder is zero.
  expected: 'The remainder chain ends with last nonzero remainder 2: 38972 − 36838 = 2134; 36838 = 17·2134
    + 560; 2134 = 3·560 + 454; 560 = 454 + 106; 454 = 4·106 + 30; 106 = 3·30 + 16; 30 = 16 + 14; 16 =
    14 + 2; 14 = 7·2 + 0.'
  solution: 'Using gcd(a,b) = gcd(b, a mod b) repeatedly: gcd(38972, 36838) = gcd(36838, 2134) = gcd(2134,
    560) = gcd(560, 454) = gcd(454, 106) = gcd(106, 30) = gcd(30, 16) = gcd(16, 14) = gcd(14, 2) = 2.'
  common_errors:
  - Stopping at a non-zero remainder and reporting it as the answer.
  - Arithmetic slips in the division steps, such as 17 × 2134 = 36278 being miscomputed.
  hints:
    rephrase: Replace the pair of numbers by the smaller number and the remainder, and repeat.
    smaller_case: Find gcd(48, 18) using the same repeated remainder steps.
    key_idea: The highest common factor equals the last nonzero remainder in the Euclidean algorithm.
- goal: State the highest common factor.
  expected: '2'
  solution: The last nonzero remainder is 2, and 36838 and 38972 are both even while 18419 and 19486 are
    coprime, so the HCF is 2.
  common_errors:
  - Answering 14 or 16, which are intermediate remainders.
  - Confusing the highest common factor with the lowest common multiple.
  hints:
    rephrase: Which number was the last nonzero remainder in your chain?
    smaller_case: In the chain for 48 and 18, what was the last nonzero remainder?
    key_idea: The last nonzero remainder of the Euclidean algorithm is the highest common factor.
  check: candidate - sympy.gcd(36838, 38972)
  check_ok: null
