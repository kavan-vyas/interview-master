id: astroid-graph-intercepts
title: Graph x^(2/3)+y^(2/3)=a^(2/3) and mark intercepts
topics:
- curve sketching
- fractional powers
- intercepts
- symmetry
- parametric curves
warmup: false
answer_source: generated
statement: 'Graph the following. Mark any intercepts: $x^{\frac{2}{3}} + y^{\frac{2}{3}} = a^{\frac{2}{3}},
  \ a > 0$'
stages:
- goal: Find all intercepts of the curve with the axes.
  expected: x-intercepts $(\pm a,0)$ and y-intercepts $(0,\pm a)$.
  solution: 'Put $y=0$: $x^{2/3}=a^{2/3}$. For real $x$, $x^{2/3}=(x^{1/3})^2\ge 0$, so raise both sides
    to the power $3/2$ to get $|x|=a$, i.e. $x=\pm a$. By the same argument with $x=0$: $y=\pm a$.'
  common_errors:
  - Giving only $x=a$ and forgetting the negative root.
  - Writing $x=a^{2/3}$ or $x=a^{3/2}$ (wrong inverse of the fractional power).
  - Concluding there are no y-intercepts because the equation looks asymmetric.
  - Listing intercepts but forgetting to mark them on the graph.
  hints:
    rephrase: Set one variable to zero and see what the other variable must satisfy.
    smaller_case: Compare with $x^{2}=a^{2}$. How many real solutions does that have, and does the fractional
      power change that count?
    key_idea: For real $x$, $x^{2/3}=(x^{1/3})^2$ is non-negative, and raising to the power $3/2$ undoes
      it while keeping track of the sign of $x$.
  check: simplify(x_int**2 - a**2)  (x_int is the stated x-intercept; this is 0 for both $\pm a$)
  check_ok: null
- goal: Describe the shape of the graph, its bounds and symmetry, and sketch it.
  expected: A four-cusped astroid, symmetric in both axes, lying inside the square $|x|\le a,\ |y|\le
    a$. Cusps sit at the four intercepts, and the arcs bow inward towards the origin.
  solution: 'Bounds: $x^{2/3}\le a^{2/3}$ gives $|x|\le a$, and likewise $|y|\le a$. Symmetry: replacing
    $x$ by $-x$ or $y$ by $-y$ leaves the equation unchanged. Parametrise with $x=a\cos^3 t,\ y=a\sin^3
    t$. Check: $x^{2/3}=a^{2/3}\cos^2 t$ and $y^{2/3}=a^{2/3}\sin^2 t$, which sum to $a^{2/3}$. Near $t=0$,
    $x\approx a-\tfrac{3a}{2}t^2$ and $y\approx a t^3$, so $y\propto (a-x)^{3/2}$. Both branches meet
    at $(a,0)$ tangent to the x-axis, which is a cusp. The same holds at the other three intercepts.'
  common_errors:
  - Drawing an ellipse or circle through the intercepts.
  - Treating the intercepts as smooth points instead of cusps.
  - Forgetting that the curve lies inside the box $|x|,|y|\le a$.
  - Drawing arcs that bulge outward rather than inward towards the origin.
  hints:
    rephrase: Find the largest allowed values of $|x|$ and $|y|$, then ask what the curve does between
      the axes.
    smaller_case: Take $a=1$ and test the diagonal $x=y$. Is the curve close to the origin or near the
      corners of the box?
    key_idea: A trigonometric parametrisation with $\cos^2 t+\sin^2 t=1$ turns the fractional-power equation
      into a shape you can trace. Cusps are where the parameter reverses direction.
  check: null
extensions:
  '3':
  - Find the length of the first-quadrant arc of the astroid (the total perimeter is $6a$).
  '4':
  - Find the area enclosed by the astroid using the parametrisation.
  '5':
  - Show that $x=a\cos^3 t,\ y=a\sin^3 t$ is the only parametrisation needed, and state the range of $t$
    that traces the full curve once.
