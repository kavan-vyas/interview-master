id: log-ratio-x-over-y
title: 'Logarithm equation: find x over y'
topics:
- logarithms
- domain of functions
- quadratic equations
- factorisation
warmup: true
answer_source: generated
statement: If $2\log(x-2y)=\log(x)+\log(y)$ find $\dfrac{x}{y}$.
stages:
- goal: State the domain conditions needed for every logarithm in the equation to be defined.
  expected: x > 0, y > 0, and x - 2y > 0.
  solution: The logarithms log(x), log(y), and log(x-2y) are defined only for positive arguments, so x
    > 0, y > 0, and x - 2y > 0.
  common_errors:
  - Forgetting one of the three conditions
  - Writing x - 2y >= 0 instead of strict inequality
  - Ignoring the domain entirely
  hints:
    rephrase: List every expression inside a logarithm and state what sign each must have.
    smaller_case: Ask what condition makes log(x) defined on its own.
    key_idea: Each logarithm needs its argument to be strictly positive. Write this down before doing
      any algebra.
  check: null
- goal: Remove the logarithms and form a quadratic relation between x and y.
  expected: (x-2y)^2 = xy, which rearranges to x^2 - 5xy + 4y^2 = 0.
  solution: Since 2 log(x-2y) = log((x-2y)^2), the equation becomes log((x-2y)^2) = log(xy). Taking exponentials
    (log is injective on positive reals) gives (x-2y)^2 = xy. Expanding gives x^2 - 4xy + 4y^2 = xy, so
    x^2 - 5xy + 4y^2 = 0.
  common_errors:
  - Writing 2 log(x-2y) as log(x-2y)^2 incorrectly, e.g. as log(x^2 - 4y^2)
  - Expanding (x-2y)^2 as x^2 - 4y^2
  - Losing the xy term when moving it across
  hints:
    rephrase: Use the log power rule to bring the factor 2 inside, then combine the logs on the right.
    smaller_case: Write the equation with y = 1 and solve the resulting equation for x.
    key_idea: Once the logarithms are combined on both sides, equate the arguments and expand carefully.
  check: sp.expand((x - 2*y)**2 - x*y - (x**2 - 5*x*y + 4*y**2))
  check_ok: true
- goal: Factor the quadratic, reject any root that violates the domain, and find x/y.
  expected: x/y = 4.
  solution: 'x^2 - 5xy + 4y^2 = (x-y)(x-4y). If x = y then x - 2y = -y < 0, which violates the domain,
    so this factor is rejected. Hence x = 4y and x/y = 4. Check: with x = 4, y = 1, the left side is 2
    log 2 = log 4 = log 4 + log 1, so the equation holds.'
  common_errors:
  - Keeping x = y as a valid solution
  - Failing to check the domain after solving
  - Inverting the ratio and reporting y/x = 1/4
  hints:
    rephrase: Factor the quadratic in x and y, then test each factor against the domain conditions you
      wrote down.
    smaller_case: 'Test x = y directly: what is x - 2y in that case?'
    key_idea: Divide the quadratic by y^2 to get a quadratic in x/y. Its roots give the candidate ratios,
      and the domain removes one.
  check: (sp.Integer(4)**2 - 5*sp.Integer(4) + 4) + (sp.Integer(4) - 4)
  check_ok: null
extensions:
  '3':
  - Show that 2 log(x+2y) = log x + log y has no solution with x, y > 0.
  - Explain why the root x = y is removed by the domain and not by the algebra.
  '4':
  - Explain why checking the domain before taking logarithms prevents extraneous solutions in general.
  - Find all positive x, y with 2 log(x-2y) = log x + log y and x - y = 3.
  '5':
  - 'Solve the equation by parametrising solutions: for fixed y > 0, find all admissible x and check which
    ones satisfy the domain.'
  - Show that the ratio x/y is the only quantity determined by the equation, by writing it as a function
    of the ratio r = x/y.
