id: hat-colours-three-modulo-strategy
title: 'Three-colour hats: modulo-3 sum strategy'
topics:
- combinatorics
- modular arithmetic
- information and strategy
- logic puzzles
warmup: false
answer_source: pdf
statement: 'Same prisoner setup as before, but now there are $3$ possible hat colours: red, blue and white.
  What is the best strategy they can adopt and how many prisoners can they guarantee to save?'
stages:
- goal: Find the first prisoner's best chance of survival under the strategy.
  expected: $\frac13$
  solution: The first prisoner cannot see his own hat, and his announcement is a function only of the
    hats he sees, which are independent of his own colour. So he cannot learn his own colour from the
    announcement, and his best option is to guess. With three equally likely colours, he survives with
    probability $\frac13$.
  common_errors:
  - Claiming the first prisoner can deduce his own colour from the announcement.
  - Answering $\frac23$ by confusing survival with the chance of guessing wrong.
  - Answering $0$ or $1$ by assuming the first prisoner is either always or never saved.
  hints:
    rephrase: Think about what information the first prisoner's own announcement can contain about his
      own hat.
    smaller_case: Imagine only one prisoner with a hat, and no one else to announce anything. What can
      he know about his own colour?
    key_idea: The first prisoner's message depends only on hats he can see, so it carries no information
      about his own colour.
  check: Eq(Rational(1,3), 1/S(3))
  check_ok: true
- goal: State how many prisoners can be guaranteed to survive with the best strategy.
  expected: $99$
  solution: The first prisoner announces $S$, the sum of the scores of prisoners $2$ to $100$, modulo
    $3$, where red is $0$, blue is $1$ and white is $2$. Prisoner $k$ for $k \ge 2$ has heard the deduced
    colours of prisoners $2$ to $k-1$ and can see prisoners $k+1$ to $100$. So he knows the sum of all
    scores from $2$ to $100$ except his own. Subtracting this from $S$ modulo $3$ gives his own score,
    since scores lie in $\{0,1,2\}$. Thus every prisoner from $2$ to $100$ survives, which is $99$ prisoners.
  common_errors:
  - Answering $100$, forgetting that the first prisoner cannot be guaranteed to survive.
  - Using modulo $2$ instead of modulo $3$, which cannot distinguish three colours.
  - Forgetting that each later prisoner has already heard the earlier deductions.
  hints:
    rephrase: Ask which prisoner has the hardest job, and then ask how many of the others can still deduce
      their colour.
    smaller_case: With three prisoners and three colours, work out who is guaranteed to survive if the
      first announces the sum of the other two mod 3.
    key_idea: 'Each later prisoner only needs to work out one unknown value: his own score modulo 3.'
  check: Eq(99, 100 - 1)
  check_ok: true
extensions:
  '3':
  - With $4$ hat colours, how many prisoners can be guaranteed to survive, and what is the first prisoner's
    survival chance?
  '4':
  - If each prisoner can see only the hats in front of him, does the modulo-3 sum strategy still work?
    Explain why or why not.
  '5':
  - If the hats are not uniformly random, can the first prisoner do better than guessing his own colour?
    Justify your answer.
