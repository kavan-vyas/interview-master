statement: Investigate $S_n = 1^3 + 2^3 + \dots + n^3$. Find and prove a closed form.
stages:
- goal: Spot the pattern for n = 1..4
  expected: '1, 9, 36, 100: all perfect squares'
  solution: S_1..S_4 = 1, 9, 36, 100 = 1^2, 3^2, 6^2, 10^2.
  common_errors:
  - arithmetic slip computing 36 or 100
  - guessing n^3-based pattern
  hints:
    rephrase: What kind of numbers are these totals?
    smaller_case: Write out S_1, S_2, S_3 and look at each one on its own.
    key_idea: Consider square numbers.
- goal: Identify the square roots as triangular numbers
  expected: 1, 3, 6, 10 = n(n+1)/2, so S_n = (n(n+1)/2)^2
  solution: Roots are triangular numbers T_n = n(n+1)/2. Conjecture S_n = T_n^2.
  common_errors:
  - writing n(n-1)/2
  - conjecturing n^2(n+1)^2 without the 1/4
  hints:
    rephrase: Look at the numbers being squared. Have you seen that sequence before?
    smaller_case: What are the differences between 1, 3, 6, 10?
    key_idea: Think about 1 + 2 + ... + n.
  check: Sum(k**3, (k, 1, 10)) - (10*11/2)**2
- goal: Prove the closed form
  expected: 'Induction: S_{n+1} = S_n + (n+1)^3 = ((n+1)(n+2)/2)^2'
  solution: Assume S_n = n^2(n+1)^2/4. Then S_{n+1} = (n+1)^2 (n^2 + 4n + 4)/4 = (n+1)^2(n+2)^2/4.
  common_errors:
  - assuming the n+1 case
  - not factoring (n+1)^2 out
  - forgetting the base case
  hints:
    rephrase: How would you show this holds for every n, not just the ones you checked?
    smaller_case: Suppose it is true for n = 4. How does that tell you about n = 5?
    key_idea: Induction, and factor out (n+1)^2.
  check: n**2*(n+1)**2/4 + (n+1)**3 - (n+1)**2*(n+2)**2/4
extensions:
  3:
  - Is there a geometric picture for 1^3 + ... + n^3 = (1 + ... + n)^2?
  4:
  - Find the sum of the first n odd cubes.
  - Show the sum of the first n cubes is a square without induction (telescoping or a counting argument).
  5:
  - For which k is 1^k + ... + n^k a perfect square for all n?
  - Find all n for which 1^3 + ... + n^3 is a perfect fourth power.
