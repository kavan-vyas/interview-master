id: denest-surd-difference-warmup
title: Simplify a difference of nested surds
topics:
- surds
- denesting square roots
- algebraic manipulation
warmup: true
answer_source: generated
statement: Simplify $\sqrt{16 + 4\sqrt{3} + 3} - \sqrt{12 - 4\sqrt{3} + 1}$
stages:
- goal: Simplify the second root $\sqrt{12 - 4\sqrt{3} + 1}$ by writing its radicand as a perfect square.
  expected: $\sqrt{13 - 4\sqrt{3}} = 2\sqrt{3} - 1$
  solution: Write $13 - 4\sqrt{3} = (2\sqrt{3})^2 - 2(2\sqrt{3})(1) + 1^2 = (2\sqrt{3} - 1)^2$. Since
    $2\sqrt{3} \approx 3.46 > 1$, the base $2\sqrt{3} - 1$ is positive, so $\sqrt{13 - 4\sqrt{3}} = 2\sqrt{3}
    - 1$.
  common_errors:
  - Splitting the root as $\sqrt{13} - \sqrt{4\sqrt{3}}$, which is not valid.
  - Writing the result as $1 - 2\sqrt{3}$, which is negative and so cannot be the principal square root.
  - Forgetting to check the sign of the base before taking the root.
  hints:
    rephrase: 'Look at the second root on its own: $12 - 4\sqrt{3} + 1$. Can the radicand be written as
      a squared binomial involving $\sqrt{3}$?'
    smaller_case: Try to match $(p - q)^2 = p^2 + q^2 - 2pq$ with $p^2 + q^2 = 13$ and $2pq = 4\sqrt{3}$.
      Start with a simple guess such as $q = 1$.
    key_idea: A nested root $\sqrt{m - 2\sqrt{n}}$ can be denested when two numbers $x, y$ satisfy $x
      + y = m$ and $xy = n$. Here $x + y = 13$ and $xy = 12$.
  check: simplify(sqrt(12-4*sqrt(3)+1) - (2*sqrt(3)-1)) == 0
  check_ok: true
- goal: Simplify the first root $\sqrt{16 + 4\sqrt{3} + 3}$, decide whether it denests, and give the full
    simplified expression.
  expected: $\sqrt{19 + 4\sqrt{3}} - 2\sqrt{3} + 1$ (the first root does not denest; the result is approximately
    $2.628$)
  solution: 'The first root is $\sqrt{19 + 4\sqrt{3}}$. Suppose it equals $\sqrt{x} + \sqrt{y}$. Squaring
    gives $x + y = 19$ and $2\sqrt{xy} = 4\sqrt{3}$, so $xy = 12$. Then $x$ and $y$ are roots of $t^2
    - 19t + 12 = 0$, with discriminant $361 - 48 = 313$, which is not a perfect square. So the root does
    not denest into a simpler form. Combining with the previous stage: $\sqrt{19 + 4\sqrt{3}} - (2\sqrt{3}
    - 1) = \sqrt{19 + 4\sqrt{3}} - 2\sqrt{3} + 1$. Numerically this is about $5.0920 - 3.4641 + 1 \approx
    2.6279$.'
  common_errors:
  - Writing $\sqrt{16 + 3} = \sqrt{16} + \sqrt{3}$ or similar incorrect splitting.
  - Dropping the minus sign when subtracting $2\sqrt{3} - 1$, which gives $-2\sqrt{3} - 1$ instead of
    $-2\sqrt{3} + 1$.
  - Claiming $\sqrt{19 + 4\sqrt{3}}$ denests to a clean form without checking the discriminant.
  - Combining unlike terms, such as adding $\sqrt{19 + 4\sqrt{3}}$ to $2\sqrt{3}$.
  hints:
    rephrase: Does the first root $\sqrt{19 + 4\sqrt{3}}$ fit the same pattern as the second? Test whether
      it can be written as $\sqrt{x} + \sqrt{y}$.
    smaller_case: Set up $x + y = 19$ and $xy = 12$ and check whether the values of $x$ and $y$ come out
      as neat numbers.
    key_idea: If the denesting pattern fails, leave the root in place. Then subtract the simplified second
      root carefully, keeping track of signs.
  check: simplify(sqrt(16+4*sqrt(3)+3) - sqrt(12-4*sqrt(3)+1) - (sqrt(19+4*sqrt(3)) - 2*sqrt(3) + 1))
    == 0
  check_ok: true
extensions:
  '3':
  - 'Simplify $\sqrt{7 + 4\sqrt{3}} - \sqrt{7 - 4\sqrt{3}}$. (Answer: $2\sqrt{3}$, since $7 \pm 4\sqrt{3}
    = (2 \pm \sqrt{3})^2$.)'
  - 'Simplify $\sqrt{5 + 2\sqrt{6}}$. (Answer: $\sqrt{2} + \sqrt{3}$.)'
  '4':
  - Prove that there are no rational numbers $a, b$ with $(a + b\sqrt{3})^2 = 19 + 4\sqrt{3}$. Explain
    why this shows $\sqrt{19 + 4\sqrt{3}}$ cannot be simplified in $\mathbb{Q}(\sqrt{3})$.
  - Explain why $\sqrt{x} + \sqrt{y}$ squared gives a nested root that denests only when $x + y$ and $xy$
    are chosen correctly, and state the general condition for $\sqrt{m + \sqrt{n}}$ to denest into $\sqrt{x}
    + \sqrt{y}$.
  '5':
  - Without a calculator, prove that $\sqrt{19 + 4\sqrt{3}} - 2\sqrt{3} + 1$ lies strictly between $2.6$
    and $2.7$.
  - 'Generalise the problem: for which integers $m, n$ does $\sqrt{m + n\sqrt{3}} - \sqrt{m'' - n''\sqrt{3}}$
    simplify to a single surd-free expression? Justify your answer.'
