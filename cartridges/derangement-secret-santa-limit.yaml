id: derangement-secret-santa-limit
title: 'Secret Santa derangements: limit and recurrence'
topics:
- derangements
- inclusion-exclusion
- recurrence relations
- probability
- limits
warmup: false
answer_source: pdf
statement: At a Secret Santa, $n$ people draw names at random. (iv) Find the limit, as $n \to \infty$,
  of the probability that nobody draws their own name. (v) Prove that $D_n = (n-1)(D_{n-1}+D_{n-2})$ for
  $n \geq 3$.
stages:
- goal: Express the probability that nobody draws their own name in terms of $D_n$, then find its limit
    as $n \to \infty$.
  expected: $P_n = D_n/n! = \sum_{k=0}^{n}(-1)^k/k!$, and $P_n \to e^{-1} \approx 0.368$.
  solution: Each draw is one of $n!$ equally likely permutations, and $D_n$ of them are derangements,
    so $P_n = D_n/n!$. Inclusion-exclusion over the people who draw their own name gives $D_n = \sum_{k=0}^{n}(-1)^k\binom{n}{k}(n-k)!
    = n!\sum_{k=0}^{n}(-1)^k/k!$. The series $\sum_{k\geq 0}(-1)^k/k!$ converges to $e^{-1}$, so the limit
    is $e^{-1}$.
  common_errors:
  - Giving $e$ instead of $e^{-1}$, which is a sign error in the alternating series.
  - Answering with $D_n$ rather than the probability $D_n/n!$.
  - Treating the 'own name' events as independent instead of applying inclusion-exclusion.
  hints:
    rephrase: Each draw is one of $n!$ equally likely permutations. How many of them have no fixed point?
    smaller_case: For $n=2$ there are two possible draws. How many of them leave nobody with their own
      name?
    key_idea: Use inclusion-exclusion over the set of people who do draw their own name.
  check: sympy.Sum((-1)**sympy.Symbol('k')/sympy.factorial(sympy.Symbol('k')),(sympy.Symbol('k'),0,sympy.oo)).doit()
    - sympy.exp(-1)
  check_ok: null
- goal: Prove that $D_n=(n-1)(D_{n-1}+D_{n-2})$ for $n\geq 3$.
  expected: 'Split on the person $k$ that $n$ is sent to ($n-1$ choices). If $k$ is sent to $n$, the remaining
    $n-2$ people form a derangement: $D_{n-2}$ ways. If $k$ is not sent to $n$, the arrangement is in
    bijection with a derangement of $n-1$ objects: $D_{n-1}$ ways.'
  solution: 'Let person $n$ be sent to person $k \neq n$, giving $n-1$ choices. Case A: $k$ is sent to
    $n$. Removing $n$ and $k$ leaves $n-2$ people who must form a derangement among themselves, giving
    $D_{n-2}$. Case B: $k$ is not sent to $n$. Let $j$ be the person who is sent to $n$, and redirect
    $j$ to $k$. Removing $n$ then gives a derangement of the $n-1$ people $\{1,\dots,n-1\}$, and this
    map is invertible, so there are $D_{n-1}$ such arrangements. Summing over the $n-1$ choices of $k$
    gives $D_n=(n-1)(D_{n-1}+D_{n-2})$.'
  common_errors:
  - Forgetting that case B needs $k$ to be treated as the forbidden target of $j$, so the count is not
    simply $D_{n-1}$ without the redirect argument.
  - Using $n-2$ for case B or $n-1$ for case A.
  - Multiplying by $n$ instead of $n-1$, since $n$ cannot be sent to itself.
  hints:
    rephrase: Fix where person $n$ sends their gift and split the cases on what happens to the recipient.
    smaller_case: Check the case $n=3$ by listing the derangements of 3 people.
    key_idea: Either the recipient $k$ sends back to $n$, which shortens the cycle by two, or it does
      not, and then removing $n$ gives a smaller derangement.
- goal: Check the recurrence numerically by computing $D_5$.
  expected: $D_5 = 44$, from $4(D_4+D_3) = 4(9+2) = 44$.
  solution: Using $D_1=0$, $D_2=1$, $D_3=2$, $D_4=9$, the recurrence gives $D_5=4(9+2)=44$. Inclusion-exclusion
    also gives $D_5=120(1-1+1/2-1/6+1/24-1/120)=44$.
  common_errors:
  - Using $D_4=8$ or $D_3=1$ from an incorrect base table.
  - Computing $4\cdot 9+2=38$ by misplacing the bracket.
  hints:
    rephrase: You need $D_3$ and $D_4$ first. Can you get them by a direct count?
    smaller_case: Compute $D_3$ by listing the derangements of three people.
    key_idea: Build up from the small values using the recurrence.
  check: sum((-1)**k*sympy.factorial(5)/sympy.factorial(k) for k in range(6)) - 44
  check_ok: null
extensions:
  '3':
  - Show that $D_n = nD_{n-1}+(-1)^n$ and deduce a closed form for $D_n$.
  '4':
  - Show that the probability of exactly $k$ self-matches tends to $e^{-1}/k!$ as $n \to \infty$.
  '5':
  - Bound the error $|D_n/n! - e^{-1}|$ in terms of $n$.
