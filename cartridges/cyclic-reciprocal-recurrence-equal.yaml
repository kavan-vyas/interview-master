id: cyclic-reciprocal-recurrence-equal
title: 'STEP: cyclic system x_i = 1 + 1/x_{i+1}, show all equal and find x_1'
topics:
- sequences
- recurrence relations
- proof
- algebraic manipulation
- quadratic equations
- inequalities
warmup: false
answer_source: generated
statement: The $n$ positive numbers $x_1, x_2, \ldots, x_n$, where $n \geq 3$, satisfy $x_1 = 1 + \frac{1}{x_2}$,
  $x_2 = 1 + \frac{1}{x_3}$, $\ldots$, $x_{n-1} = 1 + \frac{1}{x_n}$, and also $x_n = 1 + \frac{1}{x_1}$.
  Show that (i) $x_1, x_2, \ldots, x_n > 1$, (ii) $x_1 - x_2 = -\frac{x_2 - x_3}{x_2 x_3}$, (iii) $x_1
  = x_2 = \cdots = x_n$. Hence find the value of $x_1$.
stages:
- goal: 'Part (i): show that every x_i > 1.'
  expected: Since every x_j > 0, each reciprocal 1/x_{j} is positive, so x_i = 1 + 1/x_{i+1} > 1 for every
    i (indices taken cyclically, so x_{n+1} = x_1).
  solution: Each equation has the form x_i = 1 + 1/x_{i+1} with x_{i+1} > 0 by hypothesis. Hence 1/x_{i+1}
    > 0 and x_i > 1. This holds for i = 1, ..., n, using the wrap-around equation x_n = 1 + 1/x_1 for
    the last one.
  common_errors:
  - Checking only x_1 and not the whole cycle.
  - Assuming 1/x > 1 for every positive x.
  hints:
    rephrase: Look at the reciprocal term in each equation and what you know about its sign.
    smaller_case: Take only x_1 = 1 + 1/x_2. If x_2 > 0, what can you say about 1/x_2 and therefore about
      x_1?
    key_idea: Positivity of the reciprocal term forces each x_i to exceed the constant part of its equation.
  check: null
- goal: 'Part (ii): show that x_1 - x_2 = -(x_2 - x_3)/(x_2 x_3).'
  expected: $x_1 - x_2 = \frac{1}{x_2} - \frac{1}{x_3} = \frac{x_3 - x_2}{x_2 x_3} = -\frac{x_2 - x_3}{x_2
    x_3}$
  solution: 'Subtract the equation for x_2 from the equation for x_1: x_1 - x_2 = 1/x_2 - 1/x_3. Put over
    the common denominator x_2 x_3: (x_3 - x_2)/(x_2 x_3). Factor out the minus sign to get -(x_2 - x_3)/(x_2
    x_3).'
  common_errors:
  - Sign error when combining 1/x_2 - 1/x_3 over a common denominator.
  - Forgetting to subtract the two equations, or subtracting in the wrong order.
  hints:
    rephrase: Subtract the equation for x_2 from the equation for x_1, then combine the two reciprocals.
    smaller_case: Ignore the rest of the cycle and compute x_1 - x_2 using only the first two equations.
    key_idea: Write 1/x_2 - 1/x_3 as a single fraction and watch the order of the numerator terms.
  check: simplify(ans - (x3 - x2)/(x2*x3)) == 0
  check_ok: false
- goal: 'Part (iii): prove x_1 = x_2 = ... = x_n.'
  expected: Let d_i = x_i - x_{i+1} (indices mod n). Then d_i = -d_{i+1}/(x_{i+1} x_{i+2}), so |d_i| =
    |d_{i+1}|/(x_{i+1}x_{i+2}) < |d_{i+1}| because each x_j > 1. Going round the cycle gives |d_1| < |d_2|
    < ... < |d_n| < |d_1| unless all d_i = 0, which is impossible. Hence all d_i = 0 and x_1 = x_2 = ...
    = x_n.
  solution: 'By part (ii), the same identity holds for every consecutive triple, including the wrap-around:
    d_n = x_n - x_1 = 1/x_1 - 1/x_2 = -d_1/(x_1 x_2). So d_i = -d_{i+1}/(x_{i+1} x_{i+2}) for all i, cyclically.
    If some d_i is non-zero then all are non-zero, and |d_i| = |d_{i+1}|/(x_{i+1}x_{i+2}) with x_{i+1}x_{i+2}
    > 1 gives |d_i| < |d_{i+1}| for all i. Around the cycle this forces |d_1| < |d_1|, a contradiction.
    So every d_i = 0.'
  common_errors:
  - Concluding equality from the sign alternation alone, without using the size argument.
  - Forgetting the wrap-around relation between x_n and x_1.
  - Assuming differences shrink without justifying it from x_j > 1.
  hints:
    rephrase: Compare the sizes of successive differences x_i - x_{i+1}, using the relation from part
      (ii) together with part (i).
    smaller_case: Take n = 3 and write the three differences around the cycle. How does each one relate
      to the next in size?
    key_idea: Each step multiplies the size of a difference by a factor less than 1. Going round a closed
      cycle then gives a contradiction unless all differences are zero.
  check: null
- goal: Find the value of x_1.
  expected: $x_1 = \frac{1+\sqrt{5}}{2}$
  solution: 'With all x_i equal to x, the equation becomes x = 1 + 1/x. Multiply by x: x^2 - x - 1 = 0,
    so x = (1 +/- sqrt(5))/2. Since x > 1 by part (i), and (1 - sqrt(5))/2 < 0, take x = (1+sqrt(5))/2.'
  common_errors:
  - Keeping both roots of the quadratic, including the negative one.
  - Algebra error when multiplying through by x.
  - Using x = 1 as a solution, which fails since 1 = 1 + 1/1 is false.
  hints:
    rephrase: Once all the x_i are equal, what single equation does their common value satisfy?
    smaller_case: Substitute x = 2 into x = 1 + 1/x. Is it a solution? What does the mismatch tell you
      about the next guess?
    key_idea: Clear the fraction to get a quadratic, then use the lower bound from part (i) to choose
      the root.
  check: simplify(ans - (1 + sympy.sqrt(5))/2) == 0
  check_ok: null
extensions:
  '3':
  - Show that g(x) = 1 + 1/x maps the interval [1, infinity) into itself and that |g'(x)| = 1/x^2 <= 1
    there, so the fixed point is attracting.
  '4':
  - Start from x_0 = 1 and iterate x_{k+1} = 1 + 1/x_k. Compute the first four iterates and explain why
    they oscillate around the fixed point and converge to it.
  '5':
  - Show that the value found satisfies 1/phi = phi - 1, where phi is the golden ratio, and explain why
    the cyclic system forces this positive root rather than the negative one.
