id: quadratic-form-x2-ny2
title: Solutions of x²−ny²=0
topics:
- algebra
- loci
- irrational numbers
- natural number solutions
warmup: false
answer_source: generated
statement: Sketch $x^2-ny^2=0$ where $n$ is a natural number. Find all natural solution pairs $(x,y)$
  in the case $n=9$. Find all natural solution pairs $(x,y)$ in the case $n=10$.
stages:
- goal: Sketch the locus x²−ny²=0 for a natural number n.
  expected: Two straight lines through the origin, x=√n·y and x=−√n·y.
  solution: x²−ny²=(x−√n·y)(x+√n·y). The product is zero exactly when one factor is zero, so the graph
    is the union of the two lines x=±√n·y through the origin.
  common_errors:
  - Drawing a parabola or a hyperbola
  - Forgetting the second line x=−√n·y
  - Confusing the locus over the reals with the set of natural-number points
  hints:
    rephrase: Can you factor x²−ny² as a difference of squares?
    smaller_case: Take n=1 and describe the set of points with x²−y²=0.
    key_idea: A difference of two squares factors into a product of two linear terms.
  check: null
- goal: Find all natural solution pairs (x,y) when n=9.
  expected: (x,y)=(3k,k) for every natural k, that is, all pairs with x=3y.
  solution: x²=9y² gives x=3y, since x and y are non-negative. Every pair (3k,k) with k=1,2,3,... works.
    If 0 is counted as natural, (0,0) is also a solution.
  common_errors:
  - Writing x=9y instead of x=3y
  - Keeping x=−3y, which is not natural
  - Listing only a few pairs without giving the general family
  hints:
    rephrase: Take the square root of both sides. What must be the relation between x and y?
    smaller_case: Find the pairs with y=1 and y=2.
    key_idea: Compare x with a multiple of y, using only non-negative values.
  check: null
- goal: Find all natural solution pairs (x,y) when n=10.
  expected: No positive solutions. Only (0,0) if 0 is counted as natural.
  solution: Suppose y≠0. Then x²=10y² gives x/y=√10. But √10 is irrational because 10 is not a perfect
    square, while x/y is rational. Contradiction, so y=0, which forces x=0.
  common_errors:
  - Claiming √10 is rational
  - Searching for small integer examples without proving none exist
  - Forgetting to handle the case y=0
  hints:
    rephrase: If y is not zero, what can you say about the ratio x/y?
    smaller_case: Check whether x²=2y² has any positive integer solutions.
    key_idea: Compare the rational ratio x/y with the square root of 10, which is irrational.
  check: null
extensions:
