id: max-min-uniform-expectations
title: Expected max, min and gap of two uniforms, then the German tank estimator
topics:
- probability
- order statistics
- expectation
- unbiased estimation
- continuous distributions
warmup: false
answer_source: pdf
statement: 'Let $X$ and $Y$ be independent and uniform on $[0,1]$.


  (i) Show that $P(\max(X,Y)\le t)=t^2$ for $0\le t\le 1$, and hence find $E[\max(X,Y)]$.


  (ii) Find $E[\min(X,Y)]$.


  (iii) Find $E|X-Y|$.


  (iv) If $X_1,\dots,X_n$ are independent and uniform on $[0,1]$, show that $E[\max_i X_i]=\frac{n}{n+1}$.


  (v) Serial numbers are uniform on $[0,\theta]$ for an unknown $\theta$. You observe $n$ of them, with
  maximum $m$. Explain why $\frac{n+1}{n}\,m$ is a sensible estimate of $\theta$.'
stages:
- goal: Show $P(\max(X,Y)\le t)=t^2$ and use it to compute $E[\max(X,Y)]$.
  expected: $P(\max\le t)=P(X\le t)P(Y\le t)=t\cdot t=t^2$ by independence. The density is the derivative,
    $2t$ on $[0,1]$. Then $E[\max]=\int_0^1 t\cdot 2t\,dt=2/3$.
  solution: The event $\{\max(X,Y)\le t\}$ is $\{X\le t\}\cap\{Y\le t\}$, so by independence $P=t\cdot
    t=t^2$ for $0\le t\le 1$. Differentiating gives density $2t$ on $[0,1]$. Hence $E[\max]=\int_0^1 t\cdot
    2t\,dt=\tfrac{2}{3}$.
  common_errors:
  - Adding the two probabilities instead of multiplying them
  - Forgetting to differentiate the CDF to get the density
  - Integrating $t$ against the CDF $t^2$ instead of the density $2t$
  hints:
    rephrase: The maximum is at most $t$ exactly when both variables are at most $t$.
    smaller_case: 'Start with one uniform variable: what is $P(X\le t)$?'
    key_idea: Independence lets you multiply probabilities; then differentiate the CDF to get the density
      and integrate $t$ times the density.
  check: Rational(2,3) - integrate(t*2*t,(t,0,1))
  check_ok: true
- goal: Find $E[\min(X,Y)]$.
  expected: $P(\min>t)=(1-t)^2$, so the density is $2(1-t)$ and $E[\min]=1/3$. Equivalently, $\max+\min=X+Y$
    gives $E[\min]=1-2/3=1/3$.
  solution: '$P(\min>t)=P(X>t)P(Y>t)=(1-t)^2$, so $P(\min\le t)=1-(1-t)^2$ and the density is $2(1-t)$.
    Then $E[\min]=\int_0^1 t\cdot 2(1-t)\,dt=1-\tfrac{2}{3}=\tfrac13$. Check: $\max+\min=X+Y$ has expectation
    $1$, so $E[\min]=1-\tfrac23=\tfrac13$.'
  common_errors:
  - Using the density of the max for the min
  - Mixing up $P(\min>t)$ with $P(\min\le t)$
  - Forgetting to differentiate, or integrating the wrong weight
  hints:
    rephrase: Look at the event that the minimum exceeds $t$ instead.
    smaller_case: For a single uniform variable, what is $P(X>t)$?
    key_idea: Use the identity $\max+\min=X+Y$ together with part (i).
  check: Rational(1,3) - integrate(t*2*(1-t),(t,0,1))
  check_ok: true
- goal: Find $E|X-Y|$.
  expected: $|X-Y|=\max-\min$, so $E|X-Y|=E[\max]-E[\min]=2/3-1/3=1/3$.
  solution: 'Since $|X-Y|=\max(X,Y)-\min(X,Y)$, linearity gives $E|X-Y|=\tfrac23-\tfrac13=\tfrac13$. Cross-check:
    $2\int_0^1\int_0^x (x-y)\,dy\,dx=2\cdot\tfrac16=\tfrac13$.'
  common_errors:
  - Treating $|X-Y|$ as $X-Y$ and getting 0
  - Integrating over only one triangle and not doubling
  - Forgetting that the joint density on the unit square is 1
  hints:
    rephrase: Write the absolute value in terms of the larger and smaller of $X$ and $Y$.
    smaller_case: Fix $Y$ at a particular value and compute the expectation of $|X-Y|$ over $X$ alone.
    key_idea: Use $|X-Y|=\max-\min$, then parts (i) and (ii).
  check: Rational(1,3) - 2*integrate(integrate(x-y,(y,0,x)),(x,0,1))
  check_ok: true
- goal: Show $E[\max_i X_i]=\frac{n}{n+1}$ for $n$ independent uniforms.
  expected: $P(\max\le t)=t^n$, so $P(\max>t)=1-t^n$ and $E[\max]=\int_0^1(1-t^n)\,dt=1-\frac1{n+1}=\frac{n}{n+1}$.
  solution: By independence $P(M\le t)=t^n$ for $0\le t\le1$, where $M=\max_i X_i$. Since $M\ge0$, $E[M]=\int_0^1
    P(M>t)\,dt=\int_0^1(1-t^n)\,dt=1-\frac1{n+1}=\frac{n}{n+1}$. (Equivalently, the density is $nt^{n-1}$
    and $\int_0^1 t\cdot nt^{n-1}dt=\frac{n}{n+1}$.)
  common_errors:
  - Using $t^n$ as the expectation rather than integrating the tail or density
  - Miscomputing $\int_0^1 t^n\,dt$
  - Confusing $n$ with $n-1$ in the density $nt^{n-1}$
  hints:
    rephrase: Write the expectation as an integral of the tail probability $P(\max>t)$.
    smaller_case: Redo part (i) for $n=2$, then $n=3$, and spot the pattern for $P(\max\le t)$.
    key_idea: The CDF of the maximum factorises over the independent variables, giving $t^n$.
  check: Rational(5,6) - integrate(1-t**5,(t,0,1))
  check_ok: true
- goal: 'Explain why $\frac{n+1}{n}m$ is a sensible estimate of $\theta$: the raw maximum is biased low,
    and the factor $\frac{n+1}{n}$ makes the estimator unbiased.'
  expected: Write the serial numbers as $\theta$ times uniforms, so $M=\theta\cdot\max$ of $n$ uniforms.
    Then $E[M]=\frac{n\theta}{n+1}$, so $E[\frac{n+1}{n}M]=\theta$ and the estimator is unbiased. The
    observed maximum never exceeds $\theta$ and on average falls short by $\theta/(n+1)$; the factor corrects
    this. This is the German tank problem.
  solution: 'If $S_i$ are uniform on $[0,\theta]$ then $S_i/\theta$ are uniform on $[0,1]$, so by part
    (iv) $E[M/\theta]=\frac{n}{n+1}$, i.e. $E[M]=\frac{n\theta}{n+1}$. Hence $E\left[\frac{n+1}{n}M\right]=\theta$:
    the estimator is unbiased. The raw maximum $M\le\theta$ always, and its expected shortfall is $\theta/(n+1)$,
    so it underestimates on average; scaling up by $\frac{n+1}{n}$ removes that bias. (Unbiased means
    correct on average, not exact for any single sample.)'
  common_errors:
  - Forgetting to rescale the uniforms from $[0,1]$ to $[0,\theta]$
  - Claiming the estimate is exact rather than unbiased on average
  - Not explaining the direction of the bias of the raw maximum
  hints:
    rephrase: Think about how the maximum changes when every uniform on $[0,1]$ is multiplied by $\theta$.
    smaller_case: 'Take $n=1$: one serial number uniform on $[0,\theta]$. What is its expected value,
      and what would you guess for $\theta$?'
    key_idea: An unbiased estimator has expectation equal to the true parameter; scale the result of part
      (iv) by $\theta$ and then correct the factor.
  check: simplify(Rational(5,4)*integrate(t*4*t**3/theta**4,(t,0,theta)) - theta)
  check_ok: true
extensions:
  '3':
  - Find the density of the second-largest of $n$ independent uniforms on $[0,1]$.
  '4':
  - Explain why the German tank estimator would need adjusting if the serial numbers were the integers
    $1,\dots,N$ rather than continuous on $[0,\theta]$.
  '5':
  - Derive the variance of the estimator $\frac{n+1}{n}m$ and say how it scales with $n$.
  - 'Compare it with the estimator $2\bar{S}$ (twice the sample mean): which has smaller variance and
    why?'
