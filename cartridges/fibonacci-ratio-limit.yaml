id: fibonacci-ratio-limit
title: Limit of consecutive Fibonacci ratios
topics:
- sequences
- recurrences
- limits
- quadratics
warmup: true
answer_source: generated
statement: If the ratio of consecutive Fibonacci numbers approaches a limit what must this limit be?
stages:
- goal: Name the limit $L=\lim_{n\to\infty} F_{n+1}/F_n$ and find the equation it must satisfy.
  expected: $L$ satisfies $L^2-L-1=0$, so $L=\frac{1+\sqrt{5}}{2}$ (the positive root).
  solution: Let $F_{n+1}/F_n \to L$. Divide $F_{n+1}=F_n+F_{n-1}$ by $F_n$ to get $F_{n+1}/F_n = 1 + F_{n-1}/F_n$.
    As $n\to\infty$, $F_{n-1}/F_n \to 1/L$, so $L = 1+1/L$, i.e. $L^2-L-1=0$. The Fibonacci numbers are
    positive, so $L>0$ and $L=\frac{1+\sqrt{5}}{2}\approx 1.618$.
  common_errors:
  - Choosing the negative root $\frac{1-\sqrt{5}}{2}$, which is impossible because all Fibonacci numbers
    are positive.
  - Guessing a simple value such as 1 or 2 without deriving the equation.
  - Forgetting that $F_{n-1}/F_n$ tends to $1/L$, not to $L$.
  hints:
    rephrase: Call the limit $L$ and write the recurrence in a form that involves only ratios of consecutive
      terms.
    smaller_case: Compute a few ratios such as $F_3/F_2$, $F_4/F_3$, $F_5/F_4$ from $F_1=F_2=1$ and see
      what they seem to approach.
    key_idea: Divide the recurrence $F_{n+1}=F_n+F_{n-1}$ by $F_n$, then pass to the limit and solve the
      resulting quadratic.
  check: ((1+sqrt(5))/2)**2 - (1+sqrt(5))/2 - 1
  check_ok: true
extensions:
