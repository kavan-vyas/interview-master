id: graph-colourings-star
title: Proper colourings of a star graph
topics:
- graph theory
- colourings
- counting
- chromatic polynomial
warmup: false
answer_source: pdf
statement: Consider the graph consisting of one central vertex joined to three outer vertices. In how
  many ways can its vertices be coloured using two colours so that no two adjacent vertices have the same
  colour? What happens with three colours? With $n$ colours? Find an expression $f(n)$ for the number
  of valid colourings. Now consider a different graph obtained by adding another vertex and edge. How
  does the number of valid colourings change? Does your expression $f(n)$ work for all graphs? More generally,
  if a new vertex is added and joined to every existing vertex, how does this affect the number of colourings?
stages:
- goal: Count the proper 2-colourings of the star with one centre and three outer vertices.
  expected: '2'
  solution: 'The centre can take either of the 2 colours. Each outer vertex is adjacent only to the centre,
    so it must take the other colour, which is 1 choice each. Total: 2 x 1 x 1 x 1 = 2.'
  check: 2*(2-1)**3 - 2
  common_errors:
  - Counting 2^4 = 16 as if colours were unconstrained
  - Forgetting that the centre's colour determines the outer colours
  hints:
    rephrase: Fix the colour of the centre first, then see what each outer vertex is allowed to take.
    smaller_case: 'Start with a single edge: how many proper 2-colourings does it have?'
    key_idea: Adjacent vertices constrain each other; count the choices vertex by vertex, multiplying
      where choices are independent.
  check_ok: true
- goal: Count the proper colourings of the star using n colours and give f(n).
  expected: f(n) = n(n-1)^3
  solution: 'The centre has n choices. Each outer vertex must avoid the centre''s colour, giving n - 1
    choices. The outer vertices are not adjacent to each other, so their choices are independent. Hence
    f(n) = n(n-1)^3. Check: f(2) = 2 and f(3) = 24.'
  check: expand(n*(n-1)**3 - (n**4 - 3*n**3 + 3*n**2 - n))
  common_errors:
  - Writing n^4 instead of the product of centre and outer choices
  - Requiring the outer vertices to be different from each other
  hints:
    rephrase: Count the choices for the centre, then for each outer vertex separately.
    smaller_case: With three colours, how many choices does one outer vertex have once the centre is coloured?
    key_idea: Outer vertices are not adjacent to each other, so their choices do not interact.
  check_ok: true
- goal: Add one extra vertex and one extra edge (a pendant vertex on an outer vertex). Count the proper
    n-colourings and describe the change.
  expected: n(n-1)^4. The count is multiplied by (n-1).
  solution: The new vertex is adjacent only to one outer vertex, so it has n - 1 choices, and all previous
    colourings still extend. The count becomes n(n-1)^3 x (n-1) = n(n-1)^4. If instead the new edge joins
    two outer vertices, the count is n(n-1)^2(n-2), because the second joined vertex loses two choices.
  check: expand(n*(n-1)**4 - (n**5 - 4*n**4 + 6*n**3 - 4*n**2 + n))
  common_errors:
  - Adding the new vertex with n choices instead of n-1
  - Assuming the count is unchanged because the graph has the same centre
  hints:
    rephrase: Ask how many colours the new vertex is allowed given its single neighbour.
    smaller_case: Compare the count for a single edge (2 vertices) with that for a path of 3 vertices.
    key_idea: Each new vertex multiplies the count by the number of colours it is allowed, given its neighbours
      already coloured.
  check_ok: true
- goal: Decide whether f(n) = n(n-1)^3 works for all graphs, and state what does govern the count.
  expected: No. The formula depends on the graph's structure. A tree on m vertices has n(n-1)^(m-1) proper
    colourings, while a triangle has n(n-1)(n-2), which is not of that form.
  solution: The argument for the star used the fact that the outer vertices are only adjacent to the centre.
    For a general graph, the count depends on which pairs are adjacent. A tree on m vertices can be built
    one vertex at a time, each new vertex having exactly one coloured neighbour, giving n(n-1)^(m-1).
    A triangle has three mutually adjacent vertices, giving n(n-1)(n-2). So f depends on the graph, and
    general counting uses the chromatic polynomial.
  common_errors:
  - Assuming the star formula is universal
  - Confusing the number of vertices with the number of edges in the count
  hints:
    rephrase: Does your counting argument use anything special about the star's shape?
    smaller_case: Count the proper colourings of a single edge and of a triangle with n colours.
    key_idea: Build the graph one vertex at a time and check how many constraints each new vertex faces.
- goal: Add a new vertex joined to every existing vertex of the star. Count the proper k-colourings.
  expected: k(k-1)(k-2)^3. With 2 colours this is 0.
  solution: 'The new vertex v is adjacent to the centre and all three outer vertices, so it must differ
    from all of them. Choose the centre in k ways. Choose v in k - 1 ways (it differs from the centre).
    Each outer vertex is adjacent to both the centre and v but not to each other, so each has k - 2 choices.
    Total: k(k-1)(k-2)^3. With k = 2 the factor (k-2) is 0, since the graph contains a triangle (centre,
    v, outer vertex) and triangles cannot be 2-coloured.'
  check: expand(k*(k-1)*(k-2)**3 - (k**5 - 7*k**4 + 18*k**3 - 20*k**2 + 8*k))
  common_errors:
  - Multiplying only by k - 1 and forgetting that v is adjacent to the outer vertices
  - Letting outer vertices be constrained by each other
  hints:
    rephrase: List every pair of vertices that are now adjacent, then count each vertex's choices given
      the ones before it.
    smaller_case: Set k = 3 and count the choices for each vertex in turn.
    key_idea: A vertex adjacent to every other vertex must have a colour no other vertex uses, which creates
      triangles.
  check_ok: true
extensions:
  '3':
  - Find the chromatic polynomial of the triangle K_3.
  '4':
  - Count the proper n-colourings of the 4-cycle C_4 and show the result equals (n-1)^4 + (n-1).
  '5':
  - Count the proper n-colourings of the complete graph K_n.
