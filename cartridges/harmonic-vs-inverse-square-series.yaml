id: harmonic-vs-inverse-square-series
title: Convergence of the harmonic series and the inverse-square series by integral comparison
topics:
- series
- convergence and divergence
- integral test
- comparison with integrals
- improper integrals
warmup: false
answer_source: generated
statement: Is the series $1+\dfrac{1}{2}+\dfrac{1}{3}+\dfrac{1}{4}+\cdots$ divergent? How about the series
  $1+\dfrac{1}{4}+\dfrac{1}{9}+\dfrac{1}{16}+\cdots$? Sketch on separate axes $y=\dfrac{1}{x}$ and $y=\dfrac{1}{x^2}$,
  considering your sketches and by using integration justify your claims.
stages:
- goal: Decide whether $\sum_{n=1}^\infty \frac{1}{n}$ diverges by comparing its partial sums with an
    integral.
  expected: The series diverges. For each $n\ge1$, $\frac{1}{n}\ge\int_n^{n+1}\frac{dx}{x}$, so $\sum_{n=1}^{N}\frac{1}{n}\ge\int_1^{N+1}\frac{dx}{x}=\ln(N+1)\to\infty$.
  solution: On $[n,n+1]$ the function $1/x$ is at most $1/n$, so the area under $y=1/x$ over that interval
    is at most the height $1/n$ times width 1 is incorrect as a direction; the correct inequality is that
    $1/x\le 1/n$ on $[n,n+1]$, so $\int_n^{n+1}\frac{dx}{x}\le \frac{1}{n}$. Summing from $n=1$ to $N$
    gives $\sum_{n=1}^{N}\frac{1}{n}\ge\int_1^{N+1}\frac{dx}{x}=\ln(N+1)$. As $N\to\infty$, $\ln(N+1)\to\infty$,
    so the partial sums are unbounded and the series diverges.
  common_errors:
  - Comparing with the wrong interval, for example using $\int_{n-1}^{n}$ and getting a bound that does
    not show divergence.
  - Claiming that because terms tend to zero the series must converge.
  - Stating the integral of $1/x$ incorrectly as $1/x^2$ or failing to see that it is unbounded.
  hints:
    rephrase: Each term is the height of a rectangle of width 1. Compare the sum with an area under $y=1/x$.
    smaller_case: Compare $1+\frac12+\frac13$ with $\int_1^4 \frac{dx}{x}$ and see which is larger.
    key_idea: 'Integral comparison: on each interval $[n,n+1]$, $1/x$ is bounded above by $1/n$, so the
      sum is bounded below by an integral that grows without limit.'
  check: sp.simplify(sp.integrate(1/x,(x,1,n+1))-sp.log(n+1))
  check_ok: null
- goal: Decide whether $\sum_{n=1}^\infty \frac{1}{n^2}$ converges by a similar integral argument.
  expected: The series converges. For $n\ge 2$, $\frac{1}{n^2}\le\int_{n-1}^{n}\frac{dx}{x^2}$, so $\sum_{n=2}^{N}\frac{1}{n^2}\le\int_1^{N}\frac{dx}{x^2}=1-\frac{1}{N}<1$.
    The partial sums are increasing and bounded above by 2, so they converge.
  solution: For $x\in[n-1,n]$ we have $x\le n$, so $\frac{1}{x^2}\ge\frac{1}{n^2}$. Integrating over $[n-1,n]$
    gives $\frac{1}{n^2}\le\int_{n-1}^{n}\frac{dx}{x^2}$. Summing from $n=2$ to $N$ gives $\sum_{n=2}^{N}\frac{1}{n^2}\le\int_1^N\frac{dx}{x^2}=1-\frac{1}{N}<1$.
    Adding the first term 1 gives partial sums bounded by 2. The partial sums are increasing and bounded,
    so the series converges.
  common_errors:
  - Using the bound on the wrong interval, such as $[n,n+1]$, which gives a lower bound and does not prove
    convergence.
  - Forgetting to include the first term $1$ when bounding the sum.
  - Concluding convergence from a bound on a single term rather than on the partial sums.
  hints:
    rephrase: For convergence you need an upper bound on the partial sums. Which interval gives $1/n^2$
      as a lower bound for $1/x^2$?
    smaller_case: Compare $\frac{1}{2^2}+\frac{1}{3^2}$ with $\int_1^3 \frac{dx}{x^2}$.
    key_idea: A bounded increasing sequence of partial sums converges, and an integral of a decreasing
      function over $[n-1,n]$ bounds the term $f(n)$ from above.
  check: sp.simplify(sp.integrate(1/x**2,(x,1,n))-(1-1/n))
  check_ok: null
- goal: Interpret the two sketches and explain the different behaviour using areas under the curves.
  expected: The area under $y=1/x$ on $[1,\infty)$ is infinite, so the harmonic series diverges. The area
    under $y=1/x^2$ on $[1,\infty)$ is $1$, so the series $\sum 1/n^2$ converges. In each case the term
    $f(n)$ is the height of a unit-width rectangle that sits under (or over) the curve, so the sum is
    controlled by the area.
  solution: On separate axes, $y=1/x$ decreases slowly and its area over $[1,\infty)$ is unbounded, because
    $\int_1^{\infty}\frac{dx}{x}=\lim_{M\to\infty}\ln M=\infty$. The curve $y=1/x^2$ drops much faster,
    and $\int_1^{\infty}\frac{dx}{x^2}=1$. The rectangles of unit width and height $f(n)$ fit under the
    curve on the right of each interval, so the sum of rectangles is at least the area (for $1/n$ the
    rectangles lie below the curve on $[n,n+1]$). For $1/n^2$ the rectangles lie above the curve on $[n-1,n]$
    and their total is bounded by the area.
  common_errors:
  - Saying the graphs look similar, so the series should behave similarly, without comparing areas.
  - Stating $\int_1^\infty \frac{dx}{x^2}$ diverges, which is false.
  - Describing the rectangle positions wrongly, so that the bounds do not match the claims.
  hints:
    rephrase: Describe the total area under each curve from $x=1$ to infinity. Is it finite?
    smaller_case: Compare the areas under $y=1/x$ and $y=1/x^2$ over $[1,2]$.
    key_idea: The sum of a decreasing positive function over the integers is controlled by the improper
      integral, so finite area implies convergence and infinite area implies divergence.
  check: sp.simplify(sp.integrate(1/x**2,(x,1,sp.oo))-1)
  check_ok: null
extensions:
  '3':
  - Show that $\sum_{n=1}^N \frac{1}{n}-\ln N$ is bounded, and deduce that the limit exists.
  - Estimate the sum $\sum_{n=1}^{100}\frac{1}{n^2}$ using the integral bounds from stage 2.
  '4':
  - Test $\sum_{n=2}^\infty \frac{1}{n\ln n}$ for convergence using the integral test.
  - Show that $\sum_{n=2}^\infty \frac{1}{n^p}$ converges for $p>1$ using an integral bound.
  '5':
  - Determine for which real $p$ the series $\sum_{n=1}^\infty \frac{1}{n^p}$ converges, and justify the
    boundary case $p=1$ rigorously.
