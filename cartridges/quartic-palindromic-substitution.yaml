id: quartic-palindromic-substitution
title: Solve a palindromic quartic
topics:
- algebra
- polynomials
- substitution
- quadratic equations
warmup: true
answer_source: pdf
statement: Solve $x^4-10x^3+26x^2-10x+1=0$.
stages:
- goal: Reduce the quartic to a quadratic in a suitable substitution variable t.
  expected: Dividing by $x^2$ and setting $t=x+\frac{1}{x}$ gives $t^2-10t+24=0$.
  solution: 'Divide by $x^2$: $x^2+\frac{1}{x^2}-10\left(x+\frac{1}{x}\right)+26=0$. Since $\left(x+\frac{1}{x}\right)^2=x^2+\frac{1}{x^2}+2$,
    we have $x^2+\frac{1}{x^2}=t^2-2$. Substituting gives $t^2-2-10t+26=0$, i.e. $t^2-10t+24=0$.'
  common_errors:
  - Forgetting the $+2$ when rewriting $x^2+\frac{1}{x^2}$ in terms of $t$, which gives the wrong constant
    term.
  - Dividing by $x$ instead of $x^2$, so the terms do not group into $t$.
  - Substituting $t=x+1$ or some other non-reciprocal expression.
  hints:
    rephrase: The polynomial reads the same forwards and backwards. Look for a substitution that absorbs
      the symmetric pairs of terms.
    smaller_case: Try the same idea on a simpler reciprocal expression such as $x^2+\frac{1}{x^2}$ and
      see what it equals in terms of $x+\frac{1}{x}$.
    key_idea: Divide by the middle power of $x$ and use the identity relating $\left(x+\frac{1}{x}\right)^2$
      to $x^2+\frac{1}{x^2}$.
  check: sp.simplify((x**4-10*x**3+26*x**2-10*x+1)/x**2 - ((x+1/x)**2 - 10*(x+1/x) + 24))
  check_ok: null
- goal: Solve the quadratic in t, then solve the resulting quadratics in x and give all real roots.
  expected: $t=4$ or $t=6$, giving $x\in\{2+\sqrt{3},\ 2-\sqrt{3},\ 3+2\sqrt{2},\ 3-2\sqrt{2}\}$.
  solution: 'From $t^2-10t+24=(t-4)(t-6)=0$, $t=4$ or $t=6$. For $t=4$: $x^2-4x+1=0$, so $x=2\pm\sqrt{3}$.
    For $t=6$: $x^2-6x+1=0$, so $x=3\pm2\sqrt{2}$. Equivalently, $x^4-10x^3+26x^2-10x+1=(x^2-4x+1)(x^2-6x+1)$.'
  common_errors:
  - Solving $x+\frac{1}{x}=t$ as $x=t\pm\sqrt{t^2-1}$ with a sign or arithmetic slip.
  - Listing only one root from each pair, or missing the $t=6$ case.
  - Writing $\sqrt{12}$ or $\sqrt{8}$ without simplifying to $2\sqrt{3}$ or $2\sqrt{2}$.
  hints:
    rephrase: Each value of t gives a quadratic in x. Solve each one and collect all the roots.
    smaller_case: Take one value of t, for example the smaller one, and write the quadratic it gives in
      x. Solve that alone first.
    key_idea: A quadratic $x^2-sx+1=0$ has roots whose sum is $s$ and product is $1$, so the roots come
      in reciprocal pairs.
  check: sp.simplify((x-(2+sp.sqrt(3)))*(x-(2-sp.sqrt(3)))*(x-(3+2*sp.sqrt(2)))*(x-(3-2*sp.sqrt(2))) -
    (x**4-10*x**3+26*x**2-10*x+1))
  check_ok: null
extensions:
  '3':
  - Find all real solutions of $x^6-9x^5+\ldots$ if the polynomial is known to be palindromic of degree
    6 and you have a reciprocal substitution available.
  - Explain why a palindromic quartic always has roots that come in reciprocal pairs.
  '4':
  - 'Generalise: for $x^4+ax^3+bx^2+ax+1=0$, express the quadratic in $t$ in terms of $a$ and $b$.'
  - Show that the sum of the four roots of a palindromic quartic can be read off from its coefficients,
    and find it for this quartic.
  '5':
  - Prove that every root of a palindromic polynomial with real coefficients that has no root at $0$ pairs
    with its reciprocal, and use this to bound the number of real roots.
