id: harry-calculating-horse
title: 'Harry the calculating horse: random hoof placement'
topics:
- probability
- geometry of areas
- expected value
- statistical reasoning
warmup: false
answer_source: pdf
statement: Harry the Calculating Horse answers any problem whose answer is $1$, $2$, $3$ or $4$. For each
  problem he places a circular hoof of radius $1/4$ on a large grid of unit squares, and his answer is
  the number of squares the hoof partly covers. Show that the observed frequencies, namely a correct answer
  of $4/4$ about $1/4$ of the time and a correct answer of $2+2$ about $\pi/16$ of the time, are consistent
  with random placement. If Harry places his hoof at random, find the expected value of his answer when
  the true answers $1,2,3,4$ occur equally often. His average answer over many problems is $2$. Should
  you get a new horse?
stages:
- goal: Find the probability that the hoof covers exactly one square, and the probability that it covers
    exactly four squares, under random placement.
  expected: $P(\text{1 square}) = \tfrac14$ and $P(\text{4 squares}) = \tfrac{\pi}{16}$.
  solution: Only the position of the hoof's centre within a unit cell matters, since the grid is periodic.
    The disc of radius $r=1/4$ covers only one square exactly when its centre is at distance at least
    $r$ from every grid line, i.e. it lies in the central square of side $1-2r = 1/2$, area $1/4$. It
    covers four squares exactly when the centre is within distance $r$ of a grid corner, in a quarter-disc
    of area $\pi r^2/4$ at each corner. Four corners give total area $\pi r^2 = \pi/16$.
  common_errors:
  - Using the full disc area $\pi r^2$ rather than the area of the set of valid centre positions.
  - Forgetting that the centre position is uniform over a single unit cell.
  - Confusing the quarter-disc at each corner with a full disc.
  hints:
    rephrase: Where can the centre sit so that the disc crosses no grid line at all?
    smaller_case: What would happen if the radius were 1/2 instead of 1/4? Which region of centres would
      be left?
    key_idea: The number of squares covered depends only on the centre's position relative to the grid
      lines and corners.
  check: (1-2*Rational(1,4))**2 - Rational(1,4)
  check_ok: null
- goal: Find the probabilities that the hoof covers exactly two squares and exactly three squares.
  expected: $P(\text{2 squares}) = \tfrac12$ and $P(\text{3 squares}) = \tfrac14 - \tfrac{\pi}{16}$.
  solution: 'The centre is within distance $r$ of exactly one grid line, but not near a corner. There
    are four such strips, each of area $r(1-2r) = 1/8$, so the total is $1/2$. A centre in a corner cell
    but outside the quarter-disc covers three squares. Each corner region has area $r^2 - \pi r^2/4$,
    so the total is $4r^2 - \pi r^2 = 1/4 - \pi/16$. Check: $1/4 + 1/2 + (1/4 - \pi/16) + \pi/16 = 1$.'
  common_errors:
  - Counting the corner region as two squares rather than three.
  - Getting the total for three squares wrong by forgetting the four corners.
  - Not checking that the four probabilities sum to 1.
  hints:
    rephrase: Sort the centre positions by how many grid lines they lie close to.
    smaller_case: Look at a single corner of the unit cell. Which points give three squares and which
      give four?
    key_idea: Split the cell into regions by distance to the grid lines, then use the fact that the probabilities
      sum to 1.
  check: 4*Rational(1,4)*(1-2*Rational(1,4)) - Rational(1,2)
  check_ok: null
- goal: Find the expected value of Harry's answer under random placement.
  expected: $E = 2 + \dfrac{\pi}{16} \approx 2.196$.
  solution: Using the probabilities from the previous stages, $E = 1\cdot\tfrac14 + 2\cdot\tfrac12 + 3\left(\tfrac14-\tfrac{\pi}{16}\right)
    + 4\cdot\tfrac{\pi}{16} = \tfrac14 + 1 + \tfrac34 - \tfrac{3\pi}{16} + \tfrac{4\pi}{16} = 2 + \tfrac{\pi}{16}$.
  common_errors:
  - Using the probabilities for the wrong number of squares.
  - Writing the answer as $2.5$, which is the expectation for a horse who is always right.
  - Arithmetic slips with the $\pi/16$ term.
  hints:
    rephrase: Write the expected value as a weighted sum of the square counts with the probabilities from
      the previous stages.
    smaller_case: If the hoof always covered exactly one square, what would the expected value be?
    key_idea: The expected value is linear in the probabilities, so combine the terms directly.
  check: 1*Rational(1,4) + 2*Rational(1,2) + 3*(Rational(1,4) - pi/16) + 4*pi/16 - (2 + pi/16)
  check_ok: null
- goal: Decide whether Harry should be replaced, given that his average is 2 over many problems.
  expected: Yes, with a sample-size caveat. A correct horse would average $5/2$, and random placement
    averages $2+\pi/16 \approx 2.196$. An observed average of $2$ is below the random benchmark and far
    below the correct one. The per-answer standard deviation is about $1.02$, so the standard error is
    about $1.02/\sqrt n$ over $n$ problems. The result is decisive for large $n$, for example a gap of
    about two standard errors at $n \approx 100$.
  solution: Under random placement, each answer has mean $\mu = 2+\pi/16 \approx 2.196$ and second moment
    $E[X^2] = \tfrac14 + 2 + \tfrac94 - \tfrac{9\pi}{16} + \pi = \tfrac92 + \tfrac{7\pi}{16}$, so the
    variance is about $1.05$ and the standard deviation about $1.02$. The observed average of $2$ is below
    the random-placement mean and well below the $5/2$ of a correct horse. So the data suggest Harry is
    not computing, and the case for replacing him strengthens with more problems. The sample size must
    be stated to quantify the evidence.
  common_errors:
  - Declaring Harry hopeless from a small sample without considering sampling error.
  - Comparing the observed average only with $5/2$ and ignoring the random benchmark.
  - Concluding that the data prove random placement rather than only showing it is consistent.
  hints:
    rephrase: Compare the observed average with two benchmarks, and think about how much an average over
      n problems can vary.
    smaller_case: If Harry always answered 1, what would his average be, and how far would that be from
      2?
    key_idea: Use the random-placement mean as a benchmark and account for sampling error through the
      standard deviation.
  check: null
extensions:
  '3':
  - For hoof radius 1/2, show that the hoof always covers at least two squares and find the probability
    of answer 1.
  - Show that the probabilities for answers 1 and 4 must be unequal for any hoof radius, and explain why.
  '4':
  - Recompute the four probabilities for hoof radius 1/3.
  - Find how the expected value under random placement changes with the hoof radius.
  '5':
  - Generalise to a hoof radius r with r at most 1/2 and state the expected value as a function of r.
