id: two-dice-parity-score-rule
title: Two Dice with a Parity-Based Scoring Rule
topics:
- probability
- sample space
- counting outcomes
- dice
warmup: true
answer_source: pdf
statement: 'Two fair standard dice are thrown. If they both show an even number, or both an odd number,
  you add these to get the score. If one shows an even number and one shows an odd number, you subtract
  the smaller number from the larger one to get the score. Which of the following statements is correct?
  Options: a) 7 is the most likely score. b) Scoring 3 is more likely than scoring 6. c) You can score
  9. d) Scoring 5 is more likely than scoring 4. e) Scoring 1 and scoring 11 are equally likely.'
stages:
- goal: Find the number of outcomes that give a score of 3 and the number that give a score of 6, out
    of 36.
  expected: 'Score 3: 6 outcomes, so $P=\frac{1}{6}$. Score 6: 5 outcomes, so $P=\frac{5}{36}$.'
  solution: 'Same parity (both odd or both even) gives sums. Sum 6 arises from (1,5), (5,1), (3,3), (2,4),
    (4,2), (6,6)? No: (6,6) gives 12; the correct list for sum 6 from same parity is (1,5), (5,1), (3,3),
    (2,4), (4,2), total 5. Different parity gives differences. Difference 3 arises from (1,4), (4,1),
    (3,6), (6,3), (5,2), (2,5), total 6. So 3 occurs 6 times and 6 occurs 5 times out of 36.'
  common_errors:
  - Forgetting that the ordered pairs (a,b) and (b,a) are different outcomes.
  - Adding the two dice when they have different parity, or subtracting when they match parity.
  - Missing the pairs (3,3) or (2,4) when counting sums of 6.
  hints:
    rephrase: Split the 36 outcomes into those where both dice have the same parity and those where they
      differ. Count each group separately.
    smaller_case: How many ways can two dice both be odd? How many ways can one be odd and the other even?
    key_idea: Count ordered pairs. Each outcome is a pair (first die, second die), and the scoring rule
      depends on parity.
  check: Rational(6,36) - Rational(1,6)
  check_ok: true
- goal: Decide which statement is correct.
  expected: 'Option b: scoring 3 is more likely than scoring 6'
  solution: Scoring 3 has probability $\frac{6}{36}$ and scoring 6 has probability $\frac{5}{36}$, so
    $\frac{6}{36} > \frac{5}{36}$. Option a is false because 7 cannot be scored at all. Option c is false
    because 9 cannot be scored (sums of same-parity dice are even, and differences of different-parity
    dice are odd and at most 5). Option d is false because 5 has probability $\frac{2}{36}$ and 4 has
    probability $\frac{3}{36}$. Option e is false because 11 cannot be scored while 1 can.
  common_errors:
  - Choosing option a because 7 looks like the natural most likely sum for two dice, without applying
    the scoring rule.
  - Believing 9 is possible from a difference, since the largest difference is 5.
  - Miscounting score 5 and score 4 so that option d appears true.
  hints:
    rephrase: Work through each statement one at a time. For each, ask whether that score can actually
      occur and, if so, how many outcomes give it.
    smaller_case: Can you get a score of 11 at all? What is the largest possible difference between two
      dice?
    key_idea: Each statement compares counts of outcomes, so count outcomes for each score rather than
      relying on the usual two-dice sum distribution.
  check: Rational(6,36) > Rational(5,36)
  check_ok: true
extensions:
  '3':
  - What is the probability that the score is even?
  - What is the most likely score under this rule, and how many outcomes give it?
  '4':
  - Find the probability that the score is at least 8.
  - Show that the probability of a score of 1 is greater than the probability of a score of 5 under this
    rule.
  '5':
  - Find the expected score under the parity-based rule and compare it with the expected score for two
    standard dice added together.
