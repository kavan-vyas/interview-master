id: chain-recurrence-guess-x-n
title: 'Chain of fractions: guess and prove x_n'
topics:
- sequences
- induction
- recurrence relations
- algebraic manipulation
warmup: false
answer_source: generated
statement: Suppose that $3 = \frac{2}{x_1} = \frac{x_1 + 2}{x_2} = \frac{x_2 + 2}{x_3} = \frac{x_3 + 2}{x_4}
  = \cdots$. Guess an expression, in terms of $n$, for $x_n$. Then, by induction or otherwise, prove the
  correctness of your guess.
stages:
- goal: Find x_1, x_2 and x_3 from the chain and guess a formula for x_n.
  expected: x_1 = 2/3, x_2 = 8/9, x_3 = 26/27, and the guess x_n = 1 - 3^(-n).
  solution: 'From 3 = 2/x_1, x_1 = 2/3. Each later equality gives (x_n + 2)/x_{n+1} = 3, so x_{n+1} =
    (x_n + 2)/3. Then x_2 = (8/3)/3 = 8/9 and x_3 = (26/9)/3 = 26/27. These match x_n = 1 - 3^(-n). Note:
    the PDF source answer x_n = (2^(n+1) - 2)/(2^(n+1) - 1) gives x_2 = 6/7, which does not satisfy the
    stated chain (the chain forces x_2 = 8/9), so it is not used here.'
  common_errors:
  - Reading the chain as x_{n+1} = 2/... or mixing up which fraction defines which term
  - Using the PDF formula, which contradicts the chain as written
  - Guessing from too few terms without checking the recurrence
  hints:
    rephrase: The first equality gives x_1. Each later equality gives the next term from the previous
      one.
    smaller_case: Use 3 = 2/x_1 to find x_1, then use 3 = (x_1 + 2)/x_2 to find x_2.
    key_idea: Each step gives x_{n+1} = (x_n + 2)/3. Look at how 1 - x_n changes from term to term.
  check: (1-Rational(1,3)-Rational(2,3))+(1-Rational(1,9)-Rational(8,9))+(1-Rational(1,27)-Rational(26,27))
  check_ok: true
- goal: Prove the guess x_n = 1 - 3^(-n) by induction.
  expected: Base case n = 1 gives x_1 = 2/3. If x_k = 1 - 3^(-k), then x_{k+1} = (x_k + 2)/3 = 1 - 3^(-(k+1)).
  solution: 'Base case: x_1 = 2/3 = 1 - 1/3. Inductive step: assume x_k = 1 - 3^(-k). Then x_{k+1} = (x_k
    + 2)/3 = (3 - 3^(-k))/3 = 1 - 3^(-(k+1)). By induction the formula holds for all n >= 1.'
  common_errors:
  - Dividing incorrectly when solving for x_{k+1}
  - Forgetting to check the base case
  - Not simplifying 3^(-k)/3 to 3^(-(k+1))
  hints:
    rephrase: Assume the formula for x_k and substitute it into x_{k+1} = (x_k + 2)/3.
    smaller_case: Check the formula directly when n = 1.
    key_idea: After substituting, write everything with the same power of 3 and simplify the exponent.
  check: simplify(((1-3**(-k))+2)/3-(1-3**(-(k+1))))
  check_ok: true
extensions:
  '3':
  - Find x_n when the chain starts with 2 = 2/x_1 and the same pattern of +2 continues.
  - Explain why the fixed point x = 1 of the map x -> (x + 2)/3 controls the behaviour of x_n.
  '4':
  - Find a closed form for x_n when the 3 in the chain is replaced by a general constant c > 1.
  - Show that x_n approaches 1 as n tends to infinity.
  '5':
  - Analyse the general recurrence x_{n+1} = (x_n + a)/c and state when x_n converges.
  - Discuss the difference between proving a formula by induction and deriving it from a fixed-point argument.
