id: smallest-twelve-factors
title: Smallest number with exactly twelve factors
topics:
- number theory
- divisors
- prime factorisation
warmup: true
answer_source: pdf
statement: What is the smallest positive whole number which has exactly 12 factors (including 1 and the
  number itself)?
stages:
- goal: Find the smallest positive whole number with exactly 12 factors.
  expected: '60'
  solution: '60 = 2^2 * 3 * 5 has (2+1)(1+1)(1+1) = 12 factors: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30,
    60. No smaller number has 12 factors.'
  common_errors:
  - Answering 12, which has only 6 factors (1, 2, 3, 4, 6, 12).
  - Answering 24 or 36 without checking they have the right count, or stopping at the first number that
    looks highly composite.
  hints:
    rephrase: Look for the smallest number whose factor list has exactly twelve entries.
    smaller_case: How many factors does 12 have? How many does 8 have?
    key_idea: 'Use the prime factorisation: if n = p^a * q^b * ..., the number of factors is (a+1)(b+1)...'
  check: min(n for n in range(1,1000) if divisor_count(n)==12) - 60
  check_ok: null
- goal: Justify that no smaller number has 12 factors by listing the ways to get 12 from (exponent+1)
    products.
  expected: 12 = 12, 6*2, 4*3, 3*2*2. These give exponent patterns (11), (5,1), (3,2), (2,1,1), whose
    smallest numbers are 2^11 = 2048, 2^5*3 = 96, 2^3*3^2 = 72, 2^2*3*5 = 60. The minimum is 60.
  solution: Each factor count pattern assigns exponents to primes. Assigning the largest exponents to
    the smallest primes gives the smallest number for each pattern. The four patterns give 2048, 96, 72
    and 60, so the minimum is 60.
  common_errors:
  - Forgetting one of the factorisation patterns, such as (2,1,1), which is the one that gives the minimum.
  - Assigning larger exponents to larger primes, which makes the numbers too big.
  hints:
    rephrase: Write 12 as a product of whole numbers each at least 2. What exponent patterns does that
      suggest?
    smaller_case: 'Try the same method for 6 factors: which patterns give 6 = 6, 3*2?'
    key_idea: Each prime's exponent plus one multiplies into the total factor count, and the smallest
      number puts the largest exponents on the smallest primes.
  check: min(2**11, 2**5*3, 2**3*3**2, 2**2*3*5) - 60
  check_ok: true
extensions:
