id: rod-against-wall-centre-of-mass-friction
title: Non-uniform rod against a rough wall and floor
topics:
- statics
- centre of mass
- limiting friction
- integration
warmup: false
answer_source: pdf
statement: A rigid straight rod $AB$ has length $l$ and weight $W$. Its weight per unit length at a distance
  $x$ from $B$ is $\alpha W l^{-1}(x/l)^{\alpha -1}$, where $\alpha$ is a constant greater than 1. Show
  that the centre of mass of the rod is at a distance $\alpha l/(\alpha + 1)$ from $B$. The rod is placed
  with the end $A$ on a rough horizontal floor and the end $B$ resting against a rough vertical wall.
  The rod is in a vertical plane at right angles to the plane of the wall and makes an angle of $\theta$
  with the floor. The coefficient of friction between the floor and the rod is $\mu$, and the coefficient
  of friction between the wall and the rod is also $\mu$. Show that, if the equilibrium is limiting at
  both $A$ and $B$, then $\tan\theta = \frac{1 - \alpha\mu^2}{(1 + \alpha)\mu}$. Given that $\alpha =
  3/2$ and given also that the rod slides for any $\theta < \pi/4$, find the greatest possible value of
  $\mu$.
stages:
- goal: Show that the centre of mass is at a distance alpha l/(alpha+1) from B.
  expected: Total mass is W (the density integrates to W). The first moment about B divided by W gives
    a distance of alpha l/(alpha+1) from B.
  solution: 'Mass: integral from 0 to l of alpha W l^(-alpha) x^(alpha-1) dx = W. Moment about B: integral
    from 0 to l of alpha W l^(-alpha) x^alpha dx = alpha W l/(alpha+1). Dividing the moment by the mass
    gives xbar = alpha l/(alpha+1), measured from B. Since alpha>1 this lies nearer A, where the rod is
    heavier.'
  common_errors:
  - Measuring the distance from A instead of from B.
  - Forgetting to divide the first moment by the total mass.
  - Using x^(alpha-1) instead of x^alpha in the moment integrand.
  hints:
    rephrase: Where is the average position of the mass, when each small piece of the rod contributes
      according to the density at its position?
    smaller_case: Test your method on a uniform rod (alpha=1). What must the centre of mass be?
    key_idea: The centre of mass is the first moment divided by the total mass, and both are integrals
      of the density.
  check: simplify(integrate(x*alpha*(x/l)**(alpha-1)/l, (x,0,l))/integrate(alpha*(x/l)**(alpha-1)/l, (x,0,l))
    - alpha*l/(alpha+1))
  check_ok: false
- goal: Resolve forces and apply limiting friction at both contacts to find R_A, R_B, F_A and F_B in terms
    of W and mu.
  expected: R_A = W/(mu^2+1), R_B = mu W/(mu^2+1), F_A = mu W/(mu^2+1), F_B = mu^2 W/(mu^2+1).
  solution: 'Let the floor reaction at A be R_A upward and the friction at A be F_A towards the wall.
    Let the wall reaction at B be R_B away from the wall and the friction at B be F_B upward, opposing
    the slide of B down the wall. Vertical balance: R_A + F_B = W. Horizontal balance: R_B = F_A. Limiting
    friction: F_A = mu R_A and F_B = mu R_B. Hence R_B = mu R_A and F_B = mu^2 R_A, so R_A(1+mu^2) = W.'
  common_errors:
  - Taking the friction at B as horizontal.
  - Reversing the direction of friction at A (it must oppose the outward slide of A).
  - Pairing mu with the wrong reaction in a limiting friction law.
  hints:
    rephrase: For each contact, which way does the friction act to oppose slipping?
    smaller_case: Set mu=0 and decide what each reaction must be.
    key_idea: Vertical balance, horizontal balance and the two limiting friction laws give four equations
      for four unknowns.
  check: simplify(W/(mu**2+1) + mu**2*W/(mu**2+1) - W)
  check_ok: true
- goal: Take moments to obtain tan(theta) in terms of alpha and mu.
  expected: tan(theta) = (1 - alpha mu^2)/((1+alpha) mu).
  solution: Take moments about A so that R_A and F_A give no moment. The weight W acts at distance l -
    alpha l/(alpha+1) = l/(alpha+1) from A along the rod, giving moment W l cos(theta)/(alpha+1) horizontally.
    The moment of F_B about A is F_B l cos(theta) and the moment of R_B about A is R_B l sin(theta). So
    W l cos(theta)/(alpha+1) = l cos(theta) F_B + l sin(theta) R_B. Substituting F_B and R_B from the
    previous stage and dividing by W gives cos(theta)(1 - alpha mu^2) = (1+alpha) mu sin(theta).
  common_errors:
  - Using alpha l/(alpha+1) as the distance of G from A instead of from B.
  - Using the wrong lever arm for F_B, such as l sin(theta) instead of l cos(theta).
  - Sign errors in the moment equation.
  hints:
    rephrase: Choose a point through which the two reactions at A pass, so that they give no moment.
    smaller_case: For a uniform rod (alpha=1) the centre of mass is at l/2 from B. Check that your moment
      equation gives the correct centre of mass position.
    key_idea: Moments about A remove R_A and F_A, leaving only the weight, F_B and R_B.
  check: simplify(tan(theta) - (1 - alpha*mu**2)/((1 + alpha)*mu))
  check_ok: false
- goal: With alpha = 3/2, find the greatest mu such that the rod slides for every theta < pi/4.
  expected: mu = 1/3.
  solution: With alpha = 3/2, tan(theta_0) = (2 - 3mu^2)/(5mu), where theta_0 is the limiting angle. A
    larger angle needs less friction, so the rod is in equilibrium for theta >= theta_0 and slides for
    theta < theta_0. Sliding for all theta < pi/4 requires theta_0 >= pi/4, i.e. tan(theta_0) >= 1. This
    gives 3mu^2 + 5mu - 2 <= 0, i.e. (3mu - 1)(mu + 2) <= 0. Since mu > 0, the greatest value is mu =
    1/3.
  common_errors:
  - Reversing the inequality, so that the answer comes out as a lower bound.
  - Forgetting that mu must be positive when factorising.
  - Arithmetic errors in substituting alpha = 3/2 into the formula.
  hints:
    rephrase: Which angles can the rod rest at without slipping, and how does that depend on the friction
      coefficient?
    smaller_case: Consider a very small mu. Does the rod slide at theta = pi/4?
    key_idea: The limiting angle from the previous stage separates the sliding and equilibrium ranges.
      Compare its tangent with 1.
  check: simplify((3*mu**2 + 5*mu - 2).subs(mu, Rational(1,3)))
  check_ok: true
extensions:
  '3':
  - Repeat the derivation for a uniform rod (alpha=1). Does your result match the familiar result for
    a uniform rod leaning against a wall?
  '4':
  - For general alpha, find the limiting angle theta_0 when mu = 1/2.
  '5':
  - For general alpha>1, find the greatest mu for which the rod slides for every theta < pi/4. Give your
    answer in surd form.
