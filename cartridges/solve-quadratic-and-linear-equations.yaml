id: solve-quadratic-and-linear-equations
title: Solving a quadratic and a linear equation with fractions
topics:
- quadratic equations
- factorising
- linear equations
- algebraic fractions
warmup: true
answer_source: pdf
statement: Solve (a) $2x^2 - 5x - 3 = 0$; (b) $\frac{x+1}{3} - \frac{x-2}{4} = 2$.
stages:
- goal: 'Part (a): solve $2x^2 - 5x - 3 = 0$.'
  expected: x = 3 or x = -1/2
  solution: 'Factorise: (2x + 1)(x − 3) = 2x² − 6x + x − 3 = 2x² − 5x − 3, so (2x + 1)(x − 3) = 0. Hence
    x = 3 or x = −1/2.'
  common_errors:
  - Dropping the leading coefficient 2 and factorising as (x + a)(x + b) with the wrong signs.
  - Sign error when solving 2x + 1 = 0, giving x = 1/2.
  - Stopping after finding one root.
  hints:
    rephrase: You need the values of x that make the quadratic equal zero. Try writing the quadratic as
      a product of two brackets.
    smaller_case: Try factorising x^2 - 2x - 3 = 0 first, where the leading coefficient is 1.
    key_idea: With a leading coefficient other than 1, the factors of the leading term and of the constant
      term both need to be considered, and the middle term must check out when the brackets are expanded.
  check: expand(2*(x-3)*(x+Rational(1,2)) - (2*x**2-5*x-3))
  check_ok: true
- goal: 'Part (b): solve $\frac{x+1}{3} - \frac{x-2}{4} = 2$.'
  expected: x = 14
  solution: 'Multiply every term by 12: 4(x + 1) − 3(x − 2) = 24. Expand: 4x + 4 − 3x + 6 = 24, so x +
    10 = 24, giving x = 14.'
  common_errors:
  - Not multiplying the constant 2 by 12, giving 4(x + 1) − 3(x − 2) = 2.
  - Losing the minus sign when expanding −3(x − 2) (writing −3x − 6).
  - Multiplying only some terms by the common denominator.
  hints:
    rephrase: Clear the fractions by multiplying both sides by a common denominator. Remember that the
      right-hand side also gets multiplied.
    smaller_case: What is the lowest common multiple of 3 and 4?
    key_idea: After clearing fractions, expand each bracket carefully, paying close attention to the sign
      in front of the second bracket.
  check: ((x+1)/Rational(3) - (x-2)/Rational(4) - 2).subs(x, 14)
  check_ok: true
extensions:
  '3':
  - Solve $3x^2 + 4x - 4 = 0$.
  '4':
  - Solve $\frac{x-1}{2} + \frac{x+3}{5} = 4$.
  '5':
  - Solve $x^4 - 13x^2 + 36 = 0$.
spoken_vocab:
- two x squared minus five x minus three equals zero
- x equals three or x equals minus a half
- open bracket
- close bracket
- over
- fraction
- x plus one over three minus x minus two over four equals two
- multiply by twelve
- lowest common multiple
- x equals fourteen
