warmup: false
answer_source: generated
statement: 'Sketch the graphs of: (a) $y = \frac{x + \sin x}{x - \sin x}$ (b) $y = \cos(x + |x|)$, $-2\pi
  < x < 2\pi$ (c) $y = \sqrt{x^3 - x}$ (d) $y^2 = x^3 - x$ (e) $y = \frac{x^4 - 7x^2 + 12}{x^4 - 4x^2
  + 4}$ (f) $y = \frac{x^2 + 1}{x^2 - 1}$.'
stages:
- goal: For each part, find the domain, the parity, and the key intercepts.
  expected: (a) Domain x != 0; even function. (b) Defined everywhere; for -2pi < x < 0 it equals 1; for
    0 <= x < 2pi it equals cos(2x). (c) Domain -1 <= x <= 0 or x >= 1; no symmetry. (d) Same domain as
    (c); symmetric about the x-axis. (e) Domain x != +/- sqrt(2); even; y-intercept 3; x-intercepts at
    x = +/- sqrt(3) and +/- 2. (f) Domain x != +/- 1; even; y-intercept -1; no x-intercepts.
  solution: '(a) x - sin x is zero only at x = 0 because |sin x| < |x| for x != 0. Numerator and denominator
    are both odd, so y(-x) = y(x). (b) For x < 0, x + |x| = 0 so y = cos 0 = 1. For x >= 0, x + |x| =
    2x so y = cos(2x). The two pieces agree at x = 0 with value 1. (c) x^3 - x = x(x-1)(x+1) must be nonnegative.
    Sign analysis: negative for x < -1, positive on (-1,0), negative on (0,1), positive for x > 1. So
    the domain is [-1,0] union [1,infinity). Neither x-to-(-x) nor y-to-(-y) gives a symmetry of y = sqrt(x^3-x).
    (d) y^2 = x^3 - x has the same domain, and replacing y by -y leaves the equation unchanged, so the
    curve is symmetric about the x-axis. (e) Numerator = (x^2-3)(x^2-4), denominator = (x^2-2)^2. Both
    are even in x, so y is even. At x = 0, y = 12/4 = 3. (f) Domain x != +/-1, even, and y(0) = -1; the
    numerator x^2+1 is never zero so there are no x-intercepts.'
  common_errors:
  - Claiming (a) is odd or (e) has no symmetry.
  - Giving (b) a single formula, forgetting the piecewise split at x = 0.
  - Using x^3 - x >= 0 only on [-1,1] instead of the correct union.
  - Missing the x-axis symmetry of the implicit curve (d).
  hints:
    rephrase: For each part, write the expression with x replaced by -x and compare. Then ask where the
      denominator or the radicand is zero or negative.
    smaller_case: For (b), evaluate x + |x| at x = 1 and at x = -1 separately.
    key_idea: Parity tests f(-x) against f(x). Domains come from non-zero denominators and non-negative
      radicands. Factor the polynomials.
  check: sp.simplify(x**3 - x - x*(x-1)*(x+1))
  check_ok: null
- goal: Find the asymptotes and the limiting behaviour of each part.
  expected: (a) y tends to +infinity as x tends to 0 from both sides (y is about 12/x^2), so x = 0 is
    a vertical asymptote; y tends to 1 as |x| tends to infinity. (b) No asymptotes; y = 1 on (-2pi, 0];
    y = cos(2x) on [0, 2pi). (c) y is about x^(3/2) as x tends to infinity; no horizontal asymptote. (d)
    |y| is about x^(3/2) as x tends to infinity; the curve has an oval on [-1,0] and an unbounded branch
    for x >= 1. (e) y tends to 1 as |x| tends to infinity; vertical asymptotes at x = +sqrt(2) and x =
    -sqrt(2), where y tends to +infinity from both sides. (f) y tends to 1 as |x| tends to infinity; as
    x tends to -1 from the left y tends to +infinity, and as x tends to -1 from the right y tends to -infinity;
    as x tends to 1 from the left y tends to -infinity, and as x tends to 1 from the right y tends to
    +infinity.
  solution: (a) For small x, sin x is about x - x^3/6, so x + sin x is about 2x and x - sin x is about
    x^3/6, so y is about 12/x^2 from both sides. For large |x|, dividing top and bottom by x gives (1
    + sin(x)/x)/(1 - sin(x)/x) which tends to 1. (b) Constant on the negative side and cos(2x) on the
    positive side, so there are no asymptotes. (c) For large x, sqrt(x^3 - x) is about x^(3/2). (d) For
    large x, the branches satisfy |y| = sqrt(x^3 - x) about x^(3/2), so they grow without bound. (e) Dividing
    top and bottom by x^4 gives a limit of 1. The denominator (x^2-2)^2 vanishes only at x = +/- sqrt(2),
    where the numerator equals (2-3)(2-4) = 2 > 0, so y tends to +infinity on both sides. (f) Dividing
    gives y = 1 + 2/(x^2-1). The denominator tends to 0 with sign determined by the side of x = +/-1,
    giving the one-sided behaviour above.
  common_errors:
  - Assigning a horizontal asymptote to (c) or (d).
  - Getting the sign of the one-sided limits wrong in (f).
  - Claiming (e) has a vertical asymptote at x = 2 or x = 0 instead of x = +/- sqrt(2).
  hints:
    rephrase: Ask where the denominator is zero, and then what the numerator does there and how the denominator
      changes sign.
    smaller_case: For (f), test x = 1.01 and x = 0.99 in x^2 - 1.
    key_idea: Divide numerator and denominator by the highest power of x for large |x|. Look at sign changes
      of the denominator at its zeros.
- goal: Use key algebraic identities to fix the position of each curve relative to its asymptotes, and
    find where the derivative of (c) becomes infinite.
  expected: (a) y - 1 = 2 sin(x)/(x - sin x). For x > 0 this has the sign of sin x, so the curve crosses
    y = 1 at x = n*pi for nonzero integers n and oscillates about y = 1 with amplitude roughly 2/|x|.
    (e) y - 1 = (8 - 3x^2)/(x^2-2)^2, so y > 1 for |x| < sqrt(8/3) and y < 1 for |x| > sqrt(8/3). (f)
    y = 1 + 2/(x^2-1), so y <= -1 on (-1,1) and y > 1 for |x| > 1. (c) y' = (3x^2 - 1)/(2 sqrt(x^3 - x));
    the derivative is infinite at x = -1 (from the right), x = 0 (from the left) and x = 1 (from the right),
    giving vertical tangents there.
  solution: '(a) (x+sin x) - (x - sin x) = 2 sin x, so y - 1 = 2 sin x/(x - sin x). For x > 0 the denominator
    is positive, so sign(y-1) = sign(sin x). The curve crosses y = 1 at x = n*pi, n nonzero. By evenness
    the same holds for x < 0. (e) Subtract: (x^4 - 7x^2 + 12) - (x^4 - 4x^2 + 4) = 8 - 3x^2. (f) (x^2+1)
    = (x^2-1) + 2 gives y = 1 + 2/(x^2-1). For |x| < 1 the denominator is in (-1,0), so 2/(x^2-1) < -2
    and y < -1. For |x| > 1 the value 2/(x^2-1) is positive, so y > 1. (c) Differentiating sqrt(x^3 -
    x) gives (3x^2 - 1)/(2 sqrt(x^3 - x)). Where the radicand is zero, the derivative blows up if 3x^2
    - 1 != 0, which holds at x = -1, 0, 1.'
  common_errors:
  - Concluding that the curve in (a) stays on one side of y = 1.
  - Solving 8 - 3x^2 = 0 incorrectly, e.g. as x = sqrt(8) or x = 2.
  - Forgetting the vertical tangents of (c) at the endpoints of the domain.
  - Thinking the derivative of (c) is finite at x = 0.
  hints:
    rephrase: Subtract the asymptote value from each expression and look at what remains.
    smaller_case: For (e), substitute x^2 = 1 and x^2 = 4 into 8 - 3x^2 and compare the signs.
    key_idea: Write y minus its limit as one fraction. For (c), differentiate with the chain rule and
      see where the denominator vanishes.
  check: sp.simplify((x+sp.sin(x))/(x-sp.sin(x)) - 1 - 2*sp.sin(x)/(x-sp.sin(x)))
  check_ok: null
- goal: Find the turning points, the zeros and the special points on each curve.
  expected: '(a) The curve crosses its asymptote y = 1 at x = n*pi for nonzero integers n. (b) On [0,
    2pi): maxima at x = 0 and x = pi (value 1); minima at x = pi/2 and x = 3pi/2 (value -1); zeros at
    pi/4, 3pi/4, 5pi/4, 7pi/4. (c) Turning point of the radicand at x = -1/sqrt(3), with y = sqrt(2/(3*sqrt(3)))
    about 0.62 on the oval; zeros at x = -1, 0, 1. (d) Oval top and bottom at x = -1/sqrt(3), with y =
    +/- sqrt(2/(3*sqrt(3))); no horizontal tangents on the unbounded branch. (e) Local minimum y = 3 at
    x = 0; local minimum y = -1/8 at x = +/- sqrt(10/3). (f) Local maximum y = -1 at x = 0.'
  solution: (b) For x in [0, 2pi), cos(2x) has period pi. It takes value 1 at 0 and pi, value -1 at pi/2
    and 3pi/2, and value 0 at the quarter-points. (c) Let g(x) = x^3 - x. Then g'(x) = 3x^2 - 1 vanishes
    at x = -1/sqrt(3), which lies in (-1,0). Here g = x(x^2-1) = (-1/sqrt(3))(-2/3) = 2/(3 sqrt(3)), so
    y = sqrt(2/(3 sqrt(3))). (d) Implicit differentiation gives y' = (3x^2-1)/(2y), which is zero only
    when 3x^2 = 1; the value x = 1/sqrt(3) lies outside the domain, so only the oval has a horizontal
    tangent. (e) Let u = x^2. Then y = (u-3)(u-4)/(u-2)^2 has derivative proportional to (u-2)(3u-10)/(u-2)^4
    in u. The critical point u = 10/3 gives y = (-2/9)/(16/9) = -1/8. At u = 0, y = 3 and y increases
    in u on [0,2), so x = 0 is a local minimum. (f) y' = -4x/(x^2-1)^2 is zero only at x = 0, where y
    = -1; y' > 0 for x < 0 and < 0 for x > 0, so this is a local maximum.
  common_errors:
  - Listing sin's turning points for (b) as the zeros.
  - Using x = 1/sqrt(3) for the oval top in (c) or (d), which is outside the domain.
  - Missing that (e) has two local minima of different types.
  - Choosing the wrong sign for y in (f).
  hints:
    rephrase: For each part, set the derivative or the defining expression to zero and see which solutions
      lie in the domain.
    smaller_case: For (f), check whether y increases or decreases at x = -0.5 and at x = 0.5.
    key_idea: Differentiate and find where the derivative vanishes. For implicit curves, use the implicit
      derivative and check the domain.
  check: sp.simplify(sp.diff((x**2+1)/(x**2-1),x) + 4*x/(x**2-1)**2)
  check_ok: null
- goal: Check the extremal values of (c) and (e) and confirm the shape of the sketch.
  expected: (c) The maximum of y on the oval is sqrt(2/(3*sqrt(3))), attained at x = -1/sqrt(3). (e) The
    value of y at x = sqrt(10/3) is -1/8, so the local minimum is -1/8. The shape of (b) is flat at y
    = 1 for x <= 0, then two full periods of cos(2x) on [0, 2pi), not including the endpoint.
  solution: '(c) Use the value of x^3 - x computed in the previous stage: at x = -1/sqrt(3), x^3 - x =
    2/(3 sqrt(3)) which is positive, so the square root is real. (e) Substituting x^2 = 10/3 into the
    numerator gives (100/9 - 70/3 + 12) = -2/9, and the denominator is (10/3 - 2)^2 = 16/9, so the value
    is -1/8. For (b) the interval is open, so the endpoint values at x = -2pi and x = 2pi are not plotted.'
  common_errors:
  - Forgetting that (b) is open at both ends.
  - Substituting x^2 = 10/3 into the denominator as (10/3)^2 instead of (10/3 - 2)^2.
  - Mixing up which half of the interval in (b) has y = 1.
  hints:
    rephrase: Substitute the given value of x into the defining formula and simplify step by step.
    smaller_case: Compute the numerator and denominator of (e) at x^2 = 4 first, as a check of your arithmetic
      method.
    key_idea: Substitution gives values. Recheck the domain and open or closed endpoints before you draw.
  check: sp.simplify(((x**4-7*x**2+12)/(x**4-4*x**2+4)).subs(x, sp.sqrt(sp.Rational(10,3))) + sp.Rational(1,8))
  check_ok: null
extensions:
  '3':
  - For (a), prove that y - 1 has the same sign as sin(x) for x > 0, and deduce that the curve crosses
    its asymptote infinitely often.
  '4':
  - For (c), find the area enclosed by the oval of y^2 = x^3 - x on [-1,0] as an integral and evaluate
    it.
  '5':
  - For (e), find all real k for which the equation (x^4 - 7x^2 + 12)/(x^4 - 4x^2 + 4) = k has exactly
    four real solutions in x.
