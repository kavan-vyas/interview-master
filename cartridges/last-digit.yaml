statement: What is the last digit of $7^{2026}$?
stages:
- goal: Find the cycle of last digits of powers of 7
  expected: '7, 9, 3, 1, then repeats: period 4'
  solution: 7^1..7^4 end in 7, 9, 3, 1; 7^4 = 2401 ≡ 1 mod 10.
  common_errors:
  - computing 7^3 = 343 wrongly
  - assuming period 10
  hints:
    rephrase: You don't need the whole number. Which part matters?
    smaller_case: What are the last digits of 7, 49, 343?
    key_idea: Only the last digit of each product matters, so look for a repeat.
- goal: Use the cycle to finish
  expected: 2026 = 4*506 + 2, so last digit is 9
  solution: '2026 mod 4 = 2, so 7^2026 ends like 7^2 = 49: digit 9.'
  common_errors:
  - using 2026 mod 10
  - off-by-one in the cycle position
  hints:
    rephrase: Where in the cycle does the 2026th power land?
    smaller_case: What is the last digit of 7^6?
    key_idea: Reduce the exponent modulo the cycle length.
  check: Mod(7**2026, 10) - 9
extensions:
