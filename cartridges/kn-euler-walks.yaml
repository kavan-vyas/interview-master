id: kn-euler-walks
title: Euler Walks in Complete Graphs
topics:
- Euler circuits
- Euler trails
- degree parity
- handshaking lemma
warmup: true
answer_source: pdf
statement: The complete graph $K_n$ has $n$ vertices, each pair joined by an edge. For which $n$ can you
  trace every edge exactly once in a single closed route returning to your start? For which $n$ is this
  possible if you need not return?
stages:
- goal: Find the degree of each vertex of $K_n$.
  expected: Each vertex has degree $n-1$.
  solution: Each vertex is joined by an edge to each of the other $n-1$ vertices, and to no others.
  common_errors:
  - Using $n$ instead of $n-1$
  - Counting total edges instead of edges at one vertex
  hints:
    rephrase: How many edges meet a single vertex?
    smaller_case: In $K_4$, pick one vertex and count its neighbours.
    key_idea: Degree counts neighbours, and a vertex is not its own neighbour.
  check: (4 - 1) - 3
  check_ok: true
- goal: Decide for which $n$ a closed route using every edge exactly once exists.
  expected: Exactly when $n$ is odd.
  solution: A closed route enters and leaves each vertex in pairs, so every vertex must have even degree.
    Since each degree is $n-1$, we need $n-1$ even, so $n$ is odd. Conversely, if $n$ is odd then all
    degrees are even and $K_n$ is connected, so an Euler circuit exists by Euler's theorem. (For $n=1$
    there are no edges, a trivial case.)
  common_errors:
  - Forgetting the connectivity requirement in the converse
  - Confusing an Euler circuit with a Hamiltonian cycle
  hints:
    rephrase: Each time the route passes through a vertex, how many of that vertex's edges does it use?
    smaller_case: Check $K_3$ and $K_4$ by hand. Which one can you trace as a closed route?
    key_idea: Each visit to a vertex uses two of its edges, one in and one out.
  check: Mod(5 - 1, 2)
  check_ok: true
- goal: Decide for which $n$ an open route using every edge exactly once exists.
  expected: Exactly when $n$ is odd or $n=2$.
  solution: An open route can have at most two vertices of odd degree, its endpoints. If $n$ is even and
    $n\ge4$, all $n$ vertices have odd degree $n-1$, which is more than two, so no open route exists.
    If $n=2$, $K_2$ is a single edge, which can be traced from one end to the other. If $n$ is odd, the
    closed route from the previous stage is also an open route. So an open route exists exactly when $n$
    is odd or $n=2$.
  common_errors:
  - Forgetting the case $n=2$
  - Saying that an open route needs all degrees even
  hints:
    rephrase: How many odd-degree vertices can an open route leave behind?
    smaller_case: Compare $K_2$, which has two vertices of degree 1, with $K_4$, which has four vertices
      of degree 3.
    key_idea: Only the two endpoints of an open route can have odd degree.
extensions:
  '3':
  - For which odd $n$ can $K_n$ be decomposed into edge-disjoint Hamiltonian cycles?
  '4':
  - For even $n\ge4$, explain why at least $n/2$ open routes are needed to cover every edge of $K_n$.
  '5':
  - For even $n\ge4$, find the minimum number of edges to delete from $K_n$ so that the remaining graph
    has an Euler circuit.
