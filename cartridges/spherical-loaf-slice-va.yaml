id: spherical-loaf-slice-va
title: 'Spherical loaf: surface area and volume after a slice'
topics:
- volumes of revolution
- surface area of revolution
- calculus
- inequalities
warmup: false
answer_source: pdf
statement: A spherical loaf of radius $a$ metres is sliced evenly from one end. A cut is made at distance
  $t$ from the end $x=a$, so the remaining piece is the cap of the sphere between $x=a-t$ and $x=a$. Find
  the curved surface area $A$ and the remaining volume $V$ of this piece in terms of $a$ and $t$. Hence
  find the condition on $a$ for which $V/A<1$ for every $t$ with $0<t\le 2a$.
stages:
- goal: Show that the curved surface area of the remaining cap is $A=2\pi a t$.
  expected: A = 2 pi a t
  solution: Rotate y = sqrt(a^2 - x^2) about the x-axis for a - t <= x <= a. Then dy/dx = -x/y, so ds
    = sqrt(1 + x^2/y^2) dx = (a/y) dx. Hence A = integral of 2 pi y ds = integral from a-t to a of 2 pi
    a dx = 2 pi a t.
  common_errors:
  - Omitting the factor 2 pi in the surface-of-revolution integral
  - Using ds = dx instead of the arc-length element
  - Adding the flat cut face when the question asks for the curved crust
  hints:
    rephrase: The curved surface is generated by rotating an arc of the circle; you need the surface-of-revolution
      formula, which involves the arc-length element ds.
    smaller_case: 'Consider the whole sphere (t = 2a): what curved surface area should the formula give?'
    key_idea: 'Surface of revolution: A = integral of 2 pi y ds. Simplify y ds using the circle equation
      x^2 + y^2 = a^2.'
  check: sp.simplify(sp.sqrt(1+sp.diff(sp.sqrt(a**2-x**2),x)**2)*sp.sqrt(a**2-x**2) - a)
  check_ok: null
- goal: Show that the remaining volume is $V=\pi(at^2-t^3/3)$.
  expected: V = pi (a t^2 - t^3/3)
  solution: 'Use discs: the cross-section at x is a circle of radius sqrt(a^2 - x^2). V = integral from
    a-t to a of pi (a^2 - x^2) dx = pi [a^2 x - x^3/3] evaluated from a-t to a = pi (a t^2 - t^3/3).'
  common_errors:
  - Integrating from 0 to t instead of from a-t to a
  - Sign or power error in the antiderivative of x^2
  - Dropping the factor pi
  hints:
    rephrase: Write the area of a disc cross-section as a function of x, then identify the limits of integration
      for the remaining cap.
    smaller_case: With t = 2a the whole sphere remains. Check that your formula gives the known sphere
      volume.
    key_idea: 'Disc method: the cross-section at position x is a circle whose radius satisfies r^2 = a^2
      - x^2.'
  check: sp.simplify(sp.integrate(sp.pi*(a**2-x**2),(x,a-t,a)) - sp.pi*(a*t**2 - t**3/3))
  check_ok: null
- goal: Find V/A as a function of t, its maximum over 0<t<=2a, and the condition on a for which V/A<1
    for every such t.
  expected: V/A = (3at - t^2)/(6a); maximum 3a/8 at t = 3a/2; V/A<1 for all t exactly when a < 8/3.
  solution: V/A = pi(a t^2 - t^3/3) / (2 pi a t) = (3at - t^2)/(6a). This is a downward-opening quadratic
    in t. Its stationary point has (3a - 2t)/(6a) = 0, so t = 3a/2, which lies in (0, 2a]. There V/A =
    (9a^2/2 - 9a^2/4)/(6a) = 3a/8. Since 3a/8 is the maximum, V/A < 1 for all t iff 3a/8 < 1, i.e. a <
    8/3.
  common_errors:
  - Taking the maximum at the endpoint t = 2a
  - Treating the stationary point of a downward parabola as a minimum
  - Confusing the maximum value 3a/8 with the bound on a
  hints:
    rephrase: Divide your two results and simplify. Then treat the resulting expression as a function
      of t and study its turning points.
    smaller_case: Take a = 1 and compare V/A at t = 1 and t = 2 numerically to see how the ratio behaves.
    key_idea: The ratio is a quadratic in t; find its turning point and decide whether it is a maximum
      or minimum.
  check: sp.simplify(((3*a*t - t**2)/(6*a)).subs(t, 3*a/2) - 3*a/8)
  check_ok: null
extensions:
  '3':
  - If the flat cut face is included in the surface area, find the new expression for V/A and the condition
    on a for V/A<1 for every t.
  '4':
  - For the whole loaf (t = 2a), compute V and A directly and check the ratio against the formula from
    the main question.
  '5':
  - Show that a cap of height h in a sphere of radius a has volume pi h^2 (3a - h)/3, and explain how
    this matches the remaining-volume result.
