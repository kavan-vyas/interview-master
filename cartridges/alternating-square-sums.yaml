id: alternating-square-sums
title: Alternating sums of consecutive squares
topics:
- sums
- difference of squares
- pairing
- closed forms
warmup: true
answer_source: generated
statement: Simplify $1^2-2^2+3^2-4^2+\cdots+(2n-1)^2-(2n)^2$. Find $21^2-22^2+23^2-24^2+\cdots+39^2-40^2$.
stages:
- goal: Simplify 1^2 - 2^2 + 3^2 - 4^2 + ... + (2n-1)^2 - (2n)^2 in closed form.
  expected: -n(2n+1), which equals -2n^2 - n.
  solution: 'Group the terms in pairs: (2k-1)^2 - (2k)^2 = (2k-1-2k)(2k-1+2k) = -(4k-1). Summing for k
    = 1 to n gives -(4 * n(n+1)/2 - n) = -(2n^2 + 2n - n) = -(2n^2 + n) = -n(2n+1). Checks: n=1 gives
    1-4 = -3, and n=2 gives 1-4+9-16 = -10.'
  common_errors:
  - Dropping the minus sign on the even-squared terms
  - Miscounting the number of pairs (there are n pairs, not 2n)
  - Summing 4k-1 incorrectly, e.g. forgetting to subtract n
  hints:
    rephrase: Group the terms in consecutive pairs and simplify each pair using a standard identity.
    smaller_case: Evaluate the sum for n = 1 and n = 2 and look for a pattern.
    key_idea: Each pair is a difference of two squares, so factorise it.
  check: simplify(summation((2*k-1)**2-(2*k)**2,(k,1,n)) + n*(2*n+1))
  check_ok: true
- goal: Evaluate 21^2 - 22^2 + 23^2 - 24^2 + ... + 39^2 - 40^2.
  expected: '-610'
  solution: 'The terms from 21 to 40 are the pairs for k = 11 to 20, so there are 10 pairs. Using the
    formula with n = 20 gives -20 * 41 = -820, which covers all terms up to 40^2. Using n = 10 gives -10
    * 21 = -210, which covers all terms up to 20^2. The required sum is -820 - (-210) = -610. Check: the
    pair sum for k = 11 to 20 is -(4*155 - 10) = -610.'
  common_errors:
  - Using n = 20 alone without subtracting the earlier block
  - Miscounting the pairs as 9 or 11
  - Losing the minus sign at the end
  hints:
    rephrase: Can you write this block as the difference of two sums that both start at 1?
    smaller_case: Which values of k do the first pair 21^2 - 22^2 and the last pair 39^2 - 40^2 correspond
      to?
    key_idea: Apply your formula from the first part with two different values of n, then subtract.
  check: Sum((2*k-1)**2-(2*k)**2,(k,11,20)).doit() + 610
  check_ok: true
