id: ln2-series-rearrangement
title: Alternating harmonic series and a rearrangement giving half ln 2
topics:
- geometric series
- integration
- alternating harmonic series
- squeeze bounds
- rearrangement of series
- conditional convergence
warmup: false
answer_source: pdf
statement: '(i) Show that $\frac{1}{1+x}=\sum_{k=0}^{n-1}(-x)^k+\frac{(-x)^n}{1+x}$ for $x\ne -1$.


  (ii) By integrating from $0$ to $1$, show that $\ln 2=\sum_{k=1}^{n}\frac{(-1)^{k+1}}{k}+(-1)^nR_n$,
  where $R_n=\int_0^1\frac{x^n}{1+x}\,dx$.


  (iii) Show that $\frac{1}{2(n+1)}\le R_n\le\frac{1}{n+1}$. Deduce that $1-\frac12+\frac13-\frac14+\cdots=\ln
  2$.


  (iv) Show that the rearranged series $1-\frac12-\frac14+\frac13-\frac16-\frac18+\frac15-\frac1{10}-\frac1{12}+\cdots$
  (one odd-denominator term followed by two even-denominator terms) has sum $\frac12\ln 2$.'
stages:
- goal: Prove the finite geometric identity for $\frac{1}{1+x}$.
  expected: $\sum_{k=0}^{n-1}(-x)^k=\frac{1-(-x)^n}{1+x}$, so adding $\frac{(-x)^n}{1+x}$ gives $\frac{1}{1+x}$.
  solution: With $r=-x$ (so $r\ne1$ since $x\ne-1$), $\sum_{k=0}^{n-1}r^k=\frac{1-r^n}{1-r}=\frac{1-(-x)^n}{1+x}$.
    Adding $\frac{(-x)^n}{1+x}$ gives $\frac{1-(-x)^n+(-x)^n}{1+x}=\frac{1}{1+x}$.
  common_errors:
  - Using $1-r=1-x$ instead of $1+x$
  - Sign error in $r=-x$, e.g. writing $(-x)^n$ as $-x^n$ for all $n$
  - Forgetting the condition $x\ne-1$ is exactly $r\ne1$
  hints:
    rephrase: Treat the sum as a geometric series and identify its ratio.
    smaller_case: 'Try $n=1$: what does the right-hand side simplify to?'
    key_idea: The finite geometric sum formula holds for any ratio $r\ne1$; what is $1-r$ here?
  check: Sum((-2)**k,(k,0,2)).doit() + (-2)**3/(1+2) - Rational(1,3)
  check_ok: true
- goal: Integrate the identity from 0 to 1 to get the formula for $\ln2$ with remainder $R_n$.
  expected: $\ln2=\sum_{k=1}^n\frac{(-1)^{k+1}}{k}+(-1)^nR_n$.
  solution: Integrate both sides over $[0,1]$. The left side gives $\ln 2$. Each term gives $\int_0^1(-x)^k\,dx=\frac{(-1)^k}{k+1}$,
    and reindexing $j=k+1$ turns $\sum_{k=0}^{n-1}\frac{(-1)^k}{k+1}$ into $\sum_{j=1}^n\frac{(-1)^{j-1}}{j}=\sum_{j=1}^n\frac{(-1)^{j+1}}{j}$.
    The last term gives $(-1)^n\int_0^1\frac{x^n}{1+x}\,dx=(-1)^nR_n$.
  common_errors:
  - Off-by-one error when reindexing the sum
  - Losing the sign $(-1)^n$ on $R_n$
  - Integrating $\frac{1}{1+x}$ and getting $\ln x$ or $\ln(1-x)$
  hints:
    rephrase: Integrate each term of the identity from part (i) over $[0,1]$.
    smaller_case: For $n=2$, what are $\int_0^1\frac{1}{1+x}\,dx$ and the integrals of the two power terms?
    key_idea: The integral of $\frac{1}{1+x}$ over $[0,1]$ is $\ln 2$; each power term integrates separately,
      then shift the index so the denominator is $k$.
  check: Sum((-1)**(k+1)/k,(k,1,2)).doit() + Integral(x**2/(1+x),(x,0,1)).doit() - log(2)
  check_ok: true
- goal: Bound $R_n$ and deduce the sum of the alternating harmonic series.
  expected: $\frac{1}{2(n+1)}\le R_n\le\frac{1}{n+1}$, so $R_n\to0$ by squeezing, and the partial sums
    tend to $\ln2$, i.e. $1-\frac12+\frac13-\cdots=\ln2$.
  solution: On $[0,1]$, $1\le1+x\le2$, so $\frac12x^n\le\frac{x^n}{1+x}\le x^n$. Integrating over $[0,1]$
    gives $\frac{1}{2(n+1)}\le R_n\le\frac{1}{n+1}$. Hence $R_n\to0$ by squeezing. By (ii) the partial
    sum is $S_n=\ln2-(-1)^nR_n$, so $|S_n-\ln2|=R_n\to0$ and the series converges to $\ln2$.
  common_errors:
  - Getting the inequality direction wrong when bounding $\frac{1}{1+x}$ between $\frac12$ and $1$
  - Concluding $R_n\to0$ without a squeeze argument
  - Forgetting that the partial sum differs from $\ln2$ by $\pm R_n$, so $R_n\to0$ is what is needed
  hints:
    rephrase: Bound $\frac{1}{1+x}$ between two constants on $[0,1]$, then multiply by $x^n$ and integrate.
    smaller_case: Check the bound at $n=1$ by computing $R_1=\int_0^1\frac{x}{1+x}\,dx$ directly.
    key_idea: Squeeze the integrand between two multiples of $x^n$; then relate $R_n$ to the error in
      the partial sums.
  check: And(Rational(1,4)<=1-log(2), 1-log(2)<=Rational(1,2))
  check_ok: true
- goal: Show that the rearranged series, grouped in threes, sums to $\frac12\ln2$.
  expected: The $k$th group is $\frac{1}{2k-1}-\frac{1}{2(2k-1)}-\frac{1}{4k}=\frac12\left(\frac{1}{2k-1}-\frac{1}{2k}\right)$,
    so the sum of the first $N$ groups is half the $2N$th partial sum of the alternating harmonic series,
    which tends to $\frac12\ln2$. Rearranging changed the sum.
  solution: The $k$th group is $\frac{1}{2k-1}-\frac{1}{2(2k-1)}-\frac{1}{4k}=\frac{1}{2(2k-1)}-\frac{1}{4k}=\frac12\left(\frac{1}{2k-1}-\frac{1}{2k}\right)$.
    Summing over $k=1,\dots,N$ gives $\frac12S_{2N}$, where $S_m$ is the $m$th partial sum of the alternating
    harmonic series, and $\frac12S_{2N}\to\frac12\ln2$ by (iii). Partial sums in the middle of a group
    differ from a group-end partial sum by at most one term, which tends to $0$, so the full series converges
    to $\frac12\ln2$. The original series is only conditionally convergent, so rearranging it changed
    its sum from $\ln2$ to $\frac12\ln2$.
  common_errors:
  - Miscounting the terms in each group of three (one odd, two even denominators)
  - Algebra slip in combining $\frac{1}{2k-1}$ and $\frac{1}{2(2k-1)}$
  - Claiming the sum is unchanged because the terms are the same
  - Ignoring partial sums that stop mid-group
  hints:
    rephrase: Group the terms in threes and simplify each group.
    smaller_case: Simplify the first group $1-\frac12-\frac14$, then the second group $\frac13-\frac16-\frac18$,
      and compare each with a difference of two consecutive reciprocals.
    key_idea: Each group reduces to a multiple of $\frac{1}{2k-1}-\frac{1}{2k}$, so the grouped sum is
      a scaled partial sum of a series you already know.
  check: Rational(1,3)-Rational(1,6)-Rational(1,8)-Rational(1,2)*(Rational(1,3)-Rational(1,4))
  check_ok: true
extensions:
  '3':
  - Show that the partial sums satisfy $S_{2N}\le\ln2\le S_{2N+1}$, so they bracket $\ln2$.
  - Why does the argument in (iii) fail if we try to integrate $\frac{1}{1+x}$ over $[0,2]$ in the same
    way?
  '4':
  - Rearrange the alternating harmonic series so that two odd-denominator terms are followed by one even-denominator
    term, and find the sum.
  - Why must the sum of the rearranged series in (iv) differ from $\ln2$? Which hypothesis of absolute
    convergence fails?
  '5':
  - Explain why a rearrangement of a conditionally convergent series can be made to converge to any real
    number (Riemann rearrangement theorem).
  - For the pattern of $p$ odd-denominator terms followed by $q$ even-denominator terms, conjecture the
    sum in terms of $p$ and $q$.
