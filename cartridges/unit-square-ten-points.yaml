id: unit-square-ten-points
title: Ten points in a unit square
topics:
- pigeonhole principle
- geometry
- distances
warmup: false
answer_source: generated
statement: 10 distinct points lie within a unit square, prove at least two of the points lie within $\frac{\sqrt{2}}{3}$
  units of each other.
stages:
- goal: Partition the unit square into boxes suitable for the pigeonhole principle.
  expected: Divide the unit square into a $3\times 3$ grid of nine congruent closed squares of side $\frac{1}{3}$.
  solution: Cutting the unit square into a $3\times 3$ grid gives nine squares of side $\frac{1}{3}$,
    which cover the original square.
  common_errors:
  - Using a grid with fewer than 9 boxes, which does not force a pair.
  - Using a grid whose boxes are too large, so the diameter bound is too weak.
  - Forgetting that the boxes must cover the whole square.
  hints:
    rephrase: Cut the square into equal smaller squares. How many do you need?
    smaller_case: With only 5 points in a unit square, into how many equal pieces would you cut it to
      guarantee two points share a piece?
    key_idea: 'Use the pigeonhole principle: find a number of boxes smaller than the number of points,
      and bound each box''s diameter.'
  check: 9*(Rational(1,3))**2-1
  check_ok: true
- goal: Compute the largest possible distance between two points lying in the same small square.
  expected: The diagonal of a square of side $\frac{1}{3}$ has length $\frac{\sqrt{2}}{3}$, so any two
    points in one small square are at distance at most $\frac{\sqrt{2}}{3}$.
  solution: The diameter of a square is its diagonal. For side $\frac{1}{3}$ the diagonal is $\frac{1}{3}\sqrt{2}=\frac{\sqrt{2}}{3}$,
    and no two points in the square are farther apart than this.
  common_errors:
  - Using the side length $\frac{1}{3}$ as the distance bound instead of the diagonal.
  - Miscomputing the diagonal as $\frac{2}{3}$.
  - Using the inscribed circle diameter instead of the diagonal.
  hints:
    rephrase: What is the longest straight-line distance between two points inside a square of side $\frac{1}{3}$?
    smaller_case: Take a square of side 1 and find the longest distance between two points inside it.
    key_idea: The largest distance inside a square is attained between opposite corners, which is its
      diagonal.
  check: sqrt(2)/3-Rational(1,3)*sqrt(2)
  check_ok: true
- goal: Conclude that two of the ten points are within $\frac{\sqrt{2}}{3}$ of each other.
  expected: Ten points placed in nine squares means by pigeonhole some small square contains at least
    two points. Those two are at distance at most $\frac{\sqrt{2}}{3}$.
  solution: By pigeonhole, $10>9$ implies some square contains at least two of the points. Since any two
    points in a square of side $\frac{1}{3}$ are at most $\frac{\sqrt{2}}{3}$ apart, the claim follows.
  common_errors:
  - Forgetting to say which box the two points are in.
  - Claiming the points are at distance strictly less without justification.
  - Assuming the squares must be disjoint, which is not needed.
  hints:
    rephrase: You have more points than boxes. What must happen?
    smaller_case: With 5 points and 4 boxes, what must happen? Why is this the same idea?
    key_idea: Combine the pigeonhole principle with the bound on distance within one box.
  check: 10-9-1
  check_ok: true
extensions:
  '3':
  - Show that any 5 points in a unit square have two within $\frac{\sqrt{2}}{2}$ of each other.
  '4':
