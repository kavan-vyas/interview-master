id: party-handshakes-pigeonhole
title: Handshake Pigeonhole
topics:
- pigeonhole principle
- graph degrees
- extremal argument
warmup: true
answer_source: pdf
statement: At a party with $n\ge2$ people, some pairs shake hands (no one shakes hands with themselves,
  and each pair shakes at most once). Prove that there are two people who shook the same number of hands.
stages:
- goal: Find the range of possible hand counts and see why plain pigeonhole does not immediately apply.
  expected: Each count lies between $0$ and $n-1$, which gives $n$ possible values for $n$ people, so
    there is no immediate repeat.
  solution: Each person can shake hands with at most the other $n-1$ people, so every count lies in $\{0,1,\dots,n-1\}$.
    That is $n$ values for $n$ people, so counting alone does not force a repeat.
  common_errors:
  - Claiming pigeonhole works immediately because there are $n$ values and $n$ people
  - Forgetting that both $0$ and $n-1$ are in the range
  hints:
    rephrase: How many different hand counts could any single person possibly have?
    smaller_case: Take $n=3$ and list the counts each person could have.
    key_idea: Compare the number of possible values with the number of people.
- goal: Show that the extreme values $0$ and $n-1$ cannot both occur.
  expected: If someone shook $n-1$ hands, then nobody shook $0$ hands.
  solution: If someone shook hands with all $n-1$ others, then every other person has at least one handshake.
    So no one has count $0$.
  common_errors:
  - Assuming the two extreme counts can coexist
  - Using the maximum without connecting it to the minimum
  hints:
    rephrase: If one person has shaken everyone's hand, what does that tell you about each of the others?
    smaller_case: With $n=3$, suppose one person shook 2 hands. Who could have shaken 0 hands?
    key_idea: A person with the largest possible count is linked to everyone else, which affects the smallest
      possible count.
- goal: Conclude that the counts take at most $n-1$ distinct values and finish the proof.
  expected: There are $n$ people and at most $n-1$ possible values, so two people share a count.
  solution: 'Case A: someone has $n-1$ handshakes. Then nobody has $0$, so all counts lie in $\{1,\dots,n-1\}$,
    which has $n-1$ values. Case B: nobody has $n-1$. Then all counts lie in $\{0,\dots,n-2\}$, again
    $n-1$ values. In either case $n$ people share at most $n-1$ values, so by pigeonhole two people have
    the same count.'
  common_errors:
  - Handling only one of the two cases
  - Miscounting the size of $\{1,\dots,n-1\}$
  hints:
    rephrase: Split the argument according to whether anyone shook hands with everyone else.
    smaller_case: For $n=4$, write out the set of possible counts in each case.
    key_idea: Removing one extreme value leaves $n-1$ boxes for $n$ people.
  check: (4 - 1) - 3
  check_ok: true
extensions:
  '3':
  - Give a party with $n$ people in which the counts take exactly $n-1$ distinct values, so the bound
    is tight.
  '4':
  - Show that if the counts take exactly $n-1$ distinct values, exactly two people share a count and all
    other counts are unique.
  '5':
  - Consider a directed version where each person's out-degree lies in $\{0,\dots,n-1\}$. Does the same
    argument work for out-degrees? Justify your answer.
