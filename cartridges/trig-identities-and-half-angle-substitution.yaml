- secant theta cosecant theta
- cotangent theta plus cosecant theta squared
- one plus cosine theta over one minus cosine theta
- t equals tangent of a half theta
- half-angle formula
- cosine theta equals one minus t squared over one plus t squared
- sine theta equals two t over one plus t squared
- tangent theta equals two t over one minus t squared
- identity
