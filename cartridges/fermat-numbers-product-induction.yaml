answer_source: generated
statement: The Fermat numbers are defined by $F_n = 2^{2^n} + 1$. Use proof by induction to show that
  for all integers $n \geq 1$, $F_0F_1 \cdots F_{n-1} = F_n - 2$.
stages:
- goal: Verify the base case n = 1.
  expected: For n = 1 the left side is F_0 = 3 and the right side is F_1 - 2 = 5 - 2 = 3, so the statement
    holds.
  solution: F_0 = 2^{2^0} + 1 = 2^1 + 1 = 3. F_1 = 2^{2^1} + 1 = 5. Then F_1 - 2 = 3 = F_0.
  common_errors:
  - Computing F_0 as 2^0 + 1 = 2 instead of 2^{2^0} + 1 = 3.
  - Checking the base case at n = 0 without noting that the empty product convention is needed there.
  - Forgetting that the statement is only claimed for n >= 1.
  hints:
    rephrase: What do the two sides of the statement equal when n is the smallest value in the stated
      range?
    smaller_case: Write F_0 and F_1 out as explicit numbers and compare.
    key_idea: 'Base case: check the statement at the first value of n where it is claimed.'
  check: (2**(2**0)+1) - ((2**(2**1)+1) - 2)
  check_ok: true
- goal: 'Set up the inductive step: assume the statement for n and derive the expression for the product
    up to F_n.'
  expected: Assume F_0 F_1 \cdots F_{n-1} = F_n - 2. Multiply both sides by F_n to get F_0 F_1 \cdots
    F_{n-1} F_n = (F_n - 2) F_n.
  solution: 'Inductive hypothesis: F_0 \cdots F_{n-1} = F_n - 2. Multiplying both sides by F_n gives F_0
    \cdots F_{n-1} F_n = (F_n - 2) F_n = F_n^2 - 2F_n.'
  common_errors:
  - Assuming the statement for n+1 and trying to prove it directly without using the hypothesis.
  - Multiplying only one side of the hypothesis by F_n.
  - Expanding (F_n - 2)F_n incorrectly as F_n^2 - 2.
  hints:
    rephrase: If you know a product equals some expression, what can you do to both sides to bring in
      one more factor?
    smaller_case: For n = 2, the hypothesis says F_0 F_1 = 15 = F_2 - 2. What happens when you multiply
      by F_2?
    key_idea: The hypothesis lets you replace the whole product F_0 \cdots F_{n-1} by a single expression
      involving F_n.
  check: (F-2)*F - (F**2 - 2*F)
  check_ok: true
- goal: Show that (F_n - 2)F_n = F_{n+1} - 2 using the definition of the Fermat numbers.
  expected: F_{n+1} = (2^{2^n})^2 + 1 = (F_n - 1)^2 + 1 = F_n^2 - 2F_n + 2, so F_{n+1} - 2 = F_n^2 - 2F_n
    = (F_n - 2)F_n.
  solution: Let x = 2^{2^n}, so F_n = x + 1. Then F_{n+1} = 2^{2^{n+1}} + 1 = 2^{2^n \cdot 2} + 1 = x^2
    + 1. Substituting x = F_n - 1 gives F_{n+1} = (F_n - 1)^2 + 1 = F_n^2 - 2F_n + 2. Hence F_{n+1} -
    2 = F_n^2 - 2F_n = (F_n - 2)F_n.
  common_errors:
  - Writing 2^{2^{n+1}} as 2^{2^n} + 2^{2^n} or as 2 \cdot 2^{2^n}, instead of (2^{2^n})^2.
  - Making a sign error when expanding (F_n - 1)^2 + 1.
  - Stopping before connecting the expression back to F_{n+1} - 2.
  hints:
    rephrase: Use the rule that 2^{2^{n+1}} is a square of a simpler power of 2.
    smaller_case: Compare F_2 with F_1 and see how the exponent in the definition changes from one index
      to the next.
    key_idea: Substitute x = 2^{2^n}. Then F_n = x + 1 and F_{n+1} is a polynomial in x that you can rewrite
      in terms of F_n.
  check: x**2 + 1 - ((x+1)**2 - 2*(x+1) + 2)
  check_ok: true
- goal: Conclude the induction.
  expected: The statement holds for n = 1, and the inductive step shows that if it holds for n then it
    holds for n + 1. Therefore F_0 F_1 \cdots F_{n-1} = F_n - 2 for all integers n >= 1.
  solution: By the principle of mathematical induction, the statement is true for every n >= 1.
  common_errors:
  - Not stating the induction principle or the domain n >= 1.
  - Concluding without confirming the base case.
  hints:
    rephrase: What two ingredients does the principle of mathematical induction require?
    smaller_case: Explain why the argument does not show anything about n = 0 unless you address the empty
      product.
    key_idea: Induction needs a base case and a step that passes from n to n + 1.
  check: null
extensions:
  '3':
  - Use the identity to show that F_m and F_n are coprime for m not equal to n.
  '4':
