id: sin2-cos2-plane-locus
title: Locus of sin^2 x + cos^2 y = 1
topics:
- trigonometry
- loci in the plane
- factorising
- trigonometric identities
warmup: true
answer_source: generated
statement: Where in the plane is $\sin^2x+\cos^2y=1$?
stages:
- goal: Reduce the equation to a relation between sin^2 x and sin^2 y.
  expected: sin^2 x = sin^2 y, equivalently |sin x| = |sin y|.
  solution: Use cos^2 y = 1 - sin^2 y. Then sin^2 x + 1 - sin^2 y = 1, so sin^2 x = sin^2 y, which means
    |sin x| = |sin y|.
  common_errors:
  - Concluding only x=y
  - Dropping the sign when taking square roots
  hints:
    rephrase: Replace cos^2 y using the Pythagorean identity.
    smaller_case: Set y=0 and see what the equation says about x.
    key_idea: Move the sin^2 terms to one side and compare them.
  check: (sin(x)**2 + cos(y)**2 - 1) - (sin(x)**2 - sin(y)**2)
  check_ok: true
- goal: Factor sin^2 x - sin^2 y and describe the locus.
  expected: sin(x+y)*sin(x-y)=0, i.e. x+y=m*pi or x-y=n*pi for integers m and n. The locus is two families
    of parallel lines with slopes -1 and +1, forming a diagonal grid.
  solution: 'Identity: sin(A+B)sin(A-B) = sin^2 A - sin^2 B. Proof: sin(A+B)sin(A-B) = (sin A cos B +
    cos A sin B)(sin A cos B - cos A sin B) = sin^2 A cos^2 B - cos^2 A sin^2 B = sin^2 A(1 - sin^2 B)
    - (1 - sin^2 A) sin^2 B = sin^2 A - sin^2 B. So the equation is sin(x+y)sin(x-y)=0. sin(x+y)=0 gives
    x+y=m*pi, and sin(x-y)=0 gives x-y=n*pi. So the solution set is the union of the lines x+y=m*pi (slope
    -1) and x-y=n*pi (slope +1), for integers m, n. These lines cross at points ((m+n)*pi/2, (m-n)*pi/2),
    where both families meet.'
  common_errors:
  - Stating the solution set is only the line x=y
  - Forgetting the integer multiples of pi
  - Treating sin(x+y)=0 as x+y=0 only
  - Drawing only one family of lines
  hints:
    rephrase: Try writing sin^2 x - sin^2 y as a product using a sine addition formula.
    smaller_case: Set y=0 and find the curve in the x-direction.
    key_idea: Use the difference-of-squares identity sin(A+B)sin(A-B) = sin^2 A - sin^2 B.
  check: sin(x+y)*sin(x-y) - (sin(x)**2 - sin(y)**2)
  check_ok: true
