warmup: true
answer_source: generated
statement: Four balls are dropped into two boxes, with an equal chance of each ball falling into either
  box. What is the probability that there are two balls in each box?
stages:
- goal: Count the equally likely outcomes of placing the four balls.
  expected: 16 outcomes, since each of the 4 balls independently has 2 choices (2^4 = 16).
  solution: The balls are distinguishable and each has two independent choices of box, so the sample space
    has 2 × 2 × 2 × 2 = 16 equally likely outcomes.
  common_errors:
  - Counting 2 outcomes (one per box) instead of 2^4.
  - Treating the balls as identical, which gives a non-uniform count of distributions.
  hints:
    rephrase: How many different ways can the four balls each choose one of two boxes?
    smaller_case: With two balls, list all the box assignments. How many are there?
    key_idea: Each ball's choice is independent, so multiply the number of choices for each ball.
- goal: Count the outcomes with two balls in each box and find the probability.
  expected: 3/8, from C(4,2) = 6 favourable outcomes out of 16.
  solution: Choose which 2 of the 4 balls go in box 1 (C(4,2) = 6 ways); the remaining 2 go in box 2.
    So P = 6/16 = 3/8.
  common_errors:
  - Doubling C(4,2) because either box could hold the pair. Choosing box 1's pair already covers every
    assignment.
  - Giving 6/16 without simplifying, or dividing by a wrong total.
  hints:
    rephrase: Pick which balls go into the first box, and check that the rest is forced.
    smaller_case: With two balls, how many assignments put one ball in each box?
    key_idea: Favourable outcomes divided by total equally likely outcomes; choosing a 2-ball subset counts
      each assignment exactly once.
  check: candidate - Rational(3, 8)
  check_ok: false
