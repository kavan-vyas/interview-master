id: equilateral-five-points-pigeonhole
title: Five points in an equilateral triangle
topics:
- pigeonhole principle
- geometry
- distance
warmup: false
answer_source: generated
statement: Take 5 points in an equilateral triangle of side length $1$. Prove that there are two of them
  at a distance of no greater than $0.5$.
stages:
- goal: Split the triangle into smaller regions.
  expected: 'Join the midpoints of the three sides. This divides the triangle into 4 equilateral triangles
    of side 1/2: three corner triangles and one central triangle.'
  solution: Each midpoint is at distance 1/2 from the two vertices on its side, and the midline segments
    have length 1/2, so all four pieces are equilateral with side 1/2.
  common_errors:
  - Dividing into 3 regions by drawing lines from the centre to the vertices, which gives regions with
    diameter greater than 1/2.
  - Stating the sides of the small triangles as 1/3.
  hints:
    rephrase: Which lines cut the triangle into pieces that are all the same shape and size?
    smaller_case: Start with an equilateral triangle of side 2 and find the pieces obtained by joining
      midpoints.
    key_idea: Midlines of a triangle are parallel to the sides and half their length.
  check: null
- goal: Apply the pigeonhole principle to the 5 points.
  expected: Five points lie in four regions, so at least two points lie in the same region. Points on
    shared boundaries can be assigned to either region.
  solution: Since 5 > 4, the pigeonhole principle gives two points in one small triangle.
  common_errors:
  - Saying two points are in the same region without noting that the regions cover the whole triangle.
  - Worrying about boundary points without assigning them to one region.
  hints:
    rephrase: If you place 5 objects into 4 boxes, what must happen?
    smaller_case: Try placing 3 points into 2 boxes.
    key_idea: More objects than boxes forces a shared box.
  check: null
- goal: Bound the distance between two points in the same small triangle.
  expected: Any two points in an equilateral triangle of side 1/2 are at distance at most 1/2.
  solution: The distance between two points in a convex polygon is maximised at vertices, so the largest
    distance is between two vertices, which is 1/2.
  common_errors:
  - Using the centroid distance instead of the vertex distance.
  - Assuming the diameter of the triangle is its height, sqrt(3)/4 times 2.
  hints:
    rephrase: Where can the farthest pair of points in a triangle sit?
    smaller_case: Check two points on one side of the small triangle.
    key_idea: The distance function is convex, so it is largest at extreme points.
  check: sp.simplify(ans - sp.Rational(1, 2))
  check_ok: null
extensions:
  '3':
  - Five points lie in a unit square. Using the same method with four sub-squares, what distance bound
    do you get?
  '4':
  - Is 1/2 the best possible constant for five points in an equilateral triangle of side 1? Give five
    points with all pairwise distances at least 1/2.
  '5':
  - Is the bound from the square subdivision for five points in a unit square sharp? Give a configuration
    that attains it.
