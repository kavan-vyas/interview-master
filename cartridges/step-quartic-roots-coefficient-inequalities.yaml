id: step-quartic-roots-coefficient-inequalities
title: Vieta and AM-GM inequalities for a quartic with distinct positive roots
topics:
- polynomials
- Vieta's formulas
- AM-GM inequality
- Rolle's theorem
- inequalities
warmup: false
answer_source: pdf
statement: In this question, you may assume that if $k_1,\ldots,k_n$ are distinct positive real numbers,
  then $\frac{1}{n}\sum_{r=1}^n k_r>\left(\prod_{r=1}^n k_r\right)^{1/n}$. Suppose that $a$, $b$, $c$
  and $d$ are positive real numbers such that the polynomial $f(x)=x^4-4ax^3+6b^2x^2-4c^3x+d^4$ has four
  distinct positive roots. (i) By considering the relationship between the coefficients of $f$ and its
  roots, show that $c>d$. (ii) By differentiating $f$, show that $b>c$. (iii) Show that $a>b$.
stages:
- goal: Use the relationship between the coefficients of $f$ and its roots to show $c>d$.
  expected: $c>d$
  solution: Write $f(x)=(x-p)(x-q)(x-r)(x-s)$ with distinct positive roots $p,q,r,s$. Comparing coefficients
    gives $pqrs=d^4$ and $pqr+qrs+rsp+spq=4c^3$. The four numbers $pqr,qrs,rsp,spq$ are distinct and positive,
    since each pair differs by a ratio of two distinct roots. Their product is $(pqrs)^3=d^{12}$, so AM-GM
    gives $c^3=\frac{1}{4}(pqr+qrs+rsp+spq)>(d^{12})^{1/4}=d^3$, hence $c>d$.
  common_errors:
  - Matching the wrong coefficients, for example taking $pqr+qrs+rsp+spq$ to equal $-4c^3$ rather than
    $4c^3$
  - Computing the product of the four triple products incorrectly (each root appears in three of them)
  - Forgetting to check that the four AM-GM inputs are distinct
  hints:
    rephrase: Write $f$ in factored form and compare the coefficients with the expanded form.
    smaller_case: Take the case of a quadratic with two distinct positive roots and compare its coefficients
      with the expanded form to see which symmetric function gives which coefficient.
    key_idea: Vieta's formulas link the symmetric functions of the roots to the coefficients. Apply the
      stated AM-GM inequality to a well-chosen set of four positive numbers built from the roots.
  check: null
- goal: Use the derivative of $f$ to show $b>c$.
  expected: $b>c$
  solution: Since $f$ has four distinct real zeros, Rolle's theorem gives three distinct zeros $u,v,w$
    of $f'$, all positive, lying between consecutive zeros of $f$. Now $f'(x)/4=x^3-3ax^2+3b^2x-c^3$,
    and comparing with $(x-u)(x-v)(x-w)$ gives $uvw=c^3$ and $uv+vw+wu=3b^2$. The three numbers $vw,wu,uv$
    are distinct and positive, so AM-GM gives $b^2=\frac{1}{3}(uv+vw+wu)>\left((vw)(wu)(uv)\right)^{1/3}=(uvw)^{2/3}=c^2$.
    Since $b,c>0$, this gives $b>c$.
  common_errors:
  - Forgetting that Rolle's theorem gives three distinct zeros of $f'$ and that these are positive
  - Matching the wrong coefficients between $f'/4$ and $(x-u)(x-v)(x-w)$
  - Taking the cube root of the product incorrectly, which gives $c^2$ rather than $c^3$ on the right-hand
    side
  hints:
    rephrase: Find the zeros of $f'$ and relate them to the coefficients of $f'/4$.
    smaller_case: Check the coefficient matching on a cubic with three distinct positive roots before
      applying it here.
    key_idea: Use the zeros of the derivative as a new set of roots and apply Vieta's formulas to the
      cubic $f'/4$, then AM-GM to the pairwise products.
  check: null
- goal: Use the second derivative of $f$ to show $a>b$.
  expected: $a>b$
  solution: Since $f'$ has three distinct zeros $u<v<w$, Rolle's theorem gives two distinct zeros $\alpha<\beta$
    of $f''$, both lying in $(u,w)$ and so positive. Now $f''(x)/12=x^2-2ax+b^2=(x-\alpha)(x-\beta)$,
    so $\alpha+\beta=2a$ and $\alpha\beta=b^2$. AM-GM applied to the distinct positive numbers $\alpha,\beta$
    gives $a=\frac{\alpha+\beta}{2}>\sqrt{\alpha\beta}=b$.
  common_errors:
  - Forgetting to justify that the zeros of $f''$ are distinct and positive
  - Comparing the coefficient of $x$ incorrectly, giving $\alpha+\beta=a$ instead of $2a$
  - Confusing the constant term with $b^2$ and getting $\alpha\beta=b$
  hints:
    rephrase: Compare $f''(x)/12$ with a monic quadratic and find the sum and product of its roots.
    smaller_case: Apply the same argument to the quadratic $x^2-2ax+b^2$ with two distinct positive roots.
    key_idea: 'Repeat the derivative argument one level down: the zeros of $f''''$ are distinct and positive,
      so AM-GM on them relates the coefficients to $a$ and $b$.'
  check: null
extensions:
  '3':
  - Show that if $f$ has four distinct positive roots then $f'$ has exactly three distinct positive roots,
    and explain why each lies strictly between consecutive roots of $f$.
  '4':
  - Generalise the chain $a>b>c>d$ to a monic polynomial of degree $n$ with distinct positive roots, using
    the coefficients of $x^{n-k}$ in place of $a,b,c,d$.
  '5':
  - State Newton's inequalities for the elementary symmetric means of real numbers and explain how they
    generalise the argument in parts (i) to (iii).
