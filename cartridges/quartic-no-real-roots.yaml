id: quartic-no-real-roots
title: Does the quartic have real roots?
topics:
- polynomials
- factorisation
- perfect squares
- real roots
- complex numbers
warmup: true
answer_source: generated
statement: Does $x^4 + 2x^3 + 3x^2 + 2x + 1 = 0$ have any real solutions?
stages:
- goal: Rewrite the left-hand side of the equation in a simpler form.
  expected: $x^4 + 2x^3 + 3x^2 + 2x + 1 = (x^2 + x + 1)^2$
  solution: Expand $(x^2 + x + 1)^2 = x^4 + x^2 + 1 + 2x^3 + 2x^2 + 2x = x^4 + 2x^3 + 3x^2 + 2x + 1$.
    The polynomial is therefore a perfect square of $x^2 + x + 1$.
  common_errors:
  - Expanding $(x^2+x+1)^2$ as $x^4+x^2+1$ and forgetting the cross terms $2x^3$ and $2x$.
  - Trying to factor into two quadratics with the wrong coefficients and stopping before checking the
    $x^2$ coefficient.
  - Sign slips when matching the coefficient of $x^2$ (the total should be 3).
  hints:
    rephrase: Is there a simpler polynomial whose square matches the left-hand side? Try expanding a square
      of a quadratic and compare coefficients.
    smaller_case: Expand $(x+1)^2$ and $(x+1)^3$ and notice how the coefficients arise. Could a similar
      square with an $x^2$ term work here?
    key_idea: 'Look for a perfect-square pattern: the coefficients of $(x^2+bx+c)^2$ are $1, 2b, b^2+2c,
      2bc, c^2$ in order.'
  check: expand((x**2 + x + 1)**2 - (x**4 + 2*x**3 + 3*x**2 + 2*x + 1)) == 0
  check_ok: true
- goal: Decide whether the equation has any real solutions and justify the answer.
  expected: No. The equation is $(x^2+x+1)^2 = 0$, so it requires $x^2+x+1=0$. This quadratic has discriminant
    $1-4=-3<0$, so it has no real roots. Equivalently, $x^2+x+1=(x+\tfrac12)^2+\tfrac34>0$ for all real
    $x$, so its square is strictly positive. The equation has no real solutions.
  solution: Using the factorisation, the equation is $(x^2+x+1)^2=0$, which is equivalent to $x^2+x+1=0$.
    Completing the square gives $x^2+x+1=(x+\tfrac12)^2+\tfrac34 \ge \tfrac34 > 0$ for every real $x$.
    So the quadratic never vanishes on the reals, and neither does the quartic. The roots are the complex
    numbers $\omega=\frac{-1+i\sqrt3}{2}$ and $\bar\omega$, each repeated twice.
  common_errors:
  - Stating that the answer is yes because the polynomial is a square, without checking whether the square
    root can vanish on the reals.
  - Computing the discriminant of the quartic instead of the quadratic factor, or making a sign error
    in $1-4$.
  - Claiming there are no real solutions because the polynomial has no real factorisation, without showing
    a positivity argument or discriminant check.
  hints:
    rephrase: Can a real-valued expression squared ever be negative? Once you know the factor, ask whether
      it can ever be zero for real $x$.
    smaller_case: Look at $x^2+x+1$ alone. Test whether it can equal zero for a real number $x$, for example
      by completing the square.
    key_idea: 'Compare with the sign of a sum of squares: write the inner quadratic as a square plus a
      positive constant.'
  check: solveset(x**4 + 2*x**3 + 3*x**2 + 2*x + 1, x, domain=S.Reals) == S.EmptySet
  check_ok: true
