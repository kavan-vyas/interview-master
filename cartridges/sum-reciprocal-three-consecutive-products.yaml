id: sum-reciprocal-three-consecutive-products
title: Sum of reciprocals of consecutive products
topics:
- telescoping sums
- partial fractions
- series convergence
warmup: true
answer_source: pdf
statement: Evaluate $\sum_{k=1}^\infty\frac{1}{k(k+1)(k+2)}=\frac{1}{1\cdot 2\cdot 3}+\frac{1}{2\cdot
  3\cdot 4}+\cdots$.
stages:
- goal: Find an identity that rewrites each term as a difference of two simpler terms.
  expected: 1/(k(k+1)) - 1/((k+1)(k+2)) = 2/(k(k+1)(k+2)), so 1/(k(k+1)(k+2)) = (1/2)[1/(k(k+1)) - 1/((k+1)(k+2))].
  solution: 'Combine the two fractions on the left over the common denominator k(k+1)(k+2): the numerator
    is (k+2) - k = 2, giving 2/(k(k+1)(k+2)). Divide by 2.'
  common_errors:
  - Forgetting the factor 1/2 when rewriting the term.
  - Getting the numerator wrong, e.g. (k+1) - k instead of (k+2) - k.
  - Trying to decompose into three partial fractions unnecessarily.
  hints:
    rephrase: Try writing the term as a difference of two fractions that share a factor with the denominator.
    smaller_case: Combine 1/(1·2) and 1/(2·3) into one fraction and compare with 1/(1·2·3).
    key_idea: Two consecutive terms of the form 1/(k(k+1)) differ by a fraction with denominator k(k+1)(k+2).
  check: simplify(1/(k*(k+1)) - 1/((k+1)*(k+2)) - 2/(k*(k+1)*(k+2)))
  check_ok: true
- goal: Find a closed form for the partial sum and check it.
  expected: Partial sum up to n equals (1/2)(1/2 - 1/((n+1)(n+2))).
  solution: 'Summing the identity from k=1 to n telescopes: (1/2)[1/(1·2) - 1/((n+1)(n+2))] = (1/2)(1/2
    - 1/((n+1)(n+2))). Check n=3: 1/6+1/24+1/60 = 9/40 and (1/2)(1/2 - 1/20) = 9/40.'
  common_errors:
  - Telescoping with the wrong endpoint, leaving 1/(2·3) instead of 1/(1·2).
  - Dropping the overall factor 1/2.
  - Writing (n+1)(n+2) as n(n+2).
  hints:
    rephrase: Sum your identity from k = 1 to k = n and see which terms cancel.
    smaller_case: Add the first two terms of the series and compare with a simple fraction.
    key_idea: Consecutive terms cancel, so only the first and last terms of the sum survive.
  check: Sum(1/(k*(k+1)*(k+2)),(k,1,3)).doit() - Rational(1,2)*(Rational(1,2) - Rational(1,20))
  check_ok: true
- goal: Take the limit as n tends to infinity to get the value of the series.
  expected: The sum equals 1/4.
  solution: As n tends to infinity, 1/((n+1)(n+2)) tends to 0, so the sum tends to (1/2)(1/2) = 1/4.
  common_errors:
  - Forgetting that the second term tends to 0 and not to some constant.
  - Arithmetic error, e.g. evaluating (1/2)(1/2) as 1/2.
  - Not justifying convergence of the partial sums.
  hints:
    rephrase: Consider what the term subtracted from 1/2 does as n becomes very large.
    smaller_case: What is 1/((n+1)(n+2)) when n = 1000?
    key_idea: A term with a growing denominator shrinks to zero, leaving only the constant part.
  check: Rational(1,2)*Rational(1,2) - Rational(1,4)
  check_ok: true
extensions:
  '3':
  - Evaluate the sum over k of 1/(k(k+1)(k+2)(k+3)) using a telescoping argument.
  '4':
  - Generalise to the sum over k from 1 to infinity of 1/(k(k+1)...(k+r)). Test your formula for r = 1
    and r = 2.
  '5':
  - Prove your general formula for the sum over k of 1/(k(k+1)...(k+r)) by induction on r.
