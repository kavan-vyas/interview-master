id: spider-random-walk-hitting
title: Spider random walk on square, cube, triangle and path
topics:
- Markov chains
- expected values
- random walks
- symmetry
- linear equations
warmup: false
answer_source: pdf
statement: A spider starts at a corner $S$ of a square and walks along the edges. At each corner it chooses
  one of the edges there uniformly at random and walks along it to the next corner. a) Find the expected
  number of steps until the spider first reaches the corner $T$ opposite $S$. b) Repeat for a cube, where
  $T$ is the vertex diagonally opposite $S$. c) On the cube, find the expected number of steps until the
  spider first returns to $S$. What about a triangle, or three points $S$–$A$–$B$ in a line?
stages:
- goal: Find the expected number of steps for the spider to reach the opposite corner $T$ on the square.
  expected: 4 steps.
  solution: Let $E_1$ be the expected steps from a corner adjacent to $T$, and $E_2$ from $S$, which is
    opposite $T$. From $S$ the spider moves to one of its two neighbours, both adjacent to $T$, so $E_2=1+E_1$.
    From a corner adjacent to $T$, the spider reaches $T$ with probability $\frac12$, and otherwise goes
    back to $S$, so $E_1=1+\frac12\cdot 0+\frac12E_2$. Substituting gives $E_2=2+\frac12E_2$, so $E_2=4$.
  common_errors:
  - Treating the square as if $S$ were adjacent to $T$.
  - Forgetting the step taken from $S$ before the spider can reach a neighbour of $T$.
  - Using $\frac13$ instead of $\frac12$ as the probability of choosing each edge on a square.
  hints:
    rephrase: 'Set up expected-value equations for the distance from $T$: one for $S$ and one for a corner
      next to $T$.'
    smaller_case: Ask what the spider does from a corner next to $T$, and what its chance of reaching
      $T$ is in one step.
    key_idea: Write one equation per distance class, using the probability of each neighbour, then solve
      the small linear system.
  check: solve([E2 - 1 - E1, E1 - 1 - Rational(1,2)*E2], [E1, E2])[E2] - 4
  check_ok: null
- goal: Find the expected number of steps for the spider to reach the vertex $T$ diagonally opposite $S$
    on the cube.
  expected: 10 steps.
  solution: 'Let $E_n$ be the expected steps from a vertex at distance $n$ from $T$, with $E_0=0$. A vertex
    at distance $n$ has $n$ neighbours at distance $n-1$ and $3-n$ neighbours at distance $n+1$. So $E_1=1+\frac23E_2$,
    $E_2=1+\frac23E_1+\frac13E_3$ and $E_3=1+E_2$. Solving gives $E_2=9$, $E_1=7$ and $E_3=10$. Check:
    $E_1=1+\frac23\cdot 9=7$ and $E_2=1+\frac23\cdot 7+\frac13\cdot 10=9$.'
  common_errors:
  - 'Using the wrong neighbour counts: a vertex at distance 2 has two neighbours at distance 1 and one
    at distance 3.'
  - Forgetting that $E_0=0$ and treating $T$ as absorbing.
  - Solving the system with an arithmetic slip, such as $\frac13$ instead of $\frac23$.
  hints:
    rephrase: Group the vertices by their distance from $T$, and count how many neighbours of each vertex
      lie in each group.
    smaller_case: Set up the equation for the vertex next to $T$, which has two neighbours further away
      and one neighbour at $T$.
    key_idea: The distance from $T$ changes by plus or minus one at each step, so write one equation per
      distance and solve them in turn.
  check: solve([E1 - 1 - Rational(2,3)*E2, E2 - 1 - Rational(2,3)*E1 - Rational(1,3)*E3, E3 - 1 - E2],
    [E1, E2, E3])[E3] - 10
  check_ok: null
- goal: Find the expected number of steps for the spider to return to $S$ on the cube, and compare the
    triangle and the path $S$–$A$–$B$.
  expected: On the cube the return time is 8 steps. On a triangle it is 3 steps. On the path $S$–$A$–$B$
    it is 4 steps.
  solution: On the cube, the first step from $S$ is forced to a neighbour. By symmetry, the expected time
    from that neighbour back to $S$ satisfies the same system as in part b) with $S$ in place of $T$,
    so it equals $7$. Hence the return time is $1+7=8$. On a triangle, let $F$ be the expected time from
    a neighbour of $S$ and $G$ from the other corner. Then $F=1+\frac12G$ and $G=1+\frac12F$, so $F=G=2$,
    and the return time is $1+2=3$. On the path $S$–$A$–$B$, from $A$ we have $E_A=1+\frac12\cdot 0+\frac12E_B$
    and $E_B=1+E_A$, so $E_A=3$ and the return time is $1+3=4$.
  common_errors:
  - Using the forward hitting time of $T$ from part b) as the return time to $S$.
  - Forgetting the first forced step from $S$ when computing the return time.
  - On the triangle, assuming the other corner behaves differently from the neighbour when it is in fact
    symmetric.
  - Forgetting that $B$ has only one neighbour on the path, so $E_B=1+E_A$.
  hints:
    rephrase: For the return time, start the walk at $S$ and first decide where it must go. Then ask how
      long it takes to come back from there.
    smaller_case: On the triangle, write one equation for each of the two non-start corners, using that
      each has one edge back to $S$.
    key_idea: In a graph where every corner has the same number of edges, the return time to a starting
      corner depends only on the number of corners and edges.
  check: (1 + solve([F - 1 - Rational(1,2)*G, G - 1 - Rational(1,2)*F], [F, G])[F] - 3) + (1 + solve([EA
    - 1 - Rational(1,2)*EB, EB - 1 - EA], [EA, EB])[EA] - 4)
  check_ok: true
extensions:
  '3':
  - Find the expected return time to $S$ on a regular tetrahedron.
  - Compare the cube return time with the number of corners of the cube.
  '4':
  - Explain why the expected return time to $S$ equals $\frac{2|E|}{\deg(S)}$.
  - Show that the formula gives the number of corners whenever every corner has the same degree.
  '5':
  - For a general connected graph, relate the expected return time to $S$ to a stationary distribution
    of the walk.
  - Find the expected hitting time between two given corners of a cube, not just from $S$ to its opposite
    corner.
