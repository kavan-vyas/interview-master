id: consecutive-product-square-no-solutions
title: x(x+1) = v² has no positive integer solutions
topics:
- number theory
- prime factorisation
- coprimality
- perfect powers
- Diophantine equations
warmup: false
answer_source: pdf
statement: If $v$ is a number, consider $x(x+1)=v^2$. What do you know about the prime factors of $v^2$?
  Can $x$ and $x+1$ share any prime factor? Do their prime factors come in pairs, so that $x$ and $x+1$
  are both square numbers? Then, what about $x(x+1)=v^3$ and $x(x+1)=v^n$? (Take $x$ to be a positive
  integer.)
stages:
- goal: Show that $x$ and $x+1$ share no common prime factor.
  expected: gcd(x, x+1) = 1, so the two factors are coprime.
  solution: Let $d$ be any common divisor of $x$ and $x+1$. Then $d$ divides $(x+1)-x=1$, so $d=1$. Hence
    $\gcd(x,x+1)=1$ and no prime divides both.
  common_errors:
  - Asserting coprimality without a divisibility argument.
  - Confusing 'consecutive' with 'coprime' only for small cases, such as checking x = 2, 3 and generalising.
  hints:
    rephrase: If a prime p divides both x and x+1, what can you say about their difference?
    smaller_case: Take x = 6. What are the prime factors of 6 and 7, and do they overlap?
    key_idea: Any common divisor of two numbers divides their difference.
  check: sympy.gcd(x, x+1) - 1  (equals 0 iff the stage answer is right)
  check_ok: null
- goal: Deduce that, for $x(x+1)=v^2$ with $x\ge 1$, both $x$ and $x+1$ are perfect squares.
  expected: x = a^2 and x+1 = b^2 for positive integers a and b.
  solution: Each prime p has even exponent in v^2. Since p divides at most one of x and x+1, all of p's
    exponent in v^2 sits in that single factor, so that factor has an even exponent for every prime. A
    positive integer with all prime exponents even is a perfect square. So x = a^2 and x+1 = b^2.
  common_errors:
  - Forgetting that the whole exponent of p must lie in one factor, so it is not split between x and x+1.
  - Claiming v is a square without justification; v itself need not be considered beyond v^2.
  hints:
    rephrase: Look at the exponent of each prime in the product, and ask which factor it can belong to.
    smaller_case: If x(x+1) is a square and x = 2, is x+1 forced to be a square? What breaks?
    key_idea: Coprime factors whose product is a perfect square must each be perfect squares.
  check: null
- goal: Conclude there are no positive integer solutions to $x(x+1)=v^2$.
  expected: No solutions in positive integers, since no two consecutive positive integers are both squares.
  solution: Suppose b^2 - a^2 = 1 with b > a >= 1. Then (b-a)(b+a) = 1, but b-a >= 1 and b+a >= 3, so
    the product is at least 3. Contradiction. (Trivial solutions x = 0, v = 0 or x = -1, v = 0 exist only
    if non-positive x is allowed.)
  common_errors:
  - Failing to mention the trivial solutions x = 0 or x = -1 when non-positive integers are allowed.
  - Checking only small values and concluding without a general argument.
  hints:
    rephrase: Can two perfect squares differ by exactly 1 when both are positive?
    smaller_case: Compare 1, 4, 9, 16. How far apart are consecutive squares?
    key_idea: Factor the difference of two squares as (b-a)(b+a) and bound each factor.
  check: null
extensions:
  '3':
  - Show that $x(x+1)=v^3$ has no solutions in positive integers. Both $x$ and $x+1$ must be perfect cubes,
    and $(a+1)^3-a^3=3a^2+3a+1\ge 7$ for $a\ge 1$.
  '4':
  - Show that $x(x+1)=v^4$ has no solutions in positive integers, using the same coprimality argument
    with fourth powers.
  '5':
  - For any $n\ge 2$, show $x(x+1)=v^n$ has no solutions in positive integers. Coprimality forces $x=a^n$
    and $x+1=b^n$, and $(a+1)^n-a^n\ge 2a+1\ge 3$.
