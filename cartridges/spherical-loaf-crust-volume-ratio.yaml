id: spherical-loaf-crust-volume-ratio
title: Crust area and volume ratio of a sliced sphere
topics:
- calculus
- surface of revolution
- volume of revolution
- optimisation
- sphere
warmup: false
answer_source: generated
statement: A spherical loaf of bread is cut into parallel slices of equal thickness. Show that, after
  any number of the slices have been eaten, the area of crust remaining is proportional to the number
  of slices remaining. A European ruling decrees that a parallel-sliced spherical loaf can only be referred
  to as 'crusty' if the ratio of volume $V$ (in cubic metres) of bread remaining to area $A$ (in square
  metres) of crust remaining after any number of slices have been eaten satisfies $V/A < 1$. Show that
  the radius of a crusty parallel-sliced spherical loaf must be less than $2\frac{2}{3}$ metres. [The
  area $A$ and volume $V$ formed by rotating a curve in the $x$-$y$ plane round the $x$-axis from $x =
  -a$ to $x = -a + t$ are given by $A = 2\pi\int_{-a}^{-a+t} y\left(1 + \left(\frac{dy}{dx}\right)^2\right)^{1/2}dx$
  and $V = \pi\int_{-a}^{-a+t} y^2\,dx$.]
stages:
- goal: Show that the crust area of a remaining slab is $2\pi R t$, so it is proportional to the number
    of slices.
  expected: $A = 2\pi R t$ for a remaining piece of thickness $t$. With slices of thickness $d$, $t =
    nd$, so $A = 2\pi R d \cdot n$, which is proportional to the number $n$ of slices.
  solution: The sphere is $y = \sqrt{R^2 - x^2}$ for $-R \leq x \leq R$. Then $\frac{dy}{dx} = -\frac{x}{y}$,
    so $1 + \left(\frac{dy}{dx}\right)^2 = \frac{R^2}{y^2}$ and $y\sqrt{1 + (dy/dx)^2} = R$. Therefore
    $A = 2\pi\int R\,dx = 2\pi R t$. Each slice has thickness $d$, so $n$ remaining slices give $t = nd$
    and $A = 2\pi R d \cdot n$.
  common_errors:
  - Including the flat cut faces in the crust area.
  - Failing to simplify $y\sqrt{1 + (dy/dx)^2}$ to $R$.
  - Taking the sphere's radius as the diameter.
  hints:
    rephrase: Parametrise the sphere by its profile $y = \sqrt{R^2 - x^2}$ and simplify the integrand
      before integrating.
    smaller_case: Check the integrand at a single point such as $R = 2$, $x = \frac{1}{3}$.
    key_idea: Compute $1 + (dy/dx)^2$ first. Its simple form cancels the $y$ in front of the square root.
  check: '(sqrt(R**2 - x**2)*sqrt(1 + diff(sqrt(R**2 - x**2), x)**2)).subs({R: 2, x: Rational(1,3)}) -
    2'
  check_ok: true
- goal: Find the volume of the remaining piece of thickness $t$.
  expected: $V = \pi\left(Rt^2 - \frac{t^3}{3}\right)$
  solution: Using $V = \pi\int_{-R}^{-R+t}(R^2 - x^2)\,dx$, substitute $s = x + R$, giving $\pi\int_0^t
    (2Rs - s^2)\,ds = \pi\left(Rt^2 - \frac{t^3}{3}\right)$.
  common_errors:
  - Integrating $y^2$ with the wrong limits, e.g. starting at $x = 0$.
  - Forgetting the factor $\frac{1}{3}$ on the $t^3$ term.
  - Expanding $(R^2 - x^2)$ incorrectly after the shift.
  hints:
    rephrase: Shift the variable so that the lower limit becomes $0$, then integrate the polynomial.
    smaller_case: Check the integral for $R = 1$ and $t = 1$, then generalise.
    key_idea: Substituting $s = x + R$ turns $R^2 - x^2$ into a polynomial in $s$ with lower limit $0$.
  check: simplify(integrate(pi*(R**2 - x**2), (x, -R, -R + t)) - pi*(R*t**2 - t**3/3))
  check_ok: true
- goal: Find the maximum of $V/A$ over the thickness $t$ and its value.
  expected: $V/A = \frac{t}{2} - \frac{t^2}{6R}$. The maximum over $0 < t \leq 2R$ is $\frac{3R}{8}$,
    at $t = \frac{3R}{2}$.
  solution: Dividing, $\frac{V}{A} = \frac{\pi(Rt^2 - t^3/3)}{2\pi R t} = \frac{t}{2} - \frac{t^2}{6R}$.
    Its derivative is $\frac{1}{2} - \frac{t}{3R}$, which is zero at $t = \frac{3R}{2}$. This lies in
    $(0, 2R]$, and the second derivative $-\frac{1}{3R}$ is negative, so it is a maximum. The value is
    $\frac{3R}{4} - \frac{9R}{24} = \frac{3R}{8}$.
  common_errors:
  - Dividing $V$ by $A$ without cancelling $\pi$ and $R$ correctly.
  - Checking only the whole loaf ($t = 2R$), which gives $\frac{R}{3}$. That is a weaker bound and not
    the maximum.
  - Maximising at $t = 2R$ because the function is increasing at the end.
  hints:
    rephrase: Write $V/A$ as a function of $t$ and find its maximum over $0 < t \leq 2R$.
    smaller_case: Evaluate $V/A$ for the whole loaf, $t = 2R$, and compare with a smaller thickness.
    key_idea: Maximise $V/A$ using differentiation with respect to $t$. Check the endpoints as well.
  check: simplify((t/2 - t**2/(6*R)).subs(t, 3*R/2) - 3*R/8)
  check_ok: true
- goal: Deduce the bound on $R$.
  expected: The condition $V/A < 1$ for every thickness requires $\frac{3R}{8} < 1$, so $R < \frac{8}{3}
    = 2\frac{2}{3}$.
  solution: The ruling requires $V/A < 1$ after any number of slices is eaten. Interpreting this as any
    remaining thickness $t \in (0, 2R]$, the largest value of $V/A$ is $\frac{3R}{8}$, attained at $t
    = \frac{3R}{2}$. We need $\frac{3R}{8} < 1$, so $R < \frac{8}{3}$. The inequality is strict, since
    $R = \frac{8}{3}$ gives $V/A = 1$ at $t = \frac{3R}{2}$.
  common_errors:
  - Using $\leq$ instead of $<$ at the end, so the boundary value $R = \frac{8}{3}$ is wrongly admitted.
  - Assuming the maximum is reached by the discrete slice thicknesses without justification.
  - Stating $R < 3$ from the whole-loaf case only.
  hints:
    rephrase: Require the maximum value of the ratio found in the previous stage to be less than $1$.
    smaller_case: Test whether $R = 3$ satisfies the requirement at the maximum. Then test whether $R
      = \frac{8}{3}$ does.
    key_idea: The bound comes from the largest value of $V/A$, not from any particular slice.
  check: (Rational(3,8)*R - 1).subs(R, Rational(8,3))
  check_ok: true
extensions:
  '3':
  - Show that the whole loaf has $V/A = \frac{R}{3}$, and hence find the largest radius for which the
    whole loaf alone is crusty.
  '4':
  - Find the volume of the remaining piece when $t = \frac{3R}{2}$.
  '5':
  - Show that the crust area of any set of remaining slices, from any positions, is $2\pi R$ times their
    total thickness.
