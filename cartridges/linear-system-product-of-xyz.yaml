id: linear-system-product-of-xyz
title: 'System of equations: products of pairs and xyz'
topics:
- simultaneous equations
- linear algebra
- algebraic manipulation
warmup: false
answer_source: pdf
statement: Consider the system of equations $2yz + zx - 5xy = 2$, $yz - zx + 2xy = 1$, $yz - 2zx + 6xy
  = 3$. Show that $xyz = \pm 6$ and find the possible values of $x$, $y$ and $z$.
stages:
- goal: Treat the products yz, zx and xy as unknowns and solve the system for them.
  expected: yz = 3, zx = 6, xy = 2.
  solution: 'Let A = yz, B = zx, C = xy. The system is linear: 2A + B - 5C = 2, A - B + 2C = 1, A - 2B
    + 6C = 3. From the second equation A = 1 + B - 2C. Substituting into the first gives 3B - 9C = 0,
    so B = 3C. Substituting into the third gives -B + 4C = 2, so C = 2, B = 6, and A = 3.'
  common_errors:
  - Sign errors when substituting A = 1 + B - 2C
  - Solving for x, y, z before finding the three products
  - Algebra slips in the third equation
  hints:
    rephrase: Let yz, zx and xy be three new unknowns. The equations are linear in them.
    smaller_case: Eliminate one unknown from two of the equations and see what remains.
    key_idea: The system is linear in the three products, so eliminate the products one at a time.
  check: (2*3+6-5*2-2)**2+(3-6+2*2-1)**2+(3-2*6+6*2-3)**2
  check_ok: true
- goal: Show that xyz = ±6.
  expected: (xyz)^2 = (yz)(zx)(xy) = 36, so xyz = ±6.
  solution: (xyz)^2 = (yz)(zx)(xy) = 3 * 6 * 2 = 36. Hence xyz = 6 or xyz = -6.
  common_errors:
  - Taking the square root and giving only the positive value
  - Multiplying the products incorrectly
  hints:
    rephrase: Multiply the three products together and look at what you get.
    smaller_case: What is (xyz)^2 written as a product of the three pair products?
    key_idea: (xyz)^2 = (xy)(yz)(zx).
  check: 3*6*2-36
  check_ok: true
- goal: Find all possible values of x, y and z.
  expected: (x, y, z) = (2, 1, 3) or (x, y, z) = (-2, -1, -3).
  solution: If xyz = 6, then x = xyz/(yz) = 6/3 = 2, y = xyz/(zx) = 6/6 = 1, z = xyz/(xy) = 6/2 = 3. If
    xyz = -6, the same divisions give x = -2, y = -1, z = -3. Both triples satisfy all three original
    equations because they give the same products yz = 3, zx = 6, xy = 2.
  common_errors:
  - Dropping the negative case
  - Dividing by the wrong product for each variable
  - Not checking the signs in the products
  hints:
    rephrase: Divide xyz by each of the three products to find each variable.
    smaller_case: If xyz = 6, what is x?
    key_idea: Each variable equals xyz divided by the product of the other two. The sign of xyz gives
      two cases.
  check: ((2*1*3+3*2-5*2*1-2)**2+(1*3-3*2+2*2*1-1)**2+(1*3-2*3*2+6*2*1-3)**2)+((2*(-1)*(-3)+(-3)*(-2)-5*(-2)*(-1)-2)**2+((-1)*(-3)-(-3)*(-2)+2*(-2)*(-1)-1)**2+((-1)*(-3)-2*(-3)*(-2)+6*(-2)*(-1)-3)**2)
  check_ok: true
extensions:
  '3':
  - Find the solutions when the first equation has right-hand side 4 instead of 2.
  - Show that xyz is determined up to sign whenever the three products are determined.
  '4':
  - Generalise the method to a linear system in three products with arbitrary constant coefficients.
  - When can two different sign choices of xyz both give valid solutions?
  '5':
  - Explain why the sign of xyz cannot be fixed by the equations alone and describe the symmetry responsible.
  - Find conditions on the right-hand sides under which the system has no real solution.
