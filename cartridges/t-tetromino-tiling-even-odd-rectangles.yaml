id: t-tetromino-tiling-even-odd-rectangles
title: T-tetromino tiling of (2a)×(2b) rectangles
topics:
- tiling
- colouring
- parity
- invariants
warmup: false
answer_source: generated
statement: The T-tetromino is the shape made by joining four $1\times1$ squares edge to edge. A rectangle
  $R$ has dimensions $(2a)\times(2b)$ where $a$ and $b$ are integers. '$R$ can be tiled by T' means $R$
  can be covered exactly by copies of the T-tetromino with no gaps and no overlaps. i) Can $R$ be tiled
  by T when both $a$ and $b$ are even? ii) Can $R$ be tiled by T when both $a$ and $b$ are odd?
stages:
- goal: Find how many T-tetrominoes a tiling of $R$ would need, in terms of $a$ and $b$.
  expected: $ab$ pieces (the area is $4ab$ and each piece covers 4 squares).
  solution: $R$ has area $(2a)(2b)=4ab$ unit squares. Each T covers exactly 4 squares, so a tiling uses
    $4ab/4=ab$ pieces.
  common_errors:
  - Using the perimeter or a sum of sides instead of the area
  - Forgetting to divide by 4, the number of squares in one T
  hints:
    rephrase: How many unit squares does $R$ contain, and how many does a single T cover?
    smaller_case: 'Take $a=1$, $b=2$: how many squares are in the rectangle, and how many T''s would fill
      it if a tiling existed?'
    key_idea: Divide the total number of squares by the number of squares in one piece.
  check: (2*a)*(2*b)/4 - a*b
  check_ok: true
- goal: Decide whether $R$ can be tiled by T when $a$ and $b$ are both even.
  expected: Yes.
  solution: Yes. A $4\times4$ square can be tiled by four T's. Using (row, column) coordinates from the
    top-left, take the T's {(1,1),(1,2),(1,3),(2,2)}, {(2,1),(3,1),(4,1),(3,2)}, {(1,4),(2,4),(3,4),(2,3)}
    and {(4,2),(4,3),(4,4),(3,3)}. They are disjoint and cover all 16 squares. Since $a$ and $b$ are even,
    $2a$ and $2b$ are multiples of 4, so $R$ splits into $(a/2)(b/2)$ disjoint $4\times4$ squares, each
    of which is tileable.
  common_errors:
  - Claiming a $2\times4$ rectangle works (a 2-row strip can never be tiled by T's)
  - Checking only that the area is divisible by 4 without constructing a tiling
  hints:
    rephrase: Can you build $R$ from smaller pieces that you already know can be tiled?
    smaller_case: Look at the smallest rectangle whose sides are both multiples of 4 and try to cover
      it by hand.
    key_idea: Find one tileable block whose sides are multiples of 4, then place copies of it side by
      side.
  check: null
- goal: Decide whether $R$ can be tiled by T when $a$ and $b$ are both odd.
  expected: No.
  solution: 'Colour the board like a chessboard. Any T covers 3 squares of one colour and 1 of the other:
    its bar of three alternates colours, so the stem has the same colour as the bar''s two ends. So each
    piece has (black minus white) equal to +2 or -2. $R$ has equal numbers of black and white squares,
    so the signed contributions of all pieces must sum to 0. Dividing by 2, a sum of $ab$ values each
    equal to +1 or -1 must be 0. But $a$ and $b$ are odd, so $ab$ is odd, and a sum of an odd number of
    values $\pm1$ is odd, so it can never be 0. Hence no tiling exists.'
  common_errors:
  - Answering yes because the area is divisible by 4
  - Using a colouring under which each T is balanced, so the argument gives no information
  hints:
    rephrase: What does a chessboard colouring do to each piece?
    smaller_case: 'Take $a=b=1$, i.e. a $2\times2$ square: how many squares of each colour does it have,
      and what would a single piece cover?'
    key_idea: Track the difference between black and white squares covered, piece by piece, and reason
      about its parity.
  check: null
extensions:
  '3':
  - Prove that no $2\times n$ rectangle can be tiled by T-tetrominoes.
  '4':
  - Show that a $3\times4$ rectangle cannot be tiled by T-tetrominoes.
  '5':
  - Explain why the checkerboard argument fails for the $4\times4$ square, which can be tiled.
