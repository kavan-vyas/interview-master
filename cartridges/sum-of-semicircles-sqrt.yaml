id: sum-of-semicircles-sqrt
title: Sketch y = √(1 − x²) + √(4 − x²)
topics:
- domain
- symmetry
- derivatives
- sketching
warmup: false
answer_source: generated
statement: Sketch $y=\sqrt{1-x^2}+\sqrt{4-x^2}$.
stages:
- goal: State the domain and the symmetry of y.
  expected: 'Domain: -1 ≤ x ≤ 1. y is an even function, so the graph is symmetric about the y-axis.'
  solution: 'Both square roots need a non-negative argument: 1 - x^2 ≥ 0 and 4 - x^2 ≥ 0. The first is
    the stricter condition, so the domain is |x| ≤ 1. Since y(-x) = y(x), the graph is symmetric about
    the y-axis.'
  common_errors:
  - Using |x| ≤ 2 as the domain
  - Forgetting the stricter condition from the first root
  - Claiming the function is odd
  hints:
    rephrase: What must be true for the expression inside each square root?
    smaller_case: Is x = 1.5 allowed? Check each square root separately.
    key_idea: The domain is the intersection of the domains of the two square roots.
  check: (1-x**2).subs(x, 1)
  check_ok: true
- goal: Find y at x = 0 and at the endpoints x = ±1.
  expected: y(0) = 3. y(±1) = √3 (about 1.73).
  solution: At x = 0, y = √1 + √4 = 1 + 2 = 3. At x = ±1, y = √0 + √3 = √3.
  common_errors:
  - Taking √4 as 2 but then adding √1 incorrectly
  - Evaluating √(4 - 1) as 2
  - Forgetting the first term is zero at the endpoints
  hints:
    rephrase: Substitute the x value into each square root separately, then add.
    smaller_case: What do the two square roots become when x = 0?
    key_idea: At the endpoints one of the square roots vanishes, leaving only the other.
  check: sqrt(1-0**2)+sqrt(4-0**2)-3
  check_ok: true
- goal: Determine where y is increasing or decreasing, the maximum value, and the behaviour at the endpoints.
  expected: y is increasing on -1 ≤ x ≤ 0 and decreasing on 0 ≤ x ≤ 1. The maximum value is 3 at x = 0.
    At x = ±1 the tangent is vertical, so the curve meets those endpoints steeply.
  solution: dy/dx = -x/√(1 - x^2) - x/√(4 - x^2). For x < 0 this is positive and for x > 0 it is negative,
    so y has a maximum at x = 0. As x tends to ±1 from inside the domain, the first term tends to ∓∞,
    so the tangent is vertical at the endpoints. The graph is an arch shape, not a semicircle.
  common_errors:
  - Describing the graph as a semicircle
  - Missing the vertical tangents at the endpoints
  - Sign error in the derivative
  hints:
    rephrase: Differentiate each square root using the chain rule, then look at the sign of the result.
    smaller_case: Find the sign of dy/dx for a small negative x and for a small positive x.
    key_idea: Both terms of the derivative have the same factor -x, so the sign of the derivative depends
      only on the sign of x.
  check: diff(sqrt(1-x**2)+sqrt(4-x**2), x) + x/sqrt(1-x**2) + x/sqrt(4-x**2)
  check_ok: true
extensions:
  '3':
  - Find the exact maximum and minimum values of y on its domain.
  '4':
  - Find the exact area between the curve and the x-axis for -1 ≤ x ≤ 1.
  '5':
  - Show that y^2 = 5 - 2x^2 + 2√((1 - x^2)(4 - x^2)).
