id: tbo-quartic-perfect-square-no-real-roots
title: Real roots of x^4+2x^3+3x^2+2x+1=0
topics:
- algebra
- factorisation
- completing the square
- real roots
- polynomials
warmup: false
answer_source: pdf
statement: 'Use algebraic techniques to determine whether the following equation has any real solutions:
  $x^4+2x^3+3x^2+2x+1=0$.'
stages:
- goal: Rewrite the left side as the square of a quadratic.
  expected: x^4+2x^3+3x^2+2x+1 = (x^2+x+1)^2.
  solution: Expand (x^2+x+1)^2 = x^4 + x^2 + 1 + 2x^3 + 2x^2 + 2x = x^4 + 2x^3 + 3x^2 + 2x + 1.
  common_errors:
  - Trying to factor into two real quadratics with the wrong middle coefficients.
  - Expanding the square but forgetting the cross terms 2x^2 and 2x.
  check: x**4+2*x**3+3*x**2+2*x+1-(x**2+x+1)**2
  hints:
    rephrase: Is there a quadratic whose square has the same leading and constant terms as the quartic?
    smaller_case: Compare the coefficients of x^3 in the quartic and in the square of x^2 + bx + c for
      some b.
    key_idea: Palindromic quartics often factor as a square of a quadratic in x + 1/x, or as a square
      of x^2 + x + 1.
  check_ok: true
- goal: Show the quadratic factor is always positive.
  expected: x^2+x+1 = (x+1/2)^2 + 3/4 ≥ 3/4 > 0 for all real x.
  solution: 'Complete the square: x^2 + x + 1 = (x + 1/2)^2 + 3/4. Since a real square is non-negative,
    the expression is at least 3/4, so it is never zero.'
  common_errors:
  - Using the discriminant incorrectly, e.g. stating it is zero.
  - Concluding positivity from a few sample values only.
  check: (x+Rational(1,2))**2+Rational(3,4)-(x**2+x+1)
  hints:
    rephrase: Can you write x^2 + x + 1 as a squared term plus a positive constant?
    smaller_case: Evaluate x^2 + x + 1 at x = 0, x = -1, and x = -1/2. What pattern do you notice?
    key_idea: Complete the square on the quadratic.
  check_ok: true
- goal: Conclude whether a real solution exists.
  expected: No real solutions. The left side equals (x^2+x+1)^2, which is at least (3/4)^2 > 0 for every
    real x, so it is never 0.
  solution: Since x^2+x+1 ≥ 3/4 > 0, its square is strictly positive for every real x. Therefore x^4+2x^3+3x^2+2x+1
    > 0 and the equation has no real solutions.
  common_errors:
  - Concluding that the equation has complex roots only without stating the reasoning for the real case.
  - Confusing the squared factor being non-negative with it being zero somewhere.
  hints:
    rephrase: If a square of a real number is always positive, what does that say about the original expression?
    smaller_case: Check whether x = -1/2 makes the original expression zero.
    key_idea: Combine the factorisation with the positivity of the quadratic factor.
extensions:
  '3':
  - Find the minimum value of x^4+2x^3+3x^2+2x+1 over the real numbers and state where it occurs.
  '4':
  - For which real c does x^4+2x^3+3x^2+2x+1 = c have real solutions?
  '5':
  - For which real k does x^4+2x^3+3x^2+2x+k = 0 have a real root?
