id: fifth-powers-sum-divisible-by-five
title: Sum of 99th powers divisible by 5
topics:
- modular arithmetic
- divisibility
- powers
- pairing identity
warmup: true
answer_source: generated
statement: Prove that $1^{99}+2^{99}+3^{99}+4^{99}+5^{99}$ is divisible by $5$.
stages:
- goal: Pair the terms whose bases add to $5$ and show each pair is divisible by $5$.
  expected: $1^{99}+4^{99}$ and $2^{99}+3^{99}$ are each divisible by $5$.
  solution: Since $99$ is odd, $a+b$ divides $a^{99}+b^{99}$, because $a^{99}+b^{99}=(a+b)(a^{98}-a^{97}b+\cdots+b^{98})$.
    With $a+b=5$ for both pairs $(1,4)$ and $(2,3)$, each pair is divisible by $5$.
  common_errors:
  - Using the factorisation of $a^n-b^n$ for the sum, which needs the sign pattern for odd $n$
  - Assuming $a^{99}\equiv a \pmod 5$ without justification
  hints:
    rephrase: Which pairs of bases add up to a multiple of $5$?
    smaller_case: Check whether $1^3+4^3$ is divisible by $5$, using the same pairing idea with exponent
      $3$.
    key_idea: For odd $n$, $a+b$ divides $a^n+b^n$.
  check: Mod(1**99 + 4**99, 5)
  check_ok: true
- goal: Combine the pairs and the remaining term to conclude.
  expected: The sum is divisible by $5$.
  solution: The total is $(1^{99}+4^{99})+(2^{99}+3^{99})+5^{99}$. Each bracket is divisible by $5$ by
    stage 1, and $5^{99}$ is divisible by $5$. A sum of multiples of $5$ is a multiple of $5$, so $1^{99}+2^{99}+3^{99}+4^{99}+5^{99}$
    is divisible by $5$.
  common_errors:
  - Forgetting that $5^{99}$ is itself a multiple of $5$
  - Not stating why a sum of multiples of $5$ is a multiple of $5$
  hints:
    rephrase: Regroup the five terms so that each group is obviously a multiple of $5$.
    smaller_case: Explain why $5+10$ and $5^{99}$ are both divisible by $5$.
    key_idea: Divisibility by $5$ is preserved under addition, so it is enough to group the terms.
  check: Mod(1**99 + 2**99 + 3**99 + 4**99 + 5**99, 5)
  check_ok: true
extensions:
  '3':
  - Show that $1^n+2^n+3^n+4^n+5^n$ is divisible by $5$ for every odd positive integer $n$.
  '4':
  - Find the remainder when $1^{100}+2^{100}+3^{100}+4^{100}+5^{100}$ is divided by $5$.
  '5':
  - Prove that for a prime $p$ and an integer $k$ with $(p-1)\nmid k$, the sum $1^k+2^k+\cdots+(p-1)^k$
    is divisible by $p$.
