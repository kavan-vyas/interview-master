id: cone-water-filling-rate
title: Rising water level in an inverted cone
topics:
- related rates
- calculus
- volume of cones
- trigonometry
- chain rule
warmup: false
answer_source: generated
statement: Water is poured at a constant rate of $2\ \text{cm}^3/\text{s}$ into an inverted cone of semi-vertical
  angle $30^\circ$ (vertex pointing down). (a) Find the rate at which the water level is rising when the
  depth is 5 cm. (b) Does this rate increase or decrease as the water deepens? Explain why that makes
  sense physically.
stages:
- goal: Express the radius of the water surface in terms of the depth h.
  expected: r = h tan 30 degrees = h/sqrt(3)
  solution: The cone has semi-vertical angle 30 degrees measured from the vertical axis. In the vertical
    cross-section, the water forms a smaller similar triangle with depth h as the height and radius r
    as the base. Then tan 30 degrees = r/h, so r = h/sqrt(3).
  common_errors:
  - Using sin 30 degrees or cos 30 degrees instead of tan 30 degrees.
  - Using the full cone's half-angle as the angle to the base instead of to the axis.
  - Writing r = h*sqrt(3).
  hints:
    rephrase: Draw the vertical cross-section through the axis of the cone. Which angle is the 30 degrees
      measured from?
    smaller_case: Consider a 45 degree semi-vertical angle. What would r be in terms of h?
    key_idea: The semi-vertical angle links radius and depth through a right triangle in the cross-section.
  check: simplify(h*tan(pi/6) - h/sqrt(3))
  check_ok: true
- goal: Write the volume of water as a function of h alone and relate dV/dt to dh/dt.
  expected: V = pi h^3 / 9, and dV/dt = (pi h^2 / 3) dh/dt.
  solution: V = (1/3) pi r^2 h = (1/3) pi (h^2/3) h = pi h^3 / 9. Differentiating, dV/dt = (pi h^2 / 3)
    dh/dt.
  common_errors:
  - Using the wrong formula for the volume of a cone.
  - Forgetting to differentiate with respect to time when writing dV/dt.
  - Leaving r in the expression after it has already been replaced.
  hints:
    rephrase: Write the volume of the water in terms of the depth only.
    smaller_case: Start from the formula for a full cone and replace the radius with the expression from
      stage 1.
    key_idea: Substitute r in terms of h into V = (1/3) pi r^2 h, then differentiate with respect to time
      using the chain rule.
  check: simplify(Rational(1,3)*pi*(h/sqrt(3))**2*h - pi*h**3/9)
  check_ok: true
- goal: Find dh/dt when h = 5 cm for part (a).
  expected: dh/dt = 6/(25 pi) cm/s, about 0.0764 cm/s.
  solution: With dV/dt = 2, we have 2 = (pi h^2 / 3) dh/dt, so dh/dt = 6/(pi h^2). At h=5 this is 6/(25
    pi) cm/s.
  common_errors:
  - Substituting h=5 before differentiating, which loses the relation.
  - Taking dV/dt = -2.
  - Forgetting the factor 3 from the cone formula.
  hints:
    rephrase: Set up dV/dt = (dV/dh)(dh/dt) and rearrange for dh/dt.
    smaller_case: Find dV/dh as a function of h first.
    key_idea: The known rate dV/dt together with dV/dh determines dh/dt.
  check: simplify((2/(pi*h**2/3)).subs(h, 5) - 6/(25*pi))
  check_ok: true
- goal: For part (b), decide whether dh/dt increases or decreases with h and explain why.
  expected: dh/dt = 6/(pi h^2) decreases as h increases. The water rises more slowly as it deepens because
    the surface area of the water grows with depth, so the same inflow spreads over a larger cross-section.
  solution: 'Differentiate 6/(pi h^2): d/dh (6/(pi h^2)) = -12/(pi h^3) < 0 for h>0, so dh/dt decreases.
    Physically, the cross-sectional area of the surface is pi h^2/3, which grows with h, so a fixed volume
    inflow raises the level by less each second.'
  common_errors:
  - Claiming the rate increases because the cone widens (ignoring that the area grows).
  - Giving a justification that does not refer to the surface area.
  - Confusing dV/dt (constant) with dh/dt (varying).
  hints:
    rephrase: Look at how your formula for dh/dt changes as h gets bigger.
    smaller_case: Compare the rate of rise at h = 1 cm with the rate at h = 5 cm.
    key_idea: Think about the area of the water's surface and how it grows with depth.
  check: simplify(diff(6/(pi*h**2), h) + 12/(pi*h**3))
  check_ok: true
extensions:
  '3':
  - Find the time taken to fill the cone from empty to a depth of 5 cm at 2 cm^3/s.
  '4':
  - Repeat the calculation for a general semi-vertical angle theta and give dh/dt in terms of h and theta.
  '5':
  - If the water level instead rises at a constant 0.1 cm/s, find the rate at which water must be poured
    in when h = 5 cm.
