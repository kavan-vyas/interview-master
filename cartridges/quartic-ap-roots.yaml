    why an arithmetic progression of them must be centred at $0$.
  '4':
  - Find all real values of $m$, not only integers, for which the four roots of $x^4-(3m+2)x^2+m^2=0$
    form an arithmetic progression.
  '5':
  - Prove that $x^4+px^2+q=0$ has four distinct real roots in arithmetic progression if and only if $9p^2=100q$
    and $p<0$.
