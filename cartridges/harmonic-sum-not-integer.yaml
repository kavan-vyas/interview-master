id: harmonic-sum-not-integer
title: Harmonic sum is never an integer
topics:
- number theory
- divisibility
- 2-adic valuation
- harmonic numbers
warmup: true
answer_source: generated
statement: Show that if $n$ is a positive integer greater than one then $1+\dfrac{1}{2}+\cdots+\dfrac{1}{n}$
  is not an integer.
stages:
- goal: Check the smallest cases n=2 and n=3 by adding the fractions and reading off the denominator.
  expected: H_2 = 3/2 and H_3 = 11/6, neither of which is an integer.
  solution: 1 + 1/2 = 3/2 and 1 + 1/2 + 1/3 = 11/6. Neither has denominator 1, so neither is an integer.
  common_errors:
  - Adding denominators, e.g. writing 1/2 + 1/3 as 2/5
  - Forgetting the leading term 1
  - Assuming a fraction might simplify to an integer without checking the reduced denominator
  hints:
    rephrase: Add the fractions for the smallest n first, then ask what the reduced denominator must be
      for the result to be an integer.
    smaller_case: Start with n=2 alone and write the sum as a single fraction.
    key_idea: A fraction is an integer only when its reduced denominator is 1, so think about which primes
      can appear in the denominator of the sum.
  check: (1+sp.Rational(1,2)-sp.Rational(3,2)) + (1+sp.Rational(1,2)+sp.Rational(1,3)-sp.Rational(11,6))
  check_ok: null
- goal: For general n, let 2^k be the largest power of 2 with 2^k <= n, and identify which denominators
    carry the highest power of 2.
  expected: Exactly one index i <= n has 2-adic valuation k, namely i = 2^k. Every other index i <= n
    has v_2(i) < k, since any i with v_2(i) = k and i != 2^k is at least 3*2^k > n.
  solution: Since n >= 2, we have k >= 1. Since n < 2^(k+1), every i <= n has v_2(i) <= k. If v_2(i) =
    k then i = 2^k * j with j odd. j = 1 gives i = 2^k. j >= 3 gives i >= 3*2^k > n, which is impossible.
    So 2^k is the only index with v_2(i) = k, and every other index has v_2(i) < k.
  common_errors:
  - Using 2^(k+1) instead of 2^k as the largest power
  - Claiming several indices reach valuation k
  - Confusing the 2-adic valuation of i with the size of the term 1/i
  hints:
    rephrase: Pick the largest power of 2 that does not exceed n and ask how many multiples of it, with
      the same power of 2 in them, can lie up to n.
    smaller_case: Take n=4 and n=5 and list the powers of 2 dividing each index from 1 to n.
    key_idea: Use the fact that n is less than the next power of 2 to bound the valuations of all indices
      from above.
  check: null
- goal: Multiply the sum by L = lcm(1,...,n) and use parity to reach a contradiction with H_n being an
    integer.
  expected: L*H_n = sum of L/i. The term L/2^k is odd and every other term is even, so L*H_n is odd. But
    L is even because n >= 2, so if H_n were an integer m then L*m would be even. This is a contradiction.
  solution: Let L = lcm(1,...,n). Then L*H_n = sum over i of L/i. Since v_2(L) = k, the term L/2^k is
    odd. For i != 2^k, v_2(L/i) = k - v_2(i) >= 1, so that term is even. Hence L*H_n is odd. If H_n =
    m were an integer, L*m would be even because L is even (k >= 1). This contradicts L*H_n being odd,
    so H_n is not an integer.
  common_errors:
  - Claiming L/i is odd for all i
  - Forgetting to check that L is even, which the contradiction needs
  - Assuming v_2(L) is larger than k
  hints:
    rephrase: Clear all the denominators at once by multiplying by a number divisible by each of them,
      then compare parities of the resulting terms.
    smaller_case: 'Try n=4: multiply H_4 by 12 and see which of the four resulting terms is odd.'
    key_idea: After clearing denominators, count how many terms are odd. Then compare with the parity
      of the integer you assumed H_n equals times L.
  check: null
extensions:
  '3':
  - Explain exactly where the hypothesis n >= 2 is used in the argument, and what goes wrong for n = 1.
  - Show the 2-adic valuation of L equals k, the exponent of the largest power of 2 not exceeding n.
  '4':
  - When 1 + 1/2 + ... + 1/n is written in lowest terms with n >= 2, prove that the numerator is odd.
  '5':
  - Show that when H_n is written in lowest terms with n >= 2, the denominator is divisible by 2^k where
    2^k <= n < 2^(k+1).
  - Prove that the 2-adic valuation of the reduced denominator of H_n equals k.
