id: domino-tilings-2xn
title: Domino tilings of a 2 by 10 board
topics:
- counting
- recurrences
- tilings
- Fibonacci numbers
warmup: true
answer_source: pdf
statement: In how many ways can a $2 \times 10$ rectangle be tiled with $1 \times 2$ dominoes?
stages:
- goal: Set up a recurrence for a_n, the number of tilings of a 2 by n board, with base cases.
  expected: a_n = a_(n-1) + a_(n-2), with a_1 = 1 and a_2 = 2.
  solution: Let a_n be the number of tilings of a 2 by n board. Look at the top-left square. If it is
    covered by a vertical domino, the remaining board is 2 by (n-1), giving a_(n-1) tilings. If it is
    covered by a horizontal domino, the square below it must also be covered by a horizontal domino, since
    otherwise the cell below would be isolated. The remaining board is 2 by (n-2), giving a_(n-2) tilings.
    So a_n = a_(n-1) + a_(n-2). For base cases, a_1 = 1 (one vertical domino) and a_2 = 2 (two vertical
    dominoes, or two horizontal dominoes).
  common_errors:
  - Forgetting the case where the top-left square is covered by a horizontal domino
  - Setting a_2 = 1 and not counting the two stacked horizontal dominoes separately
  - Failing to explain why a horizontal domino must be paired with another below it
  hints:
    rephrase: Consider the square in the top-left corner and the ways it can be covered.
    smaller_case: Count the tilings of a 2 by 1 board and a 2 by 2 board by hand.
    key_idea: A horizontal domino in the corner forces a partner directly beneath it, which reduces the
      board by two columns.
  check: fibonacci(3) - 2 + fibonacci(2) - 1 == 0
  check_ok: true
- goal: Compute a_10, the number of tilings of a 2 by 10 board.
  expected: Iterating the recurrence from a_1 = 1 and a_2 = 2 gives a_3 = 3, a_4 = 5, a_5 = 8, a_6 = 13,
    a_7 = 21, a_8 = 34, a_9 = 55, a_10 = 89.
  solution: 'Using a_n = a_(n-1) + a_(n-2): a_3 = 2 + 1 = 3, a_4 = 3 + 2 = 5, a_5 = 5 + 3 = 8, a_6 = 8
    + 5 = 13, a_7 = 13 + 8 = 21, a_8 = 21 + 13 = 34, a_9 = 34 + 21 = 55, a_10 = 55 + 34 = 89. So a_10
    = 89. This is the Fibonacci sequence, shifted by one place.'
  common_errors:
  - Making an addition error when iterating the recurrence
  - Stopping at a_9 instead of a_10
  - Using the wrong base case, such as a_1 = 2
  hints:
    rephrase: Iterate the recurrence from your base cases step by step, writing down each term.
    smaller_case: Compute a_3 and a_4 explicitly and check that the pattern continues.
    key_idea: Recognise the recurrence as one you have met before, and use known terms of that sequence.
  check: fibonacci(11) - 89 == 0
  check_ok: true
extensions:
  '3':
  - Count tilings of a 2 by n board using 1 by 2 dominoes and 2 by 2 squares, and give a recurrence.
  '4':
  - Count tilings of a 3 by 2n board with 1 by 2 dominoes, which satisfy a_n = 4a_(n-1) - a_(n-2).
  '5':
  - Count tilings of a 1 by n strip using 1 by 1 squares, 1 by 2 dominoes and 1 by 3 bars.
