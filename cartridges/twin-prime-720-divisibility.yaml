statement: Let $n > 6$ be an integer such that $n-1$ and $n+1$ are prime. Prove that $720 \mid n^2(n^2+16)$.
stages:
- goal: Show that $6 \mid n$, using only the fact that $n-1$ and $n+1$ are primes larger than $3$.
  expected: Both $n-1$ and $n+1$ are primes greater than $3$, so they are odd and not divisible by $3$.
    Odd $n\pm1$ forces $n$ even. Among $n-1,n,n+1$ one is divisible by $3$, and it cannot be $n\pm1$,
    so $3 \mid n$. Hence $6 \mid n$.
  solution: Since $n>6$, we have $n-1\ge 7$ and $n+1\ge 8$. Both are prime and greater than $3$, so neither
    is divisible by $2$ or $3$. Odd $n-1$ and $n+1$ mean $n$ is even. The three consecutive integers $n-1,n,n+1$
    cover all residues mod $3$, and $n\pm1 \not\equiv 0 \pmod 3$, so $n\equiv 0 \pmod 3$. Therefore $6\mid
    n$.
  common_errors:
  - Forgetting that a prime greater than $2$ is odd, so $n-1$ and $n+1$ are odd and $n$ is even.
  - Claiming $3 \mid n$ without ruling out $n\pm1$ being the prime $3$ (which the bound $n>6$ excludes).
  - Assuming $n$ is even without using primality of $n\pm1$.
  hints:
    rephrase: Look at the parity of $n-1$ and $n+1$, then at what the three consecutive integers $n-1,n,n+1$
      must cover modulo $3$.
    smaller_case: Look at the pairs $(n-1,n+1)$ for $n=12$ and $n=18$. What do you notice about their
      parity and their remainders mod $3$?
    key_idea: A prime greater than $3$ is coprime to $6$. Use this on $n-1$ and $n+1$ and then count residues.
  check: null
- goal: Show that $16 \mid n^2(n^2+16)$ using that $n$ is even.
  expected: Write $n=2m$. Then $n^2(n^2+16)=4m^2\cdot 4(m^2+4)=16\,m^2(m^2+4)$, so $16$ divides the product.
  solution: 'With $n=2m$: $n^2=4m^2$ and $n^2+16=4m^2+16=4(m^2+4)$. The product is $4m^2\cdot 4(m^2+4)=16\,m^2(m^2+4)$,
    which is divisible by $16$ whatever $m$ is.'
  common_errors:
  - Concluding that the power of $2$ depends on whether $m$ is even or odd, when the factor $16$ is already
    explicit.
  - Forgetting the factor $4$ inside $n^2+16$.
  - Writing $n^2+16 = n^2 + 4^2$ and then failing to factor out $4$ from both terms.
  hints:
    rephrase: Substitute $n=2m$ and pull out the largest power of $2$ from each bracket separately.
    smaller_case: Compute $n^2(n^2+16)$ for $n=2$ and $n=4$ and see which powers of $2$ divide the results.
    key_idea: Factor $4$ out of both $n^2$ and $n^2+16$ before worrying about parity of $m$.
  check: n**2*(n**2+16) - 16*(n/2)**2*((n/2)**2+4)
  check_ok: true
- goal: Show that $9 \mid n^2(n^2+16)$ using that $3 \mid n$.
  expected: Since $3\mid n$, write $n=3k$. Then $n^2=9k^2$, so $9 \mid n^2$ and hence $9 \mid n^2(n^2+16)$.
  solution: From $n=3k$ we get $n^2=9k^2$, which is divisible by $9$. Multiplying by the integer $n^2+16$
    keeps the factor $9$.
  common_errors:
  - Only obtaining $3 \mid n^2$ and concluding a factor of $3$ rather than $9$.
  - Trying to use $3\mid n^2+16$ instead of the factor already in $n^2$.
  hints:
    rephrase: If $3$ divides $n$, how many factors of $3$ must $n^2$ contain?
    smaller_case: What is $6^2$ written as a multiple of $9$?
    key_idea: The square of a multiple of $3$ carries two factors of $3$.
  check: n**2 - 9*(n/3)**2
  check_ok: true
- goal: Show that $5 \mid n^2(n^2+16)$, using that $n-1$ and $n+1$ are primes larger than $5$.
  expected: Since $n-1$ and $n+1$ are not divisible by $5$, $n \not\equiv \pm1 \pmod 5$, so $n\equiv 0,2,3
    \pmod 5$. If $n\equiv0$ then $5\mid n^2$. If $n\equiv\pm2$ then $n^2\equiv 4$ and $n^2+16\equiv 4+1\equiv
    0 \pmod 5$. So $5$ divides the product in every case.
  solution: $n-1$ and $n+1$ are primes exceeding $5$ (both are at least $7$), so $5\nmid n\pm1$, giving
    $n\equiv 0,2,3\pmod 5$. For $n\equiv 0$, $5\mid n^2$. For $n\equiv 2$ or $3$, $n^2\equiv 4$ and $n^2+16\equiv
    n^2+1\equiv 0\pmod 5$. Hence $5\mid n^2(n^2+16)$.
  common_errors:
  - Treating $n\equiv 2$ or $3 \pmod 5$ as impossible.
  - Forgetting that $16\equiv 1 \pmod 5$ when reducing $n^2+16$.
  - Checking only $n\equiv 0$ and missing the other residues.
  hints:
    rephrase: Which residues mod $5$ are excluded by $n-1$ and $n+1$ both being prime? Then check the
      rest one at a time.
    smaller_case: Find the residue of $n=12$ mod $5$ and test whether $5$ divides $12^2(12^2+16)$.
    key_idea: Reduce everything modulo $5$ and test the remaining residues one by one.
  check: null
- goal: Combine the prime-power factors to conclude $720 \mid n^2(n^2+16)$.
  expected: $720 = 16\cdot 9\cdot 5$ with $16,9,5$ pairwise coprime. Each divides $n^2(n^2+16)$ by the
    previous stages, so their product $720$ divides $n^2(n^2+16)$.
  solution: Each of $16$, $9$, $5$ divides $N = n^2(n^2+16)$. Since $16$, $9$, $5$ are pairwise coprime,
    $16\cdot 9\cdot 5 = 720$ divides $N$. Hence $720 \mid n^2(n^2+16)$.
  common_errors:
  - Multiplying the divisors without checking that they are pairwise coprime (for example, $4$ and $8$
    do not combine to $32$).
  - Stating $720 = 2\cdot 3\cdot 5\cdots$ and dropping prime-power multiplicities.
  hints:
    rephrase: Can you write $720$ as a product of factors that share no prime, and check each one divides
      the expression?
    smaller_case: If $4\mid x$ and $6\mid x$, what is the least number you can guarantee divides $x$?
    key_idea: Check each prime power in the factorisation of $720$ separately, then use coprimality.
  check: 720 - 16*9*5
  check_ok: true
extensions:
  '3':
  - Verify directly that $n=12$ and $n=18$ satisfy the hypothesis and that $720$ divides $n^2(n^2+16)$
    in each case.
  - Show that $n=6$ satisfies the primality hypothesis but the conclusion fails. Which hypothesis does
    the proof need to exclude this?
  '4':
  - Show that if $n-1$, $n+1$ are primes then $n^2(n^2+16)$ is divisible by $\gcd$ of all such values
    over many $n$, and identify the value you expect.
  - Explain why $n^2+16$ alone need not be divisible by $720$ for arbitrary even $n$.
  '5':
  - Determine all residues of $n$ modulo $720$ for which $720 \mid n^2(n^2+16)$, and compare with the
    residues forced by the hypothesis.
  - 'Generalise: for which integers $m$ does $m \mid n^2(n^2+16)$ follow from $n-1$ and $n+1$ being prime?'
