statement: Sketch $y=e^{-x^2}-e^{-3x^2}$.
stages:
- goal: Establish symmetry, intercepts, sign, limits and behaviour at the origin.
  expected: The function is even. It is zero only at $x=0$, where it has a local minimum with $y''(0)=4$,
    so $y\approx2x^2$ near $0$. It is positive elsewhere. As $|x|\to\infty$, $y\to0^+$, so $y=0$ is a
    horizontal asymptote on both sides.
  solution: Replacing $x$ by $-x$ leaves the function unchanged, so it is even. Setting $y=0$ gives $e^{-x^2}=e^{-3x^2}$,
    which forces $x^2=0$. For $x\ne0$, $-x^2>-3x^2$, so $e^{-x^2}>e^{-3x^2}$ and $y>0$. Both exponentials
    tend to $0$ as $|x|\to\infty$. Expanding, $e^{-x^2}\approx1-x^2$ and $e^{-3x^2}\approx1-3x^2$, so
    $y\approx2x^2$, and $y''(0)=4>0$.
  common_errors:
  - Claiming the origin is a maximum
  - Thinking $y$ becomes negative for some $x$
  - Writing $e^{-3x^2}$ as $e^{-3}x^2$
  - Forgetting the horizontal asymptote $y=0$ on both sides
  hints:
    rephrase: Check what happens when you replace $x$ by $-x$, then ask when the two exponentials are
      equal.
    smaller_case: Compare $e^{-u}$ and $e^{-3u}$ for a small positive $u$.
    key_idea: Use the expansion $e^{t}\approx1+t$ for small $t$ to find the local behaviour at $0$.
  check: simplify(diff(exp(-x**2)-exp(-3*x**2),x,2).subs(x,0)-4)==0
  check_ok: true
- goal: Find all stationary points and the maximum value.
  expected: 'Stationary points: $x=0$ (a minimum with $y=0$), and $x=\pm\sqrt{\frac{\ln3}{2}}\approx\pm0.663$
    (maxima with $y=\frac{2}{3\sqrt3}=\frac{2\sqrt3}{9}\approx0.385$).'
  solution: $\frac{dy}{dx}=-2xe^{-x^2}+6xe^{-3x^2}=2x\left(3e^{-3x^2}-e^{-x^2}\right)$. This is zero when
    $x=0$, or when $3e^{-3x^2}=e^{-x^2}$. Dividing by $e^{-x^2}$ gives $3e^{-2x^2}=1$, so $x^2=\frac{\ln3}{2}$.
    At these points $e^{-x^2}=\frac{1}{\sqrt3}$ and $e^{-3x^2}=\frac{1}{3\sqrt3}$, so $y=\frac{1}{\sqrt3}-\frac{1}{3\sqrt3}=\frac{2}{3\sqrt3}$.
    Since $y>0$ elsewhere and $y\to0$ at infinity, these are global maxima.
  common_errors:
  - Solving $3e^{-3x^2}=e^{-x^2}$ incorrectly, for example as $x^2=\ln3$
  - Forgetting the stationary point $x=0$
  - Arithmetic slips when evaluating $e^{-3x^2}$ at the maxima
  - Miscalculating the derivative as $-2xe^{-x^2}-6xe^{-3x^2}$
  hints:
    rephrase: Set the derivative to zero and factor out a common factor.
    smaller_case: Substitute $u=x^2\ge0$ and study the resulting function of $u$.
    key_idea: Divide the critical-point equation by $e^{-x^2}$ so that only one exponential remains, then
      take logarithms.
  check: simplify(diff(exp(-x**2)-exp(-3*x**2),x).subs(x,sqrt(log(3)/2)))==0
  check_ok: true
- goal: Combine the features into a sketch and describe its shape.
  expected: The graph is M-shaped and symmetric about the $y$-axis. It touches the $x$-axis at the origin,
    rises to peaks of height about $0.385$ at $x\approx\pm0.663$, then decays back towards the $x$-axis
    as $|x|\to\infty$. It lies on or above the $x$-axis everywhere.
  solution: 'Combine the results: the curve is even, with $y\ge0$, a local and global minimum $y=0$ at
    the origin, and global maxima at $x=\pm\sqrt{\ln3/2}$ with $y=\frac{2\sqrt3}{9}$. As $|x|\to\infty$
    the curve approaches $y=0$ from above. Between the origin and each peak it rises, and beyond each
    peak it falls.'
  common_errors:
  - Drawing a single bell curve centred at the origin
  - Placing the peaks at $x=\pm1$ instead of $\pm0.663$
  - Drawing the tails below the $x$-axis
  - Omitting the asymptotic approach to $y=0$
  hints:
    rephrase: Put the origin, the peaks and the asymptote together on one diagram.
    smaller_case: Sketch $y=2x^2$ near $0$ and compare it with the peaks you have found.
    key_idea: The curve is a difference of two bell curves, one narrower than the other, so think about
      which term dominates where.
extensions:
